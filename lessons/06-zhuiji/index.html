<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>追及问题 · 为什么只追回速度差</title>
<style>/* ===== 小学数学动画课 · 公共样式 ===== */
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;
  --d-dk:#b91c1c;
  --b:#f59e0b;
  --b-lt:#fde9c4;
  --s:#94a3b8;
  --ok:#0d9488;
  --ok-lt:#ccfbf1;
  --bg:#f6f7f9;
  --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:18px 26px 32px;
}
.wrap{max-width:1400px;margin:0 auto}

/* ---------- 顶部导航 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

/* ---------- header ---------- */
header{margin-bottom:18px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;

}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}

/* ---------- layout ---------- */
.main{

  gap:20px;
  align-items:start;
}
@media (max-width:1040px){ .main{grid-template-columns:1fr} }

/* ---------- stage ---------- */
.stage-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px 8px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);

svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- 通用 svg 文本 ---------- */
.tag{font-size:22px;font-weight:800;fill:#0f172a}
.tag.sm{font-size:17px;font-weight:700;fill:#64748b}
.val{font-size:27px;font-weight:800;fill:#fff}
.valSum{font-size:19px;font-weight:800;fill:#fff}
.valRed{font-size:24px;font-weight:800;fill:#fff}
.valDark{font-size:24px;font-weight:800;fill:#0f172a}
.diffTxt{font-size:20px;font-weight:800;fill:var(--d)}
.halfTxt{font-size:21px;font-weight:800;fill:#475569}
.hintTxt{font-size:17px;font-weight:700;fill:#94a3b8}
.partNum{font-size:17px;font-weight:800;fill:#fff}

/* ---------- 通用形状 ---------- */
.barA{fill:var(--a)}
.barD{fill:var(--d)}
.barB{fill:var(--b)}
.barS{fill:var(--s)}
.barOk{fill:var(--ok)}
.patch{fill:none;stroke:var(--b);stroke-width:3;stroke-dasharray:9 8}
.patch.on{fill:var(--b-lt);stroke:var(--b);stroke-dasharray:none}
.ghost{fill:none;stroke:#cbd5e1;stroke-width:2.5;stroke-dasharray:7 7}
.split{stroke:#0f172a;stroke-width:3;stroke-linecap:round}
.alignLine{stroke:#334155;stroke-width:2.5;stroke-dasharray:6 6;opacity:.32}
.bracket{stroke:var(--d);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.segLine{stroke:#ffffff;stroke-width:3;stroke-linecap:round}
.unitBox{fill:none;stroke:var(--a);stroke-width:2;stroke-dasharray:6 5}
.cell{fill:var(--a-lt);stroke:#ffffff;stroke-width:2.5}

/* ---------- side panel ---------- */
.side{
  background:var(--card);
  border:1px solid var(--line);

.eq .hl{color:var(--d)}

/* ---------- controls ---------- */
.controls{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:16px;font-weight:800;

}

.dots{display:flex;gap:7px;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#d7dce5;cursor:pointer;transition:all .2s ease}
.dot:hover{background:#b6bfcd}
.dot.on{background:var(--a);width:24px;border-radius:5px}
.spacer{flex:1}
.kbd{font-size:13px;color:#94a3b8;font-weight:600}

/* ---------- try panel ---------- */
.try{

}
.try .lab{font-size:15px;font-weight:800;color:var(--muted)}
.try input{
  width:92px;font-family:inherit;font-size:17px;font-weight:800;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  color:var(--ink);background:#fbfcfe;font-variant-numeric:tabular-nums;
}
.try input:focus{outline:none;border-color:var(--a);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.try .unit{font-size:15px;font-weight:700;color:var(--muted)}
.try .warn{font-size:14px;font-weight:700;color:var(--d)}

/* ---------- 动画（全站统一） ---------- */
svg rect, svg text, svg g, svg circle{
  transition: width .72s cubic-bezier(.5,0,.2,1),
              height .72s cubic-bezier(.5,0,.2,1),
              x .72s cubic-bezier(.5,0,.2,1),
              y .72s cubic-bezier(.5,0,.2,1),
              opacity .42s ease,
              fill .3s ease,
              stroke .3s ease;
}
.no-anim *{transition:none !important}

/* ---------- 目录页 ---------- */
.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:18px;margin-top:22px;
}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:.18s ease;
  position:relative;overflow:hidden;
}
.card:hover{border-color:#c7d3e6;transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(15,23,42,.28)}
.card .no{
  font-size:13px;font-weight:800;letter-spacing:.08em;color:#9aa6b8;
}
.card h3{margin-top:8px;font-size:22px;font-weight:800}
.card p{margin-top:9px;font-size:15px;line-height:1.7;color:#5b6779}
.card .go{
  margin-top:16px;font-size:14px;font-weight:800;color:var(--a);
}
.card.done::after{
  content:"已做";position:absolute;top:16px;right:16px;
  font-size:12px;font-weight:800;color:var(--ok);
  background:var(--ok-lt);padding:3px 9px;border-radius:999px;
}

.card.soon{opacity:.5;pointer-events:none;background:#fbfcfd}
.card.soon .go{color:#94a3b8}
.sect-title{
  margin:36px 0 4px;font-size:19px;font-weight:800;color:#0f172a;
  display:flex;align-items:center;gap:10px;
}
.sect-title span{
  font-size:12px;font-weight:800;color:#9aa6b8;letter-spacing:.06em;
  background:#eef1f6;padding:3px 9px;border-radius:999px;
}</style>
<style>
  .t18{font-size:18px;font-weight:800}
  .ts14{font-size:14px;font-weight:700}
  #carA, #carB, #lblA, #lblB, #gapBar, #gapTxt { transition-duration:1.05s; transition-timing-function:cubic-bezier(.45,.05,.35,1); }
  #carA, #carB { transition-property: transform; }
  #lblA, #lblB, #gapTxt { transition-property: x; }
  #gapBar { transition-property: x, width; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← 全部课程</a>
    <span class="pos">第 6 课 / 8 · 追及</span>
    <span class="sp"></span>
    <a href="../05-xiangyu/index.html">← 上一课</a>
    <a href="../07-liushui/index.html">下一课：流水行船 →</a>
  </div>

  <header>
    <div class="kicker">小学数学 · 行程问题 06</div>
    <h1>追及问题：<span class="q-mark">一分钟只追回 20 米？</span></h1>
    <p class="q">乙在甲前面 <b>100 米</b>，甲每分钟走 80 米，乙每分钟走 60 米，同向同时出发，几分钟后甲追上乙？</p>
  </header>

  <div class="main">

    <section class="stage-card">
      <svg id="stage" viewBox="0 0 920 240" preserveAspectRatio="xMidYMid meet">

        <text id="clock" class="t18" x="400" y="66" text-anchor="middle" fill="#0f172a">刚出发</text>
        <text id="gapTxt" class="t18" x="160" y="128" text-anchor="middle" fill="#ef4444">相距 100 米</text>

        <rect x="80" y="157" width="640" height="18" fill="#e8ebf1"/>
        <rect id="gapBar" x="80" y="157" width="160" height="18" fill="#ef4444" opacity="0.28"/>

        <g id="carB" transform="translate(194,135)">
          <rect x="0" y="0" width="46" height="26" rx="7" fill="#f59e0b"/>
          <path d="M30 7 L41 13 L30 19 Z" fill="#ffffff"/>
          <circle cx="11" cy="26" r="5" fill="#1e293b"/>
          <circle cx="35" cy="26" r="5" fill="#1e293b"/>
        </g>
        <g id="carA" transform="translate(34,135)">
          <rect x="0" y="0" width="46" height="26" rx="7" fill="#2563eb"/>
          <path d="M30 7 L41 13 L30 19 Z" fill="#ffffff"/>
          <circle cx="11" cy="26" r="5" fill="#1e293b"/>
          <circle cx="35" cy="26" r="5" fill="#1e293b"/>
        </g>
        <text id="lblA" class="ts14" x="57" y="131" text-anchor="middle" fill="#2563eb">甲 80</text>
        <text id="lblB" class="ts14" x="217" y="131" text-anchor="middle" fill="#b45309">乙 60</text>

        <g class="ts14" fill="#94a3b8" text-anchor="middle">
          <text x="80" y="212">0</text>
          <text x="240" y="212">100</text>
          <text x="400" y="212">200</text>
          <text x="560" y="212">300</text>
          <text x="720" y="212">400</text>
        </g>
        <text class="ts14" x="760" y="212" fill="#94a3b8">米</text>

      </svg>
    </section>

    <aside class="side">
      <div class="steptag" id="steptag">第 1 步 / 共 6 步</div>
      <h2 id="t"></h2>
      <p id="h"></p>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </aside>

  </div>

  <div class="controls">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn primary" id="next">下一步 →</button>
    <div class="dots" id="dots"></div>
    <div class="spacer"></div>
    <div class="kbd">键盘 <b>←</b> <b>→</b> 翻页</div>
  </div>

  <div class="try">
    <span class="lab">换一组数字试试</span>
    <span class="unit">相距</span>
    <input id="inG" type="number" value="100" min="10" step="10">
    <span class="unit">甲速</span>
    <input id="inV1" type="number" value="80" min="1" step="1">
    <span class="unit">乙速</span>
    <input id="inV2" type="number" value="60" min="1" step="1">
    <button class="btn" id="apply">重新画</button>
    <span class="warn" id="warn"></span>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  const X1 = 80, PX = 1.6, CARW = 46, CAR_Y = 135;
  const S = { gap: 100, v1: 80, v2: 60, step: 0 };

  function geom(){
    const bx0 = X1 + S.gap * PX;
    const hit = S.gap / (S.v1 - S.v2);
    return { bx0, hit };
  }

  /* 第 0~3 步分别走到第 0 / 1 / 2 / 追上 分钟 */
  function minutesOf(st, hit){
    if(st <= 0) return 0;
    if(st >= 3) return hit;
    return st;
  }

  const STEPS = [
    {
      t: '一个在后面追，一个在前面跑',
      h: '乙在前面 100 米处，每分钟走 60 米。<br>甲在后面，每分钟走 80 米。<br>两人<b>同方向</b>同时出发，甲几分钟追上乙？<br><br>注意：这是"追"，不是"碰面" —— 乙不会停下来等甲。',
      eq: '相距 100 米　甲 80 米/分　乙 60 米/分'
    },
    {
      t: '第 1 分钟：只追回 20 米',
      h: '甲走了 <b>80</b>，乙也走了 <b>60</b>。<br>所以两人之间的距离只缩短了 <em>80 − 60 = 20</em>，还剩 80。<br><br><b>这一段最关键</b>：甲不是"一分钟靠近 80 米"，因为乙也在跑，甲只捞回 20 米。',
      eq: '80 − 60 = 20（每分钟拉近这么多）\n100 − 20 = 80'
    },
    {
      t: '第 2 分钟：又拉近 20',
      h: '距离从 80 变成 60。<br>每一分钟都稳定拉近 20 —— 不快也不慢，这就是"速度差"的含义。',
      eq: '80 − 20 = 60'
    },
    {
      t: '还剩 60 米，还要几分钟？',
      h: '每分钟拉近 20，所以还要 <b>60 ÷ 20 = 3 分钟</b>。<br>加上已经走的 2 分钟，一共 <b>5 分钟</b>。<br><br>不用一分钟一分钟地数：<b>100 ÷ 20 = 5</b>，一次就出来。',
      eq: '60 ÷ 20 = 3\n2 + 3 = <span class="ok">5</span> 分钟'
    },
    {
      t: '为什么用"速度差"',
      h: '同方向走，乙也在往前跑，所以甲"追回"的只是两人速度的<b>差</b> —— 相当于"一个人在靠近 20 米/分"。<br><br>和相遇比一比：<br>· 相向而行，距离缩短得<b>快</b> → 用 <em>速度和</em><br>· 同向追及，距离缩短得<b>慢</b> → 用 <em>速度差</em>',
      eq: '速度差 = 80 − 60 = 20 米/分\n追及时间 = 100 ÷ 20 = 5 分钟'
    },
    {
      t: '公式，以及一个自查办法',
      h: '追及时间 = 路程差 ÷ 速度差。这里的"路程差"就是一开始两人相差的那段距离。<br><br>自己验一验：甲走了 5 × 80 = 400 米，乙走了 5 × 60 = 300 米，<b>400 − 300 = 100</b>，正好补上原来的差距 ✓<br><br>如果算出来"甲走的 − 乙走的"不等于原来的差距，那就是用错公式了。',
      eq: '追及时间 = 路程差 ÷ (甲速 − 乙速)\n甲走的 − 乙走的 = 原来的差距'
    }
  ];

  function render(anim){
    const g = geom(), st = S.step;
    const stage = $('stage');
    if(!anim) stage.classList.add('no-anim');

    const t = minutesOf(st, g.hit);
    const ax = X1 + S.v1 * t * PX;
    const bx = g.bx0 + S.v2 * t * PX;

    $('carA').setAttribute('transform', `translate(${(ax - CARW).toFixed(2)},${CAR_Y})`);
    $('carB').setAttribute('transform', `translate(${bx.toFixed(2)},${CAR_Y})`);
    $('lblA').setAttribute('x', (ax - CARW / 2).toFixed(2));
    $('lblB').setAttribute('x', (bx + CARW / 2).toFixed(2));

    const gapPx = Math.max(0, bx - ax);
    $('gapBar').setAttribute('x', ax.toFixed(2));
    $('gapBar').setAttribute('width', gapPx.toFixed(2));
    $('gapBar').setAttribute('opacity', gapPx > 0.5 ? 0.28 : 0);

    const gapM = Math.round(gapPx / PX);
    $('gapTxt').setAttribute('x', ((ax + bx) / 2).toFixed(2));
    $('gapTxt').textContent = gapM <= 0 ? '追上了！' : `相距 ${gapM} 米`;
    $('gapTxt').setAttribute('y', gapM <= 0 ? 122 : 128);

    $('clock').textContent = t === 0 ? '刚出发'
                          : (t >= g.hit ? `出发 ${g.hit} 分钟后 —— 追上` : `出发 ${t} 分钟后`);

    const dur = st === 3 ? '2.4s' : '1.05s';
    ['carA','carB','lblA','lblB','gapBar','gapTxt'].forEach(id => $(id).style.transitionDuration = dur);

    const cur = STEPS[st];
    $('steptag').textContent = `第 ${st + 1} 步 / 共 ${STEPS.length} 步`;
    $('t').textContent = cur.t;
    $('h').innerHTML = cur.h;
    $('eq').innerHTML = cur.eq;

    $('prev').disabled = st === 0;
    $('next').disabled = st === STEPS.length - 1;
    $('next').textContent = st === STEPS.length - 1 ? '已经讲完了'
                         : (st <= 2 ? '走 1 分钟 →' : '下一步 →');
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === st));

    if(!anim){
      void stage.offsetWidth;
      requestAnimationFrame(() => stage.classList.remove('no-anim'));
    }
  }

  function go(n){
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    if(n === S.step) return;
    S.step = n; render(true);
  }

  $('prev').addEventListener('click', () => go(S.step - 1));
  $('next').addEventListener('click', () => go(S.step + 1));
  STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.title = `第 ${i + 1} 步`;
    d.addEventListener('click', () => go(i));
    $('dots').appendChild(d);
  });
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(S.step + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(S.step - 1); }
  });

  $('apply').addEventListener('click', () => {
    const g0 = parseInt($('inG').value, 10);
    const v1 = parseInt($('inV1').value, 10);
    const v2 = parseInt($('inV2').value, 10);
    const warn = $('warn');
    if(![g0,v1,v2].every(Number.isFinite) || g0 <= 0 || v1 <= 0 || v2 <= 0){
      warn.textContent = '三个数都要是正整数'; return;
    }
    if(v1 <= v2){ warn.textContent = '甲速要比乙速大，不然永远追不上'; return; }
    if(g0 % (v1 - v2) !== 0){
      warn.textContent = `差距要能被速度差 ${v1 - v2} 整除`; return;
    }
    warn.textContent = '';
    S.gap = g0; S.v1 = v1; S.v2 = v2; S.step = 0;
    render(false);
  });

  render(false);
