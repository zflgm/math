<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>流水行船 · 顺水逆水的差，正好是两个水速</title>
<style>/* ===== 小学数学动画课 · 公共样式 ===== */
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;
  --d-dk:#b91c1c;

  --bg:#f6f7f9;
  --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;

}
.wrap{max-width:1400px;margin:0 auto}

/* ---------- 顶部导航 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{

  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

/* ---------- header ---------- */
header{margin-bottom:18px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;

}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
h1 .q-mark{color:var(--d)}

/* ---------- layout ---------- */
.main{

}

/* ---------- stage ---------- */

  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);

svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- 通用 svg 文本 ---------- */
.tag{font-size:22px;font-weight:800;fill:#0f172a}
.tag.sm{font-size:17px;font-weight:700;fill:#64748b}
.val{font-size:27px;font-weight:800;fill:#fff}

.valRed{font-size:24px;font-weight:800;fill:#fff}
.valDark{font-size:24px;font-weight:800;fill:#0f172a}

/* ---------- 通用形状 ---------- */
.barA{fill:var(--a)}

.unitBox{fill:none;stroke:var(--a);stroke-width:2;stroke-dasharray:6 5}

/* ---------- side panel ---------- */
.side{

.dot:hover{background:#b6bfcd}

/* ---------- try panel ---------- */
.try{

}

}

/* ---------- 动画（全站统一） ---------- */
svg rect, svg text, svg g, svg circle{
  transition: width .72s cubic-bezier(.5,0,.2,1),
              height .72s cubic-bezier(.5,0,.2,1),
              x .72s cubic-bezier(.5,0,.2,1),
              y .72s cubic-bezier(.5,0,.2,1),
              opacity .42s ease,
              fill .3s ease,
              stroke .3s ease;
}
.no-anim *{transition:none !important}

/* ---------- 目录页 ---------- */
.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:18px;margin-top:22px;
}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:.18s ease;
  position:relative;overflow:hidden;
}
.card:hover{border-color:#c7d3e6;transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(15,23,42,.28)}
.card .no{
  font-size:13px;font-weight:800;letter-spacing:.08em;color:#9aa6b8;
}
.card h3{margin-top:8px;font-size:22px;font-weight:800}
.card p{margin-top:9px;font-size:15px;line-height:1.7;color:#5b6779}
.card .go{
  margin-top:16px;font-size:14px;font-weight:800;color:var(--a);
}

}

.sect-title{
  margin:36px 0 4px;font-size:19px;font-weight:800;color:#0f172a;

}

  font-size:12px;font-weight:800;color:#9aa6b8;letter-spacing:.06em;
  background:#eef1f6;padding:3px 9px;border-radius:999px;
}</style>
<style>
  .t18{font-size:18px;font-weight:800}
  .ts14{font-size:14px;font-weight:700}
  .ts15{font-size:15px;font-weight:700}
  @keyframes flow { to { stroke-dashoffset: -64 } }

<body>
<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← 全部课程</a>
    <span class="pos">第 7 课 / 8 · 流水行船</span>
    <span class="sp"></span>
    <a href="../06-zhuiji/index.html">← 上一课</a>
    <a href="../08-guoche/index.html">下一课：火车过桥 →</a>
  </div>

  <header>
    <div class="kicker">小学数学 · 行程问题 07</div>
    <h1>流水行船：<span class="q-mark">为什么 (顺+逆)÷2 就是船速？</span></h1>
    <p class="q">一条船顺水每小时行 <b>20 千米</b>，逆水每小时行 <b>12 千米</b>。求船自己在静水里的速度和水流速度。</p>
  </header>

  <div class="main">

    <section class="stage-card">
      <svg id="stage" viewBox="0 0 920 316" preserveAspectRatio="xMidYMid meet">

        <rect x="60" y="42" width="800" height="258" rx="18" fill="#eaf6fe"/>
        <line class="wave" x1="80" y1="180" x2="840" y2="180" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="14 20"/>
        <line class="wave" x1="80" y1="288" x2="840" y2="288" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="14 20"/>
        <text class="ts15" x="80" y="64" fill="#0284c7">水流方向 →</text>

        <!-- 顺水 -->
        <text class="ts15" x="128" y="112" text-anchor="end" fill="#b45309">顺水</text>
        <rect id="b1" class="barT" x="140" y="94" width="520" height="40" rx="8" fill="#2563eb"/>
        <rect id="w1" class="barT" x="660" y="94" width="0" height="40" rx="8" fill="#0ea5e9"/>
        <text id="t1a" class="ts15" x="400" y="120" text-anchor="middle" fill="#ffffff" opacity="0">船自己 16</text>
        <text id="t1b" class="ts15" x="712" y="120" text-anchor="middle" fill="#ffffff" opacity="0">水 4</text>
        <text id="v1" class="t18" x="676" y="106" fill="#0f172a">顺水 20</text>
        <text id="v1b" class="ts14" x="676" y="126" fill="#64748b">千米/时</text>

        <!-- 逆水 -->
        <text class="ts15" x="128" y="232" text-anchor="end" fill="#b45309">逆水</text>
        <rect id="b2" class="barT" x="140" y="214" width="312" height="40" rx="8" fill="#2563eb"/>
        <rect id="ghost2" class="barT" x="452" y="214" width="0" height="40" rx="8" fill="#cfe4fb"/>
        <text id="t2a" class="ts15" x="300" y="240" text-anchor="middle" fill="#ffffff" opacity="0">船自己 16</text>
        <text id="v2" class="t18" x="468" y="226" fill="#0f172a">逆水 12</text>
        <text id="v2b" class="ts14" x="468" y="246" fill="#64748b">千米/时</text>

        <!-- 反向的水 -->
        <line id="back" x1="556" y1="264" x2="452" y2="264" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" opacity="0" marker-end="url(#ar)"/>
        <text id="backT" class="ts14" x="504" y="284" text-anchor="middle" fill="#0284c7" opacity="0">水顶回 4</text>

        <!-- 差值标记 -->
        <line id="dMark" x1="452" y1="70" x2="660" y2="70" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0" marker-start="url(#ar)" marker-end="url(#ar)"/>
        <text id="dTxt" class="t18" x="556" y="62" text-anchor="middle" fill="#ef4444" opacity="0">差 8</text>

        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>

      </svg>
    </section>

    <aside class="side">
      <div class="steptag" id="steptag">第 1 步 / 共 7 步</div>
      <h2 id="t"></h2>
      <p id="h"></p>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </aside>

  </div>

  <div class="controls">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn primary" id="next">下一步 →</button>
    <div class="dots" id="dots"></div>
    <div class="spacer"></div>
    <div class="kbd">键盘 <b>←</b> <b>→</b> 翻页</div>
  </div>

  <div class="try">
    <span class="lab">换一组数字试试</span>
    <span class="unit">顺水</span>
    <input id="inS" type="number" value="20" min="2" step="1">
    <span class="unit">逆水</span>
    <input id="inN" type="number" value="12" min="1" step="1">
    <button class="btn" id="apply">重新画</button>
    <span class="warn" id="warn"></span>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  const X0 = 140, K = 26;          // 1 千米/时 = 26 像素
  const S = { s: 20, n: 12, step: 0 };

  function geom(){
    const w = (S.s - S.n) / 2;         // 水速
    const b = (S.s + S.n) / 2;         // 船速
    return { w, b,
             lenS: S.s * K, lenN: S.n * K,
             lenB: b * K,   lenW: w * K };
  }

  const STEPS = [
    {
      t: '两条路，一快一慢',
      h: '同一条船，同一段水路：<br>顺水每小时跑 <b>20 千米</b>，逆水每小时只有 <b>12 千米</b>。<br>差的这 8 千米，全是水在搞鬼。',
      eq: '顺水 20 千米/时\n逆水 12 千米/时'
    },
    {
      t: '两条都 = 船自己 ± 水',
      h: '船自己在静水里有个固定速度，叫 <b>船速</b>；水也有个速度，叫 <b>水速</b>。<br><br>顺水，水帮着推：<b>顺水 = 船速 + 水速</b><br>逆水，水顶着挡：<b>逆水 = 船速 − 水速</b><br><br>船速是同一个数，水速也是同一个数。',
      eq: '顺水 = 船速 + 水速 = 20\n逆水 = 船速 − 水速 = 12'
    },
    {
      t: '看两条的右端差多少',
      h: '两个式子一比，差别只在一个"加"一个"减"。<br>所以它们差的这 <em>8 千米/时</em>，是"水推了一把"和"水挡了一下"的<b>差距</b>。',
      eq: '20 − 12 = 8'
    },
    {
      t: '这 8，正好是 2 个水速',
      h: '水推一把 +4，水挡一下 −4 —— 一加一减之间，差了 <b>两个水速</b>。<br>所以：<b>8 ÷ 2 = 4</b>，水速是 4 千米/时。<br><br>这一步就是 <em>(顺 − 逆) ÷ 2</em> 的来历。',
      eq: '(20 − 12) ÷ 2 = <span class="ok">4</span>　→ 水速'
    },
    {
      t: '知道水速，船速就好办了',
      h: '顺水 20 里，有 4 是水帮着推的，所以船自己跑 <b>16</b>。<br>反过来验：逆水时 16 被水顶回 4，剩 12 ✓<br><br>看图上：红色段是船自己的 <b>16</b>，蓝色段是水；逆水时那 4 被水流顶回去了。',
      eq: '船速 = 20 − 4 = <span class="ok">16</span>\n验：16 − 4 = 12 ✓'
    },
    {
      t: '另一条路：把两式加起来',
      h: '把两个式子直接相加：<br>(船速 + 水速) + (船速 − 水速) = <b>2 × 船速</b><br><br>水一加一减，刚好抵消掉。<br>所以 20 + 12 = 32 = 2 个船速，船速 = 32 ÷ 2 = 16。<br><br>两条路都通，答案一样。',
      eq: '20 + 12 = 32 = 2 × 船速\n32 ÷ 2 = <span class="ok">16</span>　→ 船速'
    },
    {
      t: '两个公式，一起记',
      h: '水速 =（顺水 − 逆水）÷ 2 —— 差的是一正一负，所以要除以 2。<br>船速 =（顺水 + 逆水）÷ 2 —— 加的时候水抵消了，剩下的两个船平分。<br><br>两个都是 ÷2，因为它们都是"两份东西"的平均。<br><br>顺带一个常考变式：<em>船在静水中的速度，就是船速</em>；题目说"船速"和"静水速度"是一回事。',
      eq: '船速 = (顺 + 逆) ÷ 2\n水速 = (顺 − 逆) ÷ 2'
    }
  ];

  function render(anim){
    const g = geom(), st = S.step;
    const stage = $('stage');
    if(!anim) stage.classList.add('no-anim');

    /* 上条（顺水） */
    const split1 = st >= 4;
    $('b1').setAttribute('width', (split1 ? g.lenB : g.lenS).toFixed(2));
    $('b1').setAttribute('fill', '#2563eb');
    $('w1').setAttribute('x', (X0 + g.lenB).toFixed(2));
    $('w1').setAttribute('width', split1 ? g.lenW.toFixed(2) : 0);
    $('t1a').setAttribute('opacity', split1 ? 1 : 0);
    $('t1a').setAttribute('x', (X0 + g.lenB / 2).toFixed(2));
    $('t1b').setAttribute('opacity', split1 && g.lenW > 46 ? 1 : 0);
    $('t1b').setAttribute('x', (X0 + g.lenB + g.lenW / 2).toFixed(2));

    /* 下条（逆水） */
    const split2 = st >= 5;
    $('b2').setAttribute('width', (split2 ? g.lenB : g.lenN).toFixed(2));
    $('ghost2').setAttribute('x', (X0 + g.lenN).toFixed(2));
    $('ghost2').setAttribute('width', split2 ? (g.lenB - g.lenN).toFixed(2) : 0);
    $('t2a').setAttribute('opacity', split2 && g.lenB > 90 ? 1 : 0);
    $('t2a').setAttribute('x', (X0 + g.lenB / 2).toFixed(2));

    $('back').setAttribute('opacity', split2 ? 1 : 0);
    $('back').setAttribute('x1', (X0 + g.lenB).toFixed(2));
    $('back').setAttribute('x2', (X0 + g.lenN).toFixed(2));
    $('backT').setAttribute('opacity', split2 ? 1 : 0);
    $('backT').setAttribute('x', (X0 + g.lenN + g.lenW / 2).toFixed(2));

    /* 差值标记（第 2、3 步） */
    const dOn = (st === 2 || st === 3);
    const x1 = X0 + g.lenN, x2 = X0 + g.lenS;
    $('dMark').setAttribute('opacity', dOn ? 1 : 0);
    $('dMark').setAttribute('x1', x1.toFixed(2));
    $('dMark').setAttribute('x2', x2.toFixed(2));
    $('dTxt').setAttribute('opacity', dOn ? 1 : 0);
    $('dTxt').setAttribute('x', ((x1 + x2) / 2).toFixed(2));
    $('dTxt').textContent = st === 3 ? `差 ${S.s - S.n} = 2 个水速` : `差 ${S.s - S.n}`;

    /* 右侧数值文字跟随 */
    $('v1').setAttribute('x', (X0 + g.lenS + 16).toFixed(2));
    $('v1b').setAttribute('x', (X0 + g.lenS + 16).toFixed(2));
    $('v1').textContent = `顺水 ${S.s}`;
    $('v2').setAttribute('x', (X0 + g.lenN + 16).toFixed(2));
    $('v2b').setAttribute('x', (X0 + g.lenN + 16).toFixed(2));
    $('v2').textContent = `逆水 ${S.n}`;

    const cur = STEPS[st];
    $('steptag').textContent = `第 ${st + 1} 步 / 共 ${STEPS.length} 步`;
    $('t').textContent = cur.t;
    $('h').innerHTML = cur.h;
    $('eq').innerHTML = cur.eq;

    $('prev').disabled = st === 0;
    $('next').disabled = st === STEPS.length - 1;
    $('next').textContent = st === STEPS.length - 1 ? '已经讲完了' : '下一步 →';
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === st));

    if(!anim){
      void stage.offsetWidth;
      requestAnimationFrame(() => stage.classList.remove('no-anim'));
    }
  }

  function go(n){
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    if(n === S.step) return;
    S.step = n; render(true);
  }

  $('prev').addEventListener('click', () => go(S.step - 1));
  $('next').addEventListener('click', () => go(S.step + 1));
  STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.title = `第 ${i + 1} 步`;
    d.addEventListener('click', () => go(i));
    $('dots').appendChild(d);
  });
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(S.step + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(S.step - 1); }
  });

  $('apply').addEventListener('click', () => {
    const s = parseInt($('inS').value, 10);
    const n = parseInt($('inN').value, 10);
    const warn = $('warn');
    if(!Number.isFinite(s) || !Number.isFinite(n) || s <= 0 || n <= 0){
      warn.textContent = '两个数都要是正整数'; return;
    }
    if(s <= n){ warn.textContent = '顺水要比逆水快'; return; }
    if((s - n) % 2 !== 0 || (s + n) % 2 !== 0){
      warn.textContent = '顺水和逆水要同奇偶，不然船速是小数'; return;
    }
    if(n * K + 200 > 780){ warn.textContent = '数值别太大，画不下了'; return; }
    warn.textContent = '';
    S.s = s; S.n = n; S.step = 0;
    render(false);
  });

  render(false);
})();
</script>
</body>
</html>
