<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>烙饼 · 3 张只要 9 分钟</title>
<style>
/* ===== 小学数学动画课 · 公共样式 ===== */
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;
  --d-dk:#b91c1c;
  --b:#f59e0b;
  --b-lt:#fde9c4;
  --s:#94a3b8;
  --ok:#0d9488;
  --ok-lt:#ccfbf1;
  --bg:#f6f7f9;
  --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:18px 26px 32px;
}
.wrap{max-width:1400px;margin:0 auto}

/* ---------- 顶部导航 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

/* ---------- header ---------- */
header{margin-bottom:4px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;
  margin-bottom:11px;
}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
h1 .q-mark{color:var(--d)}
.q{margin-top:10px;font-size:20px;line-height:1.7;color:#334155;font-weight:500}
.q b{color:var(--a);font-weight:800}
.q em{font-style:normal;color:var(--d);font-weight:800}

/* ---------- 章节按钮 ---------- */
.chaps{display:flex;gap:10px;margin:16px 0 14px;flex-wrap:wrap}
.chaps button{
  appearance:none;font-family:inherit;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  font-size:16px;font-weight:800;padding:11px 18px;border-radius:13px;
  transition:.16s;display:flex;align-items:center;gap:11px;text-align:left;
}
.chaps button b{
  width:29px;height:29px;border-radius:9px;background:#f1f4f9;color:#8b97a8;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;
  transition:.16s;
}
.chaps button span{display:flex;flex-direction:column;gap:2px;line-height:1.24}
.chaps button small{font-size:12px;font-weight:700;color:#a3aebf;letter-spacing:.02em}
.chaps button:hover{border-color:#cbd5e1;background:#fbfcfe}
.chaps button.on{
  background:var(--a);border-color:var(--a);color:#fff;
  box-shadow:0 8px 20px -10px rgba(37,99,235,.75);
}
.chaps button.on b{background:rgba(255,255,255,.22);color:#fff}
.chaps button.on small{color:#c7d9fb}

/* ---------- layout ---------- */
.main{
  display:grid;
  grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);
  gap:20px;
  align-items:stretch;
}
@media (max-width:1040px){ .main{grid-template-columns:1fr} }

/* ---------- stage ---------- */
.stage-card{
  background:linear-gradient(180deg,#fffdf7 0%,#ffffff 58%);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px 8px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
}
svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- side panel ---------- */
.side{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
  min-height:340px;
  display:flex;flex-direction:column;
}
.steptag{
  font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.side h2{margin-top:10px;font-size:23px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.side p{margin-top:12px;font-size:17px;line-height:1.85;color:#3f4b5f}
.side p b{color:var(--a);font-weight:800}
.side p em{font-style:normal;color:var(--d);font-weight:800}
.side p i{font-style:normal;color:var(--ok);font-weight:800}
.eqbox{margin-top:auto;padding-top:18px}
.eq{
  background:#f8fafc;
  border:1px solid #eef1f6;
  border-left:4px solid var(--a);
  border-radius:10px;
  padding:14px 16px;
  font-size:20px;font-weight:800;
  line-height:1.85;
  font-variant-numeric:tabular-nums;
  color:#0f172a;
  white-space:pre-line;
}
.eq .hl{color:var(--d)}
.eq .ok{color:var(--ok)}

/* ---------- controls ---------- */
.controls{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:16px;font-weight:800;
  padding:11px 20px;border-radius:11px;cursor:pointer;
  transition:all .16s ease;font-family:inherit;
}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{
  background:var(--a);border-color:var(--a);color:#fff;
  box-shadow:0 6px 16px -8px rgba(37,99,235,.7);
}
.btn.primary:hover:not(:disabled){background:var(--a-dk);border-color:var(--a-dk)}
.dots{display:flex;gap:7px;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#d7dce5;cursor:pointer;transition:all .2s ease}
.dot:hover{background:#b6bfcd}
.dot.on{background:var(--a);width:24px;border-radius:5px}
.spacer{flex:1}
.kbd{font-size:13px;color:#94a3b8;font-weight:600}
.kbd b{
  display:inline-block;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;
  font-family:inherit;color:#64748b;margin:0 2px;
}

/* ---------- 本页 ---------- */
#gScene,#gFaces,#gRule{transition:opacity .38s ease}
#gFaces,#gRule{pointer-events:none}
.cake{transition:transform .8s cubic-bezier(.45,.05,.35,1)}
.cake .inner{transform-box:fill-box;transform-origin:center;transition:transform .2s ease}
.cake .inner.flip{transform:scaleX(.08)}
.cake .body{transition:fill .45s ease}
.cake .num{font-size:32px;font-weight:800;fill:#7a4a12;font-variant-numeric:tabular-nums}
.cake .bdg{font-size:15px;font-weight:800;fill:#7a4a12}
#heat{transition:opacity .55s ease}
.st-t{font-size:17px;font-weight:800;fill:#94a3b8}
#tm{font-size:36px;font-weight:800;fill:#0f172a;font-variant-numeric:tabular-nums}
#note{font-size:16px;font-weight:800;fill:#94a3b8;transition:fill .3s ease}
.rl{font-size:18px;font-weight:800;fill:#475569}
.rs{font-size:14px;font-weight:700;fill:#a8b3c2;font-variant-numeric:tabular-nums}
.ct{font-size:18px;font-weight:800;fill:#0f172a}
.ct.waste{fill:#dc2626;font-size:17px}
.hd{font-size:14px;font-weight:800;fill:#a8b3c2;letter-spacing:.04em}
.wp{animation:wp 1.15s ease-in-out infinite}
@keyframes wp{0%,100%{stroke-opacity:1}50%{stroke-opacity:.18}}
#freeHint{transition:opacity .3s ease}
#freeHint.on{animation:hp 1.5s ease-in-out infinite}
@keyframes hp{0%,100%{opacity:.35}50%{opacity:1}}
.fh{font-size:19px;font-weight:800;fill:#a7f3e4}
.ov-t{font-size:28px;font-weight:800;fill:#0f172a}
.ov-s{font-size:16px;font-weight:700;fill:#94a3b8}
.fc-t{font-size:17px;font-weight:800;fill:#7a4a12}
.fc-l{font-size:19px;font-weight:800;fill:#475569}
.fc-s{font-size:15px;font-weight:700;fill:#a8b3c2}
.ov-big{font-size:30px;font-weight:800;fill:#0f172a;font-variant-numeric:tabular-nums}
.card-n{font-size:17px;font-weight:800;fill:#475569}
.card-v{font-size:24px;font-weight:800;fill:#0f172a;font-variant-numeric:tabular-nums}

/* gFaces 里，面片的位置与透明度都做过渡 */
#gFaces .face{transition:opacity .5s ease, transform .72s cubic-bezier(.45,.05,.35,1)}
#gFaces .rlab{transition:opacity .45s ease}
#gFaces .feq{transition:opacity .45s ease}

/* 快进：关掉一切过渡，瞬间到位 */
body.instant *, body.instant *::before, body.instant *::after{
  transition:none !important;
  animation:none !important;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← 全部课程</a>
    <span class="pos">第 17 课 · 烙饼</span>
    <span class="sp"></span>
    <a href="../16-zhaocipin/index.html">← 上一课</a>
    <a href="../18-qicha/index.html">下一课：沏茶 →</a>
    <a href="../../index.html">回到目录 →</a>
  </div>

  <header>
    <div class="kicker">小学数学 · 数学广角 17</div>
    <h1>烙饼：<span class="q-mark">锅不能空着</span></h1>
    <p class="q">一口锅一次最多烙 <b>2 张</b>饼，每面要 <b>3 分钟</b>。烙 3 张饼，最少 <b>几分钟</b>？</p>
  </header>

  <div class="chaps" id="chaps">
    <button class="chap on" data-c="0">
      <b>一</b><span>老实算<small>12 分钟是怎么来的</small></span>
    </button>
    <button class="chap" data-c="1">
      <b>二</b><span>换着烙<small>2 号出锅，3 号补位</small></span>
    </button>
    <button class="chap" data-c="2">
      <b>三</b><span>找规律<small>为什么是 3n</small></span>
    </button>
  </div>

  <div class="main">

    <section class="stage-card">
      <svg id="stage" viewBox="0 0 960 504" preserveAspectRatio="xMidYMid meet">

        <defs>
          <radialGradient id="panG" cx="42%" cy="36%" r="70%">
            <stop offset="0" stop-color="#4f5a68"/>
            <stop offset="0.72" stop-color="#39424f"/>
            <stop offset="1" stop-color="#2a313c"/>
          </radialGradient>
          <radialGradient id="panIn" cx="46%" cy="40%" r="66%">
            <stop offset="0" stop-color="#6b7686"/>
            <stop offset="1" stop-color="#3d4653"/>
          </radialGradient>
          <radialGradient id="heatG" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#fb923c" stop-opacity=".62"/>
            <stop offset="0.62" stop-color="#f97316" stop-opacity=".22"/>
            <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#9a6b3f"/>
            <stop offset="1" stop-color="#6b4423"/>
          </linearGradient>
          <linearGradient id="boardG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f7ecd9"/>
            <stop offset="1" stop-color="#eddfc6"/>
          </linearGradient>
        </defs>

        <g id="gScene">

          <text class="st-t" x="40" y="42">这口锅一次最多放 2 张</text>

          <rect x="398" y="182" width="112" height="28" rx="14" fill="url(#wood)"/>
          <circle cx="272" cy="196" r="142" fill="#525c6b" stroke="#98a3b2" stroke-width="2"/>
          <circle cx="272" cy="196" r="133" fill="url(#panG)"/>
          <circle cx="272" cy="196" r="128" fill="url(#panIn)"/>
          <circle cx="272" cy="196" r="128" fill="none" stroke="#1b212b" stroke-opacity=".55" stroke-width="3"/>
          <circle id="heat" cx="272" cy="196" r="128" fill="url(#heatG)" opacity="0"/>
          <path d="M182 133 A110 110 0 0 1 300 90" fill="none" stroke="#ffffff" stroke-opacity=".14" stroke-width="11" stroke-linecap="round"/>
          <path d="M212 268 A92 92 0 0 0 300 292" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="7" stroke-linecap="round"/>

          <rect x="74" y="350" width="396" height="124" rx="20" fill="url(#boardG)" stroke="#e0caa5" stroke-width="1.6"/>
          <rect x="84" y="360" width="376" height="104" rx="14" fill="none" stroke="#e9dabb" stroke-width="1.4"/>
          <line x1="96" y1="368" x2="96" y2="456" stroke="#e5d3b0" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="448" y1="368" x2="448" y2="456" stroke="#e5d3b0" stroke-width="1.6" stroke-linecap="round"/>
          <text class="rs" x="272" y="496" text-anchor="middle">案 板</text>

          <g id="freeHint" opacity="0">
            <circle cx="336" cy="196" r="58" fill="#0d9488" fill-opacity=".16" stroke="#5eead4" stroke-width="3" stroke-dasharray="9 7"/>
            <text class="fh" x="336" y="196" text-anchor="middle" dominant-baseline="central">空位</text>
          </g>

          <g id="gCakes"></g>

          <text class="hd" x="545" y="44">时 间 表</text>
          <text class="hd" x="716" y="74" text-anchor="middle">位置 1</text>
          <text class="hd" x="838" y="74" text-anchor="middle">位置 2</text>
          <g id="gTable"></g>

          <text class="rs" x="545" y="392">已用时间</text>
          <text id="tm" x="545" y="434">0 分钟</text>
          <text id="note" x="545" y="466"></text>

        </g>

        <g id="gFaces" opacity="0"></g>
        <g id="gRule" opacity="0"></g>

      </svg>
    </section>

    <aside class="side">
      <div class="steptag" id="steptag"></div>
      <h2 id="h"></h2>
      <p id="t"></p>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </aside>

  </div>

  <div class="controls">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn primary" id="next">下一步 →</button>
    <div class="dots" id="dots"></div>
    <div class="spacer"></div>
    <div class="kbd">按 <b>←</b> <b>→</b> 翻页</div>
  </div>

</div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);
  const mk = (t, a) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', t);
    for(const k in a) e.setAttribute(k, a[k]);
    return e;
  };

  /* SPEED = 0 表示快进：所有等待立刻完成（走微任务，不让出渲染帧，
     这样重建前面几步时画面不会闪） */
  let SPEED = 1;
  const sleep = ms => SPEED === 0
    ? Promise.resolve()
    : new Promise(r => setTimeout(r, ms));

  let token = 0;
  const alive = tk => tk === token;

  /* ---------- 几何 ---------- */
  const PAN_CY = 196;
  const SLOT = [[208, PAN_CY], [336, PAN_CY]];
  const WAIT_Y = 411;
  const WAIT_X = {1:152, 2:272, 3:392};

  const COL_X = [660, 782], ROW_Y = [92, 164, 236, 308], CELL_W = 112, CELL_H = 58;

  const TINT = {1:'#dbeafe', 2:'#ccfbf1', 3:'#fde9c4'};
  const HUE  = {1:'#2563eb', 2:'#0d9488', 3:'#d97706'};
  const FILL = ['#fdf4de', '#f6c877', '#e9a24a'];
  const EDGE = ['#e2cfa4', '#d9a558', '#bf7d2f'];

  /* ---------- 状态 ---------- */
  const S = { done:{}, down:{}, where:{}, min:0 };
  let cakes = {};
  let cells = {};

  /* ---------- 建饼 ---------- */
  function buildCakes(){
    const host = $('gCakes');
    for(let n = 1; n <= 3; n++){
      const g = mk('g', {class:'cake', id:'cake' + n});
      const inner = mk('g', {class:'inner'});

      const body = mk('circle', {r:54, fill:FILL[0], stroke:EDGE[0], 'stroke-width':2});

      const spots = mk('g', {opacity:0});
      const sp = [[-22,-19,8],[15,-24,6],[-7,7,9],[26,13,6],[-28,17,5],[5,-3,5]];
      sp.forEach(s => spots.appendChild(mk('circle', {cx:s[0], cy:s[1], r:s[2], fill:'#c07a2c', opacity:.42})));

      const ring = mk('circle', {r:54, fill:'none', stroke:HUE[n], 'stroke-width':4, opacity:.85});

      const num = mk('text', {class:'num', y:2, 'text-anchor':'middle', 'dominant-baseline':'central'});
      num.textContent = n;

      const bb = mk('rect', {x:-22, y:25, width:44, height:24, rx:12, fill:'#ffffff', opacity:.82});
      const bd = mk('text', {class:'bdg', y:38, 'text-anchor':'middle', 'dominant-baseline':'central'});
      bd.textContent = '正';

      const chk = mk('g', {opacity:0});
      chk.appendChild(mk('circle', {cx:34, cy:-34, r:14, fill:'#0d9488'}));
      chk.appendChild(mk('path', {d:'M27 -34 L32.5 -28.5 L42 -40', fill:'none', stroke:'#fff', 'stroke-width':3.4, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));

      inner.appendChild(body);
      inner.appendChild(spots);
      inner.appendChild(ring);
      inner.appendChild(num);
      inner.appendChild(bb);
      inner.appendChild(bd);
      inner.appendChild(chk);
      g.appendChild(inner);
      host.appendChild(g);

      cakes[n] = {g, inner, body, spots, bd, chk};
    }
  }

  /* ---------- 摆放与上色 ---------- */
  function place(n){
    const w = S.where[n];
    let x = WAIT_X[n], y = WAIT_Y;
    if(w === 'pan0'){ x = SLOT[0][0]; y = SLOT[0][1]; }
    if(w === 'pan1'){ x = SLOT[1][0]; y = SLOT[1][1]; }
    cakes[n].g.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }

  function paint(n){
    const d = S.done[n];
    const c = cakes[n];
    const i = Math.min(d, 2);
    c.body.setAttribute('fill', FILL[i]);
    c.body.setAttribute('stroke', EDGE[i]);
    c.spots.setAttribute('opacity', d >= 1 ? .9 : 0);
    c.chk.setAttribute('opacity', d >= 2 ? 1 : 0);
    c.bd.textContent = S.down[n];
  }

  async function flip(n, tk){
    S.down[n] = S.down[n] === '正' ? '反' : '正';
    const inner = cakes[n].inner;
    inner.classList.add('flip');
    await sleep(200);
    if(tk !== undefined && !alive(tk)) return;
    paint(n);
    await sleep(230);
    inner.classList.remove('flip');
  }

  /* ---------- 时间表 ---------- */
  function buildTable(){
    const g = $('gTable');
    g.innerHTML = '';
    cells = {};
    for(let r = 0; r < 4; r++){
      const l1 = mk('text', {class:'rl', x:545, y:ROW_Y[r] + 26});
      l1.textContent = '第 ' + (r + 1) + ' 轮';
      const l2 = mk('text', {class:'rs', x:545, y:ROW_Y[r] + 48});
      l2.textContent = (r * 3) + '–' + (r * 3 + 3) + ' 分';
      g.appendChild(l1); g.appendChild(l2);

      for(let c = 0; c < 2; c++){
        const bg = mk('rect', {
          x:COL_X[c], y:ROW_Y[r], width:CELL_W, height:CELL_H, rx:12,
          fill:'none', stroke:'#e6eaf1', 'stroke-width':1.4, 'stroke-dasharray':'5 5'
        });
        const t = mk('text', {
          class:'ct', x:COL_X[c] + CELL_W / 2, y:ROW_Y[r] + CELL_H / 2,
          'text-anchor':'middle', 'dominant-baseline':'central'
        });
        g.appendChild(bg); g.appendChild(t);
        cells[r + '-' + c] = {bg, t};
      }
    }
  }

  function clearTable(){
    for(const key in cells){
      const el = cells[key];
      el.bg.setAttribute('fill', 'none');
      el.bg.setAttribute('stroke', '#e6eaf1');
      el.bg.setAttribute('stroke-width', '1.4');
      el.bg.setAttribute('stroke-dasharray', '5 5');
      el.bg.classList.remove('wp');
      el.t.textContent = '';
      el.t.setAttribute('class', 'ct');
      el.t.style.fill = '';
    }
  }

  function fillCell(r, c, n, side, kind){
    const el = cells[r + '-' + c];
    if(!el) return;
    if(!n){
      el.bg.setAttribute('fill', kind === 'waste' ? '#fef2f2' : 'none');
      el.bg.setAttribute('stroke', kind === 'waste' ? '#f87171' : '#e6eaf1');
      el.bg.setAttribute('stroke-dasharray', '5 5');
      el.t.textContent = (kind === 'waste' || kind === 'idle') ? '空着' : '';
      el.t.setAttribute('class', kind === 'waste' ? 'ct waste' : 'ct');
      el.t.style.fill = kind === 'waste' ? '#dc2626' : '#b4b2a9';
      return;
    }
    el.bg.setAttribute('fill', TINT[n]);
    el.bg.setAttribute('stroke', HUE[n]);
    el.bg.setAttribute('stroke-dasharray', '0');
    el.t.textContent = n + ' 号 ' + side;
    el.t.setAttribute('class', 'ct');
    el.t.style.fill = '#0f172a';
  }

  /* ---------- 杂项 ---------- */
  function setTime(){ $('tm').textContent = S.min + ' 分钟'; }
  function setHeat(v){ $('heat').style.opacity = v; }
  function setNote(txt, color){
    $('note').textContent = txt || '';
    $('note').style.fill = color || '#94a3b8';
  }
  function slotHint(on){
    $('freeHint').classList.toggle('on', !!on);
    $('freeHint').style.opacity = on ? 1 : 0;
  }

  function resetAll(){
    for(let n = 1; n <= 3; n++){
      S.done[n] = 0; S.down[n] = '正'; S.where[n] = 'wait';
      paint(n); place(n);
    }
    S.min = 0;
    setTime(); clearTable(); setHeat(0); setNote(''); slotHint(false);
  }

  async function cookRound(tk){
    setHeat(1);
    await sleep(700);
    if(tk !== undefined && !alive(tk)) return;
    setHeat(0);
  }

  /* ---------- 三层画面 ---------- */
  function showScene(){ $('gScene').style.opacity = 1; $('gFaces').style.opacity = 0; $('gRule').style.opacity = 0; }
  function showFaces(){ $('gScene').style.opacity = 0; $('gFaces').style.opacity = 1; $('gRule').style.opacity = 0; }
  function showRule(){  $('gScene').style.opacity = 0; $('gFaces').style.opacity = 0; $('gRule').style.opacity = 1; }

  /* =========================================================
     第三章「面」画面：6 个面片，从散排飞到分组
     ========================================================= */
  const gF = { title:null, sub:null, faces:[], rlabs:[], eq:null };

  const FACE_DATA = [
    {label:'1 正', x:346, y:170, color:HUE[1]},
    {label:'2 正', x:442, y:170, color:HUE[2]},
    {label:'1 反', x:346, y:262, color:HUE[1]},
    {label:'3 正', x:442, y:262, color:HUE[3]},
    {label:'2 反', x:442, y:354, color:HUE[2]},
    {label:'3 反', x:442, y:354, color:HUE[3]}
  ];
  const SCATTER = FACE_DATA.map((_, i) => [148 + i * 132, 238]);

  function buildFaces(){
    const g = $('gFaces');
    g.innerHTML = '';

    const t1 = mk('text', {class:'ov-t', x:480, y:80, 'text-anchor':'middle'});
    const t2 = mk('text', {class:'ov-s', x:480, y:112, 'text-anchor':'middle'});
    g.appendChild(t1); g.appendChild(t2);
    gF.title = t1; gF.sub = t2;

    FACE_DATA.forEach((f, i) => {
      const gg = mk('g', {class:'face'});
      gg.style.transform = 'translate(' + SCATTER[i][0] + 'px,' + SCATTER[i][1] + 'px)';
      gg.style.opacity = 0;
      gg.appendChild(mk('circle', {r:42, fill:'#f6c877', stroke:f.color, 'stroke-width':4}));
      const tx = mk('text', {class:'fc-t', x:0, y:0, 'text-anchor':'middle', 'dominant-baseline':'central'});
      tx.textContent = f.label;
      gg.appendChild(tx);
      g.appendChild(gg);
      gF.faces.push(gg);
    });

    const rows = [[170, '第 1 轮'], [262, '第 2 轮'], [354, '第 3 轮']];
    rows.forEach(r => {
      const gg = mk('g', {class:'rlab'});
      gg.style.opacity = 0;
      const l1 = mk('text', {class:'fc-l', x:564, y:r[0] - 6});
      l1.textContent = r[1];
      const l2 = mk('text', {class:'fc-s', x:564, y:r[0] + 16});
      l2.textContent = '3 分钟';
      gg.appendChild(l1); gg.appendChild(l2);
      g.appendChild(gg);
      gF.rlabs.push(gg);
    });

    const fe = mk('text', {class:'ov-big feq', x:480, y:452, 'text-anchor':'middle'});
    fe.style.opacity = 0;
    g.appendChild(fe);
    gF.eq = fe;
  }

  /* =========================================================
     第三章「规律」画面
     ========================================================= */
  function buildRule(){
    const g = $('gRule');
    g.innerHTML = '';

    const t1 = mk('text', {class:'ov-t', x:480, y:96, 'text-anchor':'middle'});
    t1.textContent = 'n ≥ 2 时，最少 3n 分钟';
    const t2 = mk('text', {class:'ov-s', x:480, y:128, 'text-anchor':'middle'});
    t2.textContent = '每多一张饼，就多花 3 分钟 —— 因为总能找个人填满空位';
    g.appendChild(t1); g.appendChild(t2);

    const data = [
      {n:'1 张', v:'6 分', hi:false, ex:true},
      {n:'2 张', v:'6 分', hi:false},
      {n:'3 张', v:'9 分', hi:true},
      {n:'4 张', v:'12 分', hi:false},
      {n:'5 张', v:'15 分', hi:false}
    ];
    const w = 104, gap = 16;
    const total = data.length * w + (data.length - 1) * gap;
    const x0 = (960 - total) / 2;

    data.forEach((d, i) => {
      const x = x0 + i * (w + gap);
      g.appendChild(mk('rect', {
        x:x, y:176, width:w, height:110, rx:14,
        fill: d.hi ? '#dbeafe' : (d.ex ? '#fef2f2' : '#f8fafc'),
        stroke: d.hi ? '#2563eb' : (d.ex ? '#f0a8a8' : '#e7eaf0'),
        'stroke-width': d.hi ? 2 : 1.4
      }));
      const c1 = mk('text', {class:'card-n', x:x + w / 2, y:214, 'text-anchor':'middle'});
      c1.textContent = d.n;
      if(d.ex) c1.style.fill = '#b91c1c';
      const c2 = mk('text', {class:'card-v', x:x + w / 2, y:258, 'text-anchor':'middle'});
      c2.textContent = d.v;
      if(d.ex) c2.style.fill = '#b91c1c';
      g.appendChild(c1); g.appendChild(c2);
    });

    const b1 = mk('text', {class:'ov-big', x:480, y:392, 'text-anchor':'middle'});
    b1.textContent = 'n = 1 是唯一例外：6 分钟';
    const b2 = mk('text', {class:'ov-s', x:480, y:426, 'text-anchor':'middle'});
    b2.textContent = '一张饼的两个面没法同时烙，另一个位置想帮也帮不上';
    g.appendChild(b1); g.appendChild(b2);
  }

  /* =========================================================
     三章 · 11 步
     ========================================================= */
  const CHAPS = [
    {n:'一', name:'老实算', sub:'12 分钟是怎么来的', start:0, end:3},
    {n:'二', name:'换着烙', sub:'2 号出锅，3 号补位', start:4, end:7},
    {n:'三', name:'找规律', sub:'为什么是 3n',   start:8, end:10}
  ];
  const STEPS = [
    /* ================= 第一章 · 老实算 ================= */
    {
      h:'1 张：6 分钟，锅空一半',
      t:'一张饼有正反两面，各要 3 分钟。锅的另一个位置<em>从头空到尾</em> —— 因为同一张饼的两面没法同时烙。',
      eq:'正面 3 分 + 反面 3 分\n= 6 分钟',
      act: async tk => {
        showScene(); resetAll();
        await sleep(280); if(!alive(tk)) return;

        S.where[1] = 'pan0'; place(1);
        await sleep(720); if(!alive(tk)) return;

        fillCell(0, 0, 1, '正'); fillCell(0, 1, null, null, 'idle');
        S.min = 3; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[1] = 1; paint(1);
        await sleep(560); if(!alive(tk)) return;

        await flip(1, tk); if(!alive(tk)) return;

        fillCell(1, 0, 1, '反'); fillCell(1, 1, null, null, 'idle');
        S.min = 6; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[1] = 2; paint(1);
        await sleep(600); if(!alive(tk)) return;

        S.where[1] = 'wait'; place(1);
        setNote('空着的位置，白等了 6 分钟');
      }
    },
    {
      h:'2 张：还是 6 分钟',
      t:'两张一起下锅，正面烙一轮、反面烙一轮。锅装满了，<b>时间一点没多花</b>。<br>这就是「一次最多 2 张」的意思。',
      eq:'2 张同时烙\n= 6 分钟\n（多烙一张，不加时间）',
      act: async tk => {
        showScene(); resetAll();
        setNote('换个实验：两张一起下锅');
        await sleep(620); if(!alive(tk)) return;

        S.where[1] = 'pan0'; S.where[2] = 'pan1'; place(1); place(2);
        await sleep(760); if(!alive(tk)) return;

        fillCell(0, 0, 1, '正'); fillCell(0, 1, 2, '正');
        S.min = 3; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[1] = 1; S.done[2] = 1; paint(1); paint(2);
        await sleep(600); if(!alive(tk)) return;

        await flip(1, tk); if(!alive(tk)) return;
        await flip(2, tk); if(!alive(tk)) return;

        fillCell(1, 0, 1, '反'); fillCell(1, 1, 2, '反');
        S.min = 6; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[1] = 2; S.done[2] = 2; paint(1); paint(2);
        await sleep(620); if(!alive(tk)) return;

        S.where[1] = 'wait'; S.where[2] = 'wait'; place(1); place(2);
        setNote('装满一轮 6 分钟，跟只烙一张一样');
      }
    },
    {
      h:'3 张，老实来：12 分钟',
      t:'先烙 1、2 号，6 分钟都出锅；再单独烙 3 号，又是 6 分钟。<br>加起来 <em>12 分钟</em> —— 听着挺合理。',
      eq:'1、2 号 一起 → 6 分钟\n3 号 单独 → 6 分钟\n= <span class="hl">12 分钟</span>',
      act: async tk => {
        showScene(); resetAll();
        await sleep(240); if(!alive(tk)) return;

        S.where[1] = 'pan0'; S.where[2] = 'pan1'; place(1); place(2);
        await sleep(720); if(!alive(tk)) return;

        fillCell(0, 0, 1, '正'); fillCell(0, 1, 2, '正');
        S.min = 3; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[1] = 1; S.done[2] = 1; paint(1); paint(2);
        await sleep(500); if(!alive(tk)) return;

        await flip(1, tk); if(!alive(tk)) return;
        await flip(2, tk); if(!alive(tk)) return;

        fillCell(1, 0, 1, '反'); fillCell(1, 1, 2, '反');
        S.min = 6; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[1] = 2; S.done[2] = 2; paint(1); paint(2);
        await sleep(500); if(!alive(tk)) return;

        S.where[1] = 'wait'; S.where[2] = 'wait'; place(1); place(2);
        await sleep(700); if(!alive(tk)) return;

        S.where[3] = 'pan0'; place(3);
        await sleep(720); if(!alive(tk)) return;

        fillCell(2, 0, 3, '正'); fillCell(2, 1, null, null, 'waste');
        S.min = 9; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[3] = 1; paint(3);
        await sleep(540); if(!alive(tk)) return;

        await flip(3, tk); if(!alive(tk)) return;

        fillCell(3, 0, 3, '反'); fillCell(3, 1, null, null, 'waste');
        S.min = 12; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[3] = 2; paint(3);
        await sleep(620); if(!alive(tk)) return;

        setNote('12 分钟，后面两轮锅里都只剩一张');
      }
    },
    {
      h:'那 6 分钟，是空转掉的',
      t:'后两轮锅里只有一张饼，另一个位置<b>从头空到尾</b>。<br>空着的位置，就是白白流走的时间 —— 12 分钟里有一半在浪费。',
      eq:'12 分钟里\n有 6 分钟只烙了 1 个面\n（本该烙 2 个）',
      act: async tk => {
        showScene();
        /* 承接上一步终态，只把两个空位点亮 */
        ['2-1', '3-1'].forEach(k => {
          const el = cells[k];
          if(!el) return;
          el.bg.classList.add('wp');
          el.bg.setAttribute('stroke', '#f87171');
          el.bg.setAttribute('stroke-width', '2');
        });
        setNote('两个空位 = 白等 6 分钟', '#dc2626');
        await sleep(300);
      }
    },

    /* ================= 第二章 · 换着烙 ================= */
    {
      h:'轮 1：1 正 · 2 正',
      t:'两张一起下锅，各烙好一面。<br>锅是满的 —— 但两张饼都只熟了<em>一半</em>。',
      eq:'轮 1：1 正 · 2 正\n= 3 分钟',
      act: async tk => {
        showScene(); resetAll();
        await sleep(240); if(!alive(tk)) return;

        S.where[1] = 'pan0'; S.where[2] = 'pan1'; place(1); place(2);
        await sleep(740); if(!alive(tk)) return;

        fillCell(0, 0, 1, '正'); fillCell(0, 1, 2, '正');
        S.min = 3; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[1] = 1; S.done[2] = 1; paint(1); paint(2);
        await sleep(640); if(!alive(tk)) return;

        setNote('两张都只熟了一面');
      }
    },
    {
      h:'破局：2 号先出锅',
      t:'2 号烙好一面<i>就能先拿出来</i>，放案板上等着。<br>空出来的位置，让给 3 号 —— <b>题目从来没要求一口气烙完。</b>',
      eq:'2 号：烙好一面\n→ 出锅等着\n→ 位置让给 3 号',
      act: async tk => {
        showScene();
        await sleep(420); if(!alive(tk)) return;

        S.where[2] = 'wait'; place(2);
        await sleep(880); if(!alive(tk)) return;

        slotHint(true);
        setNote('位置空出来了 —— 谁都能进去', '#0d9488');
      }
    },
    {
      h:'轮 2：2 号出去，3 号补位',
      t:'3 号进空位，1 号翻面。<br>这一轮烙的是 <b>1 反</b> 和 <b>3 正</b> —— 三个位置一分钟没闲过。',
      eq:'轮 2：1 反 · 3 正\n= 3 分钟',
      act: async tk => {
        showScene();
        slotHint(false);

        S.where[3] = 'pan1'; place(3);
        await sleep(780); if(!alive(tk)) return;

        await flip(1, tk); if(!alive(tk)) return;

        fillCell(1, 0, 1, '反'); fillCell(1, 1, 3, '正');
        S.min = 6; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[1] = 2; S.done[3] = 1; paint(1); paint(3);
        await sleep(640); if(!alive(tk)) return;

        setNote('1 号两面都熟了，可以出锅');
      }
    },
    {
      h:'轮 3：最后两张同时出锅',
      t:'1 号出锅，2 号回锅烙反面，3 号翻面。<br>这一轮 <b>2 反</b> 和 <b>3 反</b> 一起熟 —— 正好 9 分钟。',
      eq:'轮 1：1 正 · 2 正\n轮 2：1 反 · 3 正\n轮 3：2 反 · 3 反\n= <span class="ok">9 分钟</span>',
      act: async tk => {
        showScene();

        S.where[1] = 'wait'; place(1);
        await sleep(520); if(!alive(tk)) return;

        S.where[2] = 'pan0'; place(2);
        await sleep(700); if(!alive(tk)) return;

        await flip(2, tk); if(!alive(tk)) return;
        await flip(3, tk); if(!alive(tk)) return;

        fillCell(2, 0, 2, '反'); fillCell(2, 1, 3, '反');
        S.min = 9; setTime(); await cookRound(tk); if(!alive(tk)) return;
        S.done[2] = 2; S.done[3] = 2; paint(2); paint(3);
        await sleep(660); if(!alive(tk)) return;

        setNote('9 分钟：2 号和 3 号同时出锅', '#0d9488');
      }
    },

    /* ================= 第三章 · 找规律 ================= */
    {
      h:'别数张，改数面',
      t:'一张饼有 2 个面，3 张饼就是 <b>6 个面</b>。<br>锅一轮只放得下 2 个面 —— 所以真正要数的是<em>面</em>，不是张。',
      eq:'3 张 × 2 面\n= 6 个面',
      act: async tk => {
        showFaces();
        gF.title.textContent = '3 张饼 = 6 个面';
        gF.sub.textContent = '锅一轮只放得下 2 个面';

        gF.eq.style.opacity = 0;
        gF.rlabs.forEach(r => r.style.opacity = 0);
        gF.faces.forEach((f, i) => {
          f.style.transform = 'translate(' + SCATTER[i][0] + 'px,' + SCATTER[i][1] + 'px)';
          f.style.opacity = 0;
        });
        await sleep(60); if(!alive(tk)) return;

        for(let i = 0; i < gF.faces.length; i++){
          gF.faces[i].style.opacity = 1;
          await sleep(120); if(!alive(tk)) return;
        }
        await sleep(200);
      }
    },
    {
      h:'两个一组往下排，正好 3 轮',
      t:'把 6 个面两两配一对，配出<b>3 对</b>。<br>每一对正好装满一轮锅 —— 一共 3 轮，一轮 3 分钟。',
      eq:'6 ÷ 2 = 3 轮\n3 轮 × 3 分\n= <span class="ok">9 分钟</span>',
      act: async tk => {
        showFaces();
        gF.title.textContent = '两两一组，正好 3 轮';
        gF.sub.textContent = '每一对装满一轮锅，一轮 3 分钟';

        gF.faces.forEach((f, i) => {
          f.style.transform = 'translate(' + FACE_DATA[i].x + 'px,' + FACE_DATA[i].y + 'px)';
        });
        await sleep(360); if(!alive(tk)) return;

        for(let i = 0; i < gF.rlabs.length; i++){
          gF.rlabs[i].style.opacity = 1;
          await sleep(240); if(!alive(tk)) return;
        }

        gF.eq.textContent = '6 ÷ 2 = 3 轮 → 3 × 3 = 9 分钟';
        gF.eq.style.opacity = 1;
        await sleep(300);
      }
    },
    {
      h:'规律：n ≥ 2 时，3n 分钟',
      t:'只要不止一张，就总能找到饼来填满空位，所以<b>每多一张就多 3 分钟</b>。<br>但 1 张饼是硬例外 —— 它的两个面没法同时烙。',
      eq:'n 张饼（n ≥ 2）\n最少 3n 分钟\n\n1 张 → 6 分钟（特例）',
      act: async tk => {
        showRule();
        await sleep(260);
      }
    }
  ];

  /* =========================================================
     控制
     ========================================================= */
  let cur = 0;

  function chapOf(k){
    for(let i = 0; i < CHAPS.length; i++){
      if(k >= CHAPS[i].start && k <= CHAPS[i].end) return i;
    }
    return 0;
  }

  function render(){
    const k = cur;
    const ci = chapOf(k);
    const chap = CHAPS[ci];
    const total = chap.end - chap.start + 1;
    const local = k - chap.start;
    const s = STEPS[k];

    $('steptag').textContent = '第' + chap.n + '章 · 第 ' + (local + 1) + ' 步 / 共 ' + total + ' 步　·　' + chap.name;
    $('h').textContent = s.h;
    $('t').innerHTML = s.t;
    $('eq').innerHTML = s.eq;

    $('prev').disabled = k === 0;
    $('next').disabled = k === STEPS.length - 1;

    [...$('chaps').children].forEach((b, i) => b.classList.toggle('on', i === ci));

    const box = $('dots');
    if(box.children.length !== total){
      box.innerHTML = '';
      for(let i = 0; i < total; i++){
        const d = document.createElement('span');
        d.className = 'dot';
        d.addEventListener('click', () => go(chap.start + i));
        box.appendChild(d);
      }
    }
    [...box.children].forEach((d, i) => d.classList.toggle('on', i === local));
  }

  /* 从本章第一步重建到第 k 步：前面的步快进，最后一步正常演 */
  async function go(k){
    k = Math.max(0, Math.min(STEPS.length - 1, k));
    cur = k;
    const tk = ++token;

    /* 清掉上一次可能残留的快进状态 */
    SPEED = 1;
    document.body.classList.remove('instant');

    render();

    const st = CHAPS[chapOf(k)].start;

    if(k > st){
      SPEED = 0;
      document.body.classList.add('instant');
      for(let i = st; i < k; i++){
        await STEPS[i].act(tk);
        /* 被打断就把收尾交给接管的那一次，避免两边互相清场 */
        if(!alive(tk)) return;
      }
      document.body.classList.remove('instant');
      SPEED = 1;
      /* 等过渡重新生效，再用 setTimeout 兜底（后台标签页 rAF 不触发） */
      await new Promise(r => {
        requestAnimationFrame(() => requestAnimationFrame(r));
        setTimeout(r, 90);
      });
      if(!alive(tk)) return;
    }

    await STEPS[k].act(tk);
  }

  $('prev').addEventListener('click', () => go(cur - 1));
  $('next').addEventListener('click', () => go(cur + 1));

  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(cur + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(cur - 1); }
  });

  $('chaps').addEventListener('click', e => {
    const b = e.target.closest('.chap');
    if(!b) return;
    go(CHAPS[+b.dataset.c].start);
  });

  /* ---------- 启动 ---------- */
  buildCakes();
  buildTable();
  buildFaces();
  buildRule();
  resetAll();

  cur = 0;
  render();
  STEPS[0].act(++token);
})();
</script>
</body>
</html>
