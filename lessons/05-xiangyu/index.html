<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>相遇问题 · 两个人怎么"合起来走"</title>
<style>/* ===== 小学数学动画课 · 公共样式 ===== */
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;
  --d-dk:#b91c1c;
  --b:#f59e0b;
  --b-lt:#fde9c4;
  --s:#94a3b8;
  --ok:#0d9488;
  --ok-lt:#ccfbf1;
  --bg:#f6f7f9;
  --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:18px 26px 32px;
}
.wrap{max-width:1400px;margin:0 auto}

/* ---------- 顶部导航 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

/* ---------- header ---------- */
header{margin-bottom:18px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;
  margin-bottom:11px;
}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
h1 .q-mark{color:var(--d)}
.q{margin-top:10px;font-size:20px;line-height:1.7;color:#334155;font-weight:500}
.q b{color:var(--a);font-weight:800}

/* ---------- layout ---------- */
.main{
  display:grid;
  grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);

  align-items:start;
}
@media (max-width:1040px){ .main{grid-template-columns:1fr} }

/* ---------- stage ---------- */
.stage-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px 8px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
}
svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- 通用 svg 文本 ---------- */
.tag{font-size:22px;font-weight:800;fill:#0f172a}
.tag.sm{font-size:17px;font-weight:700;fill:#64748b}
.val{font-size:27px;font-weight:800;fill:#fff}
.valSum{font-size:19px;font-weight:800;fill:#fff}
.valRed{font-size:24px;font-weight:800;fill:#fff}
.valDark{font-size:24px;font-weight:800;fill:#0f172a}
.diffTxt{font-size:20px;font-weight:800;fill:var(--d)}
.halfTxt{font-size:21px;font-weight:800;fill:#475569}
.hintTxt{font-size:17px;font-weight:700;fill:#94a3b8}
.partNum{font-size:17px;font-weight:800;fill:#fff}

/* ---------- 通用形状 ---------- */
.barA{fill:var(--a)}
.barD{fill:var(--d)}
.barB{fill:var(--b)}
.barS{fill:var(--s)}

.patch{fill:none;stroke:var(--b);stroke-width:3;stroke-dasharray:9 8}
.patch.on{fill:var(--b-lt);stroke:var(--b);stroke-dasharray:none}
.ghost{fill:none;stroke:#cbd5e1;stroke-width:2.5;stroke-dasharray:7 7}
.split{stroke:#0f172a;stroke-width:3;stroke-linecap:round}
.alignLine{stroke:#334155;stroke-width:2.5;stroke-dasharray:6 6;opacity:.32}
.bracket{stroke:var(--d);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.segLine{stroke:#ffffff;stroke-width:3;stroke-linecap:round}
.unitBox{fill:none;stroke:var(--a);stroke-width:2;stroke-dasharray:6 5}
.cell{fill:var(--a-lt);stroke:#ffffff;stroke-width:2.5}
.cell.new{fill:#eef3fd}

/* ---------- side panel ---------- */
.side{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 22px 20px;

}

/* ---------- controls ---------- */
.controls{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:16px;font-weight:800;

  transition:all .16s ease;font-family:inherit;
}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}

.dots{display:flex;gap:7px;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#d7dce5;cursor:pointer;transition:all .2s ease}
.dot:hover{background:#b6bfcd}
.dot.on{background:var(--a);width:24px;border-radius:5px}
.spacer{flex:1}
.kbd{font-size:13px;color:#94a3b8;font-weight:600}
.kbd b{
  display:inline-block;background:#fff;border:1px solid var(--line);

}

/* ---------- try panel ---------- */
.try{

}

.try input{

}

.try .unit{font-size:15px;font-weight:700;color:var(--muted)}
.try .warn{font-size:14px;font-weight:700;color:var(--d)}

/* ---------- 动画（全站统一） ---------- */
svg rect, svg text, svg g, svg circle{
  transition: width .72s cubic-bezier(.5,0,.2,1),
              height .72s cubic-bezier(.5,0,.2,1),
              x .72s cubic-bezier(.5,0,.2,1),
              y .72s cubic-bezier(.5,0,.2,1),
              opacity .42s ease,
              fill .3s ease,
              stroke .3s ease;
}
.no-anim *{transition:none !important}

/* ---------- 目录页 ---------- */
.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:18px;margin-top:22px;
}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:.18s ease;
  position:relative;overflow:hidden;
}
.card:hover{border-color:#c7d3e6;transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(15,23,42,.28)}
.card .no{
  font-size:13px;font-weight:800;letter-spacing:.08em;color:#9aa6b8;
}
.card h3{margin-top:8px;font-size:22px;font-weight:800}
.card p{margin-top:9px;font-size:15px;line-height:1.7;color:#5b6779}
.card .go{
  margin-top:16px;font-size:14px;font-weight:800;color:var(--a);
}
.card.done::after{

  font-size:12px;font-weight:800;color:var(--ok);
  background:var(--ok-lt);padding:3px 9px;border-radius:999px;
}

.card.soon{opacity:.5;pointer-events:none;background:#fbfcfd}
.card.soon .go{color:#94a3b8}
.sect-title{
  margin:36px 0 4px;font-size:19px;font-weight:800;color:#0f172a;
  display:flex;align-items:center;gap:10px;
}
.sect-title span{
  font-size:12px;font-weight:800;color:#9aa6b8;letter-spacing:.06em;
  background:#eef1f6;padding:3px 9px;border-radius:999px;
}</style>
<style>
  .t18{font-size:18px;font-weight:800}
  .ts14{font-size:14px;font-weight:700}
  #carA, #carB { transition: transform 1.05s cubic-bezier(.45,.05,.35,1); }
  #trailA, #trailB { transition: width 1.05s cubic-bezier(.45,.05,.35,1), x 1.05s cubic-bezier(.45,.05,.35,1); }
  #clock, #rest, #lblA, #lblB { transition: x 1.05s cubic-bezier(.45,.05,.35,1); }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← 全部课程</a>
    <span class="pos">第 5 课 / 8 · 相遇</span>
    <span class="sp"></span>
    <a href="../04-guiyi/index.html">← 上一课</a>
    <a href="../06-zhuiji/index.html">下一课：追及 →</a>
  </div>

  <header>
    <div class="kicker">小学数学 · 行程问题 05</div>
    <h1>相遇问题：<span class="q-mark">为什么把两个速度加起来？</span></h1>
    <p class="q">两地相距 <b>300 千米</b>，甲车每小时 60 千米，乙车每小时 40 千米，同时相向出发，几小时相遇？</p>
  </header>

  <div class="main">

    <section class="stage-card">
      <svg id="stage" viewBox="0 0 920 250" preserveAspectRatio="xMidYMid meet">

        <text id="clock" class="t18" x="460" y="70" text-anchor="middle" fill="#0f172a">刚出发</text>
        <text id="rest" class="t18" x="460" y="106" text-anchor="middle" fill="#ef4444">相距 300 千米</text>

        <!-- 车 -->
        <g id="carA" transform="translate(34,135)">
          <rect x="0" y="0" width="46" height="26" rx="7" fill="#2563eb"/>
          <path d="M30 7 L41 13 L30 19 Z" fill="#ffffff"/>
          <circle cx="11" cy="26" r="5" fill="#1e293b"/>
          <circle cx="35" cy="26" r="5" fill="#1e293b"/>
        </g>
        <g id="carB" transform="translate(840,135)">
          <rect x="0" y="0" width="46" height="26" rx="7" fill="#f59e0b"/>
          <path d="M16 7 L5 13 L16 19 Z" fill="#ffffff"/>
          <circle cx="11" cy="26" r="5" fill="#1e293b"/>
          <circle cx="35" cy="26" r="5" fill="#1e293b"/>
        </g>
        <text id="lblA" class="ts14" x="57" y="131" text-anchor="middle" fill="#2563eb">甲 60</text>
        <text id="lblB" class="ts14" x="863" y="131" text-anchor="middle" fill="#b45309">乙 40</text>

        <!-- 路 -->
        <rect x="80" y="157" width="760" height="18" fill="#e3e7ee"/>
        <rect id="trailA" x="80" y="157" width="0" height="18" fill="#2563eb"/>
        <rect id="trailB" x="840" y="157" width="0" height="18" fill="#f59e0b"/>

        <!-- 刻度 -->
        <g id="ticks" stroke="#94a3b8" stroke-width="1.5">
          <line x1="80" y1="179" x2="80" y2="191"/>
          <line x1="333.33" y1="179" x2="333.33" y2="191"/>
          <line x1="586.67" y1="179" x2="586.67" y2="191"/>
          <line x1="840" y1="179" x2="840" y2="191"/>
        </g>
        <g class="ts14" fill="#94a3b8" text-anchor="middle">
          <text x="80" y="208">0</text>
          <text x="333.33" y="208">100</text>
          <text x="586.67" y="208">200</text>
          <text x="840" y="208">300</text>
        </g>

        <text id="h1" class="ts14" x="206.67" y="232" text-anchor="middle" fill="#0f172a" opacity="0">1 小时</text>
        <text id="h2" class="ts14" x="460" y="232" text-anchor="middle" fill="#0f172a" opacity="0">2 小时</text>
        <text id="h3" class="ts14" x="713.33" y="232" text-anchor="middle" fill="#0f172a" opacity="0">3 小时</text>

      </svg>
    </section>

    <aside class="side">
      <div class="steptag" id="steptag">第 1 步 / 共 6 步</div>
      <h2 id="t"></h2>
      <p id="h"></p>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </aside>

  </div>

  <div class="controls">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn primary" id="next">下一步 →</button>
    <div class="dots" id="dots"></div>
    <div class="spacer"></div>
    <div class="kbd">键盘 <b>←</b> <b>→</b> 翻页</div>
  </div>

  <div class="try">
    <span class="lab">换一组数字试试</span>
    <span class="unit">相距</span>
    <input id="inD" type="number" value="300" min="60" step="1">
    <span class="unit">甲速</span>
    <input id="inV1" type="number" value="60" min="1" step="1">
    <span class="unit">乙速</span>
    <input id="inV2" type="number" value="40" min="1" step="1">
    <button class="btn" id="apply">重新画</button>
    <span class="warn" id="warn"></span>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  const X1 = 80, X2 = 840, ROAD = X2 - X1, CARW = 46, CAR_Y = 135;

  const S = { d: 300, v1: 60, v2: 40, step: 0 };

  function geom(){
    const km = ROAD / S.d;                 // 每千米多少像素
    const hit = S.d / (S.v1 + S.v2);       // 相遇需要几小时
    return { km, hit };
  }

  const STEPS = [
    {
      t: '两个人，从路的两头同时出发',
      h: '甲从左边出发，每小时 60 千米；乙从右边出发，每小时 40 千米。<br>两地相距 300 千米。<br>问：出发几小时后碰面？',
      eq: '甲 60 km/h　乙 40 km/h\n相距 300 km'
    },
    {
      t: '第 1 小时：两人各走了一段',
      h: '甲往右走了 <b>60</b>，乙往左走了 <b>40</b>。<br>看路上留下的颜色：两段加起来 <b>100 千米</b>，中间只剩 <em>200</em>。',
      eq: '60 + 40 = 100（这一小时合起来走的）\n300 − 100 = 200'
    },
    {
      t: '第 2 小时：又是 100',
      h: '第二小时两人速度没变，所以又一起吃掉 <b>100 千米</b>，剩 <em>100</em>。<br>注意这个"每次都是 100"—— 它才是解题的关键。',
      eq: '200 − 100 = 100'
    },
    {
      t: '第 3 小时：碰上了',
      h: '最后这 100 千米，一小时刚好吃完。两车在中间相遇，用了 <b>3 小时</b>。<br><br>其实不用一小时一小时数：<b>每小时合起来靠近 100 千米</b>，300 里有几个 100，就是几小时。',
      eq: '300 ÷ 100 = <span class="ok">3</span> 小时'
    },
    {
      t: '为什么是"速度和"',
      h: '甲往右、乙往左，两人在<b>互相靠近</b>。<br>所以他们之间缩短的距离，等于两人的速度<b>加</b>起来 —— 相当于"一个人在用 100 km/h 跑"。<br><br>下面三个 100 千米，每一段都花 1 小时，正好 3 段。',
      eq: '速度和 = 60 + 40 = 100 km/h\n相遇时间 = 300 ÷ 100 = 3 小时'
    },
    {
      t: '公式，以及反过来怎么问',
      h: '相遇时间 = 总路程 ÷ 速度和。<br><br>反过来也常用：<b>相遇时间 × 速度和 = 总路程</b>。<br>如果问"甲走了多远"：相遇时间 × 甲速 = 3 × 60 = 180 千米。<br><br>记住方向：<em>相遇用加法，追及用减法</em> —— 判据是两人在靠近还是在拉开。',
      eq: '相遇时间 = 总路程 ÷ (甲速 + 乙速)\n甲走的路程 = 相遇时间 × 甲速'
    }
  ];

  function render(anim){
    const g = geom(), st = S.step;
    const stage = $('stage');
    if(!anim) stage.classList.add('no-anim');

    const t  = Math.min(st, g.hit);            // 第 0~3 步各推进一小时
    const ax = X1 + S.v1 * t * g.km;           // 甲的车头位置
    const bx = X2 - S.v2 * t * g.km;           // 乙的车头位置

    $('carA').setAttribute('transform', `translate(${(ax - CARW).toFixed(2)},${CAR_Y})`);
    $('carB').setAttribute('transform', `translate(${bx.toFixed(2)},${CAR_Y})`);
    $('lblA').setAttribute('x', (ax - CARW / 2).toFixed(2));
    $('lblB').setAttribute('x', (bx + CARW / 2).toFixed(2));

    $('trailA').setAttribute('width', (ax - X1).toFixed(2));
    $('trailB').setAttribute('x', bx.toFixed(2));
    $('trailB').setAttribute('width', (X2 - bx).toFixed(2));

    /* 顶部两块信息 */
    const leftKm = Math.max(0, S.d - (S.v1 + S.v2) * t);
    $('clock').textContent = t === 0 ? '刚出发'
                          : (Math.abs(leftKm) < 1e-6 ? `出发 ${t} 小时后 —— 相遇` : `出发 ${t} 小时后`);
    $('rest').textContent = leftKm < 1e-6 ? '已经碰面，相距 0 千米' : `还差 ${Math.round(leftKm * 10) / 10} 千米`;
    $('rest').setAttribute('x', ((ax + bx) / 2).toFixed(2));
    $('clock').setAttribute('x', ((ax + bx) / 2).toFixed(2));

    /* 每段 1 小时 */
    const on = (st >= 4);
    ['h1','h2','h3'].forEach((id, i) => {
      const el = $(id);
      el.setAttribute('opacity', on ? 1 : 0);
      el.textContent = `${i + 1} 小时`;
    });

    const cur = STEPS[st];
    $('steptag').textContent = `第 ${st + 1} 步 / 共 ${STEPS.length} 步`;
    $('t').textContent = cur.t;
    $('h').innerHTML = cur.h;
    $('eq').innerHTML = cur.eq;

    $('prev').disabled = st === 0;
    $('next').disabled = st === STEPS.length - 1;
    $('next').textContent = st === STEPS.length - 1 ? '已经讲完了'
                         : (st <= 2 ? '跑 1 小时 →' : '下一步 →');
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === st));

    if(!anim){
      void stage.offsetWidth;
      requestAnimationFrame(() => stage.classList.remove('no-anim'));
    }
  }

  function go(n){
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    if(n === S.step) return;
    S.step = n; render(true);
  }

  $('prev').addEventListener('click', () => go(S.step - 1));
  $('next').addEventListener('click', () => go(S.step + 1));
  STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.title = `第 ${i + 1} 步`;
    d.addEventListener('click', () => go(i));
    $('dots').appendChild(d);
  });
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(S.step + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(S.step - 1); }
  });

  $('apply').addEventListener('click', () => {
    const d = parseInt($('inD').value, 10);
    const v1 = parseInt($('inV1').value, 10);
    const v2 = parseInt($('inV2').value, 10);
    const warn = $('warn');
    if(![d,v1,v2].every(Number.isFinite) || d <= 0 || v1 <= 0 || v2 <= 0){
      warn.textContent = '三个数都要是正整数'; return;
    }
    if(d % (v1 + v2) !== 0){
      warn.textContent = `路程要能被速度和 ${v1 + v2} 整除（不然不是整小时）`; return;
    }
    warn.textContent = '';
    S.d = d; S.v1 = v1; S.v2 = v2; S.step = 0;
    render(false);
  });

  render(false);
})();
</script>
</body>
</html>
