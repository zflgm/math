<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工程问题 · 合作效率不是合作时间</title>
<style>
/* ===== 小学数学动画课 · 公共样式 ===== */
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;
  --d-dk:#b91c1c;
  --b:#f59e0b;
  --b-lt:#fde9c4;
  --s:#94a3b8;
  --ok:#0d9488;
  --ok-lt:#ccfbf1;
  --bg:#f6f7f9;
  --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:18px 26px 32px;
}
.wrap{max-width:1400px;margin:0 auto}

/* ---------- 顶部导航 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

/* ---------- header ---------- */
header{margin-bottom:18px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;
  margin-bottom:11px;
}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
h1 .q-mark{color:var(--d)}
.q{margin-top:10px;font-size:20px;line-height:1.7;color:#334155;font-weight:500}
.q b{color:var(--a);font-weight:800}
.q em{font-style:normal;color:var(--d);font-weight:800}

/* ---------- layout ---------- */
.main{
  display:grid;
  grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);
  gap:20px;
  align-items:start;
}
@media (max-width:1040px){ .main{grid-template-columns:1fr} }

/* ---------- stage ---------- */
.stage-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px 8px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
}
svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- 通用 svg 文本 ---------- */
.tag{font-size:22px;font-weight:800;fill:#0f172a}
.tag.sm{font-size:17px;font-weight:700;fill:#64748b}
.val{font-size:27px;font-weight:800;fill:#fff}
.valSum{font-size:19px;font-weight:800;fill:#fff}
.valRed{font-size:24px;font-weight:800;fill:#fff}
.valDark{font-size:24px;font-weight:800;fill:#0f172a}
.diffTxt{font-size:20px;font-weight:800;fill:var(--d)}
.halfTxt{font-size:21px;font-weight:800;fill:#475569}
.hintTxt{font-size:17px;font-weight:700;fill:#94a3b8}
.partNum{font-size:17px;font-weight:800;fill:#fff}

/* ---------- 通用形状 ---------- */
.barA{fill:var(--a)}
.barD{fill:var(--d)}
.barB{fill:var(--b)}
.barS{fill:var(--s)}
.barOk{fill:var(--ok)}
.patch{fill:none;stroke:var(--b);stroke-width:3;stroke-dasharray:9 8}
.patch.on{fill:var(--b-lt);stroke:var(--b);stroke-dasharray:none}
.ghost{fill:none;stroke:#cbd5e1;stroke-width:2.5;stroke-dasharray:7 7}
.split{stroke:#0f172a;stroke-width:3;stroke-linecap:round}
.alignLine{stroke:#334155;stroke-width:2.5;stroke-dasharray:6 6;opacity:.32}
.bracket{stroke:var(--d);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.segLine{stroke:#ffffff;stroke-width:3;stroke-linecap:round}
.unitBox{fill:none;stroke:var(--a);stroke-width:2;stroke-dasharray:6 5}
.cell{fill:var(--a-lt);stroke:#ffffff;stroke-width:2.5}
.cell.new{fill:#eef3fd}

/* ---------- side panel ---------- */
.side{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
  min-height:340px;
  display:flex;flex-direction:column;
}
.steptag{
  font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.side h2{margin-top:10px;font-size:23px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.side p{margin-top:12px;font-size:17px;line-height:1.85;color:#3f4b5f}
.side p b{color:var(--a);font-weight:800}
.side p em{font-style:normal;color:var(--d);font-weight:800}
.side p i{font-style:normal;color:var(--ok);font-weight:800}
.eqbox{margin-top:auto;padding-top:18px}
.eq{
  background:#f8fafc;
  border:1px solid #eef1f6;
  border-left:4px solid var(--a);
  border-radius:10px;
  padding:14px 16px;
  font-size:20px;font-weight:800;
  line-height:1.85;
  font-variant-numeric:tabular-nums;
  color:#0f172a;
  white-space:pre-line;
}
.eq .hl{color:var(--d)}
.eq .ok{color:var(--ok)}

/* ---------- controls ---------- */
.controls{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:16px;font-weight:800;
  padding:11px 20px;border-radius:11px;cursor:pointer;
  transition:all .16s ease;font-family:inherit;
}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{
  background:var(--a);border-color:var(--a);color:#fff;
  box-shadow:0 6px 16px -8px rgba(37,99,235,.7);
}
.btn.primary:hover:not(:disabled){background:var(--a-dk);border-color:var(--a-dk)}
.dots{display:flex;gap:7px;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#d7dce5;cursor:pointer;transition:all .2s ease}
.dot:hover{background:#b6bfcd}
.dot.on{background:var(--a);width:24px;border-radius:5px}
.spacer{flex:1}
.kbd{font-size:13px;color:#94a3b8;font-weight:600}
.kbd b{
  display:inline-block;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;
  font-family:inherit;color:#64748b;margin:0 2px;
}

/* ---------- try panel ---------- */
.try{
  margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px 20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.try .lab{font-size:15px;font-weight:800;color:var(--muted)}
.try input{
  width:92px;font-family:inherit;font-size:17px;font-weight:800;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  color:var(--ink);background:#fbfcfe;font-variant-numeric:tabular-nums;
}
.try input:focus{outline:none;border-color:var(--a);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.try .unit{font-size:15px;font-weight:700;color:var(--muted)}
.try .warn{font-size:14px;font-weight:700;color:var(--d)}

/* ---------- 动画（全站统一） ---------- */
svg rect, svg text, svg g, svg circle{
  transition: width .72s cubic-bezier(.5,0,.2,1),
              height .72s cubic-bezier(.5,0,.2,1),
              x .72s cubic-bezier(.5,0,.2,1),
              y .72s cubic-bezier(.5,0,.2,1),
              opacity .42s ease,
              fill .3s ease,
              stroke .3s ease;
}
.no-anim *{transition:none !important}

/* ---------- 目录页 ---------- */
.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:18px;margin-top:22px;
}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:.18s ease;
  position:relative;overflow:hidden;
}
.card:hover{border-color:#c7d3e6;transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(15,23,42,.28)}
.card .no{
  font-size:13px;font-weight:800;letter-spacing:.08em;color:#9aa6b8;
}
.card h3{margin-top:8px;font-size:22px;font-weight:800}
.card p{margin-top:9px;font-size:15px;line-height:1.7;color:#5b6779}
.card .go{
  margin-top:16px;font-size:14px;font-weight:800;color:var(--a);
}
.card.done::after{
  content:"已做";position:absolute;top:16px;right:16px;
  font-size:12px;font-weight:800;color:var(--ok);
  background:var(--ok-lt);padding:3px 9px;border-radius:999px;
}

.card.soon{opacity:.5;pointer-events:none;background:#fbfcfd}
.card.soon .go{color:#94a3b8}
.sect-title{
  margin:36px 0 4px;font-size:19px;font-weight:800;color:#0f172a;
  display:flex;align-items:center;gap:10px;
}
.sect-title span{
  font-size:12px;font-weight:800;color:#9aa6b8;letter-spacing:.06em;
  background:#eef1f6;padding:3px 9px;border-radius:999px;
}
/* ---- 本页补充 ---- */
svg line{transition:opacity .44s ease, stroke .34s ease, x1 .5s ease, x2 .5s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.fi{animation:fi .38s ease both}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← 全部课程</a>
    <span class="pos">第 9 课 · 工程问题</span>
    <span class="sp"></span>
    <a href="../08-guoche/index.html">← 上一课</a>
    <a href="../../index.html">回到目录 →</a>
  </div>

  <header>
    <div class="kicker">小学数学 · 工程 09</div>
    <h1>工程问题：<span class="q-mark">"合作效率"和"合作时间"别搞混</span></h1>
    <p class="q">甲单独做 <b>10 天</b>完成，乙单独做 <b>15 天</b>完成。两人合作，<em>几天</em>完成？</p>
  </header>

  <div class="main">

    <section class="stage-card">
      <svg id="stage" viewBox="0 0 920 455" preserveAspectRatio="xMidYMid meet">
        <text x="100" y="118" font-size="16" font-weight="700" fill="#94a3b8">一整份活</text>
        <g id="bar"></g>
        <g id="l30"></g>
        <g id="lA"></g>
        <g id="lB"></g>
        <g id="marks"></g>
        <text id="foot" x="100" y="392" font-size="22" font-weight="800" fill="#475569"></text>
      </svg>
    </section>

    <aside class="side">
      <div class="steptag" id="steptag">第 1 步 / 共 7 步</div>
      <h2 id="t"></h2>
      <p id="h"></p>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </aside>

  </div>

  <div class="controls">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn primary" id="next">下一步 →</button>
    <div class="dots" id="dots"></div>
    <div class="spacer"></div>
    <div class="kbd">键盘 <b>←</b> <b>→</b> 翻页</div>
  </div>

  <div class="try">
    <span class="lab">换个天数</span>
    <span class="unit">甲</span>
    <input id="inA" type="number" value="10" min="1" max="30" step="1">
    <span class="unit">天 ·</span>
    <span class="unit">乙</span>
    <input id="inB" type="number" value="15" min="1" max="30" step="1">
    <span class="unit">天</span>
    <button class="btn" id="apply">重新画</button>
    <span class="warn" id="warn"></span>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  function mk(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  /* 条子几何 */
  const X0 = 100, Y = 178, W = 720, H = 84;
  const BASE = Y + H;

  /* 题目状态 */
  let A = 10, B = 15;
  let L = 30, GA = 3, GB = 2, DAY = 5, DAYS = 6, CW = 24;
  const S = { step: 0 };

  const BLUE = '#2563eb', BLUE_D = '#1d4ed8';
  const ORAN = '#f59e0b', ORAN_D = '#b45309';
  const GREY = '#e6eaf1', GREEN = '#0d9488';

  function gcd(a, b){ return b ? gcd(b, a % b) : a; }

  function calc(){
    const g = gcd(A, B);
    L  = A * B / g;
    GA = L / A;
    GB = L / B;
    DAY = GA + GB;
    DAYS = L / DAY;
    CW = W / L;
  }

  /* ---------- 画格子与三种分割线 ---------- */
  function build(){
    const bar = $('bar'), lA = $('lA'), lB = $('lB'), l30 = $('l30');
    bar.innerHTML = ''; lA.innerHTML = ''; lB.innerHTML = ''; l30.innerHTML = '';

    for(let i = 0; i < L; i++){
      bar.appendChild(mk('rect', {
        id: 'c' + i,
        x: X0 + i * CW, y: Y,
        width: CW + 0.8, height: H,
        fill: GREY
      }));
    }
    bar.appendChild(mk('rect', {
      x: X0, y: Y, width: W, height: H,
      fill: 'none', stroke: '#cbd5e1', 'stroke-width': 2
    }));

    for(let k = 1; k < L; k++){
      const x = X0 + k * CW;
      l30.appendChild(mk('line', {x1:x, y1:Y, x2:x, y2:BASE, stroke:'#fff', 'stroke-width':3, opacity:0}));
    }
    for(let k = GA; k < L; k += GA){
      const x = X0 + k * CW;
      lA.appendChild(mk('line', {x1:x, y1:Y, x2:x, y2:BASE, stroke:'#fff', 'stroke-width':3, opacity:0}));
    }
    for(let k = GB; k < L; k += GB){
      const x = X0 + k * CW;
      lB.appendChild(mk('line', {x1:x, y1:Y, x2:x, y2:BASE, stroke:'#fff', 'stroke-width':3, opacity:0}));
    }
  }

  /* ---------- 括号 + 标签 ---------- */
  function br(g, x1, x2, y, dir, color, label){
    const d = 12 * dir;
    const p = mk('path', {
      d: `M${x1} ${y + d} L${x1} ${y} L${x2} ${y} L${x2} ${y + d}`,
      stroke: color, 'stroke-width': 2.6, fill: 'none',
      'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      'class': 'fi'
    });
    g.appendChild(p);
    const t = mk('text', {
      x: (x1 + x2) / 2, y: dir > 0 ? y + 30 : y - 19,
      'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800,
      fill: color, 'class': 'fi'
    });
    t.textContent = label;
    g.appendChild(t);
  }

  function marks(){
    const g = $('marks');
    g.innerHTML = '';
    const st = S.step;
    const x = k => X0 + k * CW;

    if(st === 1){
      br(g, x(0), x(GA), BASE + 12, 1, BLUE_D, `甲 1 天 = 1/${A}`);
    }
    if(st === 2){
      br(g, x(0), x(GB), BASE + 12, 1, ORAN_D, `乙 1 天 = 1/${B}`);
    }
    if(st === 3){
      br(g, x(0), x(GA), Y - 13, -1, BLUE_D, `甲 1 天 = ${GA} 格`);
      br(g, x(0), x(GB), BASE + 12, 1, ORAN_D, `乙 1 天 = ${GB} 格`);
    }
    if(st === 4){
      br(g, x(0), x(GA + GB), BASE + 12, 1, GREEN, `合起来 1 天 = ${DAY} 格`);
    }
    if(st >= 5){
      const n = Math.floor(DAYS);
      for(let d = 0; d < n; d++){
        br(g, x(d * DAY), x((d + 1) * DAY), BASE + 12, 1, '#64748b', `第 ${d + 1} 天`);
      }
    }
  }

  /* ---------- 上色 + 线 ---------- */
  function paint(){
    const st = S.step;

    for(let i = 0; i < L; i++){
      const c = $('c' + i);
      let f = GREY;
      if(st === 1){
        if(i < GA) f = BLUE;
      } else if(st === 2){
        if(i < GB) f = ORAN;
      } else if(st === 3 || st === 4){
        if(i < GA) f = BLUE;
        else if(i < GA + GB) f = ORAN;
      } else if(st >= 5){
        f = (i % DAY) < GA ? BLUE : ORAN;
      }
      c.setAttribute('fill', f);
    }

    const showA  = (st === 1 || st === 3);
    const showB  = (st === 2 || st === 3);
    const show30 = (st >= 4);

    [...$('lA').children].forEach(e => {
      e.setAttribute('opacity', showA ? 1 : 0);
      e.setAttribute('stroke', st === 3 ? BLUE_D : '#ffffff');
    });
    [...$('lB').children].forEach(e => {
      e.setAttribute('opacity', showB ? 1 : 0);
      e.setAttribute('stroke', st === 3 ? ORAN_D : '#ffffff');
    });
    [...$('l30').children].forEach(e => {
      e.setAttribute('opacity', show30 ? 1 : 0);
    });

    marks();

    const foot = $('foot');
    foot.textContent = footText(st);
    foot.setAttribute('fill', st === 3 ? '#ef4444' : (st >= 4 ? GREEN : '#475569'));
    foot.setAttribute('font-size', st === 3 ? 20 : 22);
  }

  function footText(st){
    if(st === 0) return '一整份活 = 1　（不知道多大，就整个当成 1）';
    if(st === 1) return `甲的效率 = 1 ÷ ${A} = 1/${A}`;
    if(st === 2) return `乙的效率 = 1 ÷ ${B} = 1/${B}`;
    if(st === 3) return `甲 1 天占 ${GA} 格，乙 1 天占 ${GB} 格 —— 格子不一样大，加不到一块`;
    if(st === 4) return `切成 ${L} 格　1/${A} = ${GA}/${L}　1/${B} = ${GB}/${L}`;
    if(st === 5) return `合作效率 = ${GA}/${L} + ${GB}/${L} = ${DAY}/${L} = 1/${DAYS}`;
    return `${L} ÷ ${DAY} = ${DAYS}　→　1 ÷ (1/${A} + 1/${B}) = ${DAYS} 天`;
  }

  /* ---------- 七步文案 ---------- */
  function steps(){
    return [
      {
        t: '整件活有多大？不知道',
        h: '题目只说"一项工程"，没说多少方土、多少米路 —— <b>总量根本不给</b>。<br>既然不知道，就把它整个当成 <b>1</b>：一整份活。<br><br>这个 1 不是 1 天，也不是 1 米，就是"<b>一整份</b>"。',
        eq: '整件活 = 1\n（一整份，不是 1 天）'
      },
      {
        t: '甲一个人干：每天 1/' + A,
        h: `要 ${A} 天干完一整份，就等于把这份活<b>平均切成 ${A} 份</b>，甲每天吃掉 1 份。<br>所以 <b>甲的效率 = 1 ÷ ${A} = 1/${A}</b>。<br><br>看条子上最左边那几格 —— 那就是甲一天的活。`,
        eq: `甲的效率 = 1 ÷ ${A} = 1/${A}`
      },
      {
        t: '乙一个人干：每天 1/' + B,
        h: `同一份活，乙要 ${B} 天 → 切成 <b>${B} 份</b>，每天 1 份。<br><b>乙的效率 = 1 ÷ ${B} = 1/${B}</b>。<br><br>注意格子<b>变窄了</b>：同样叫"一天"，乙的一天比甲的一天少。`,
        eq: `乙的效率 = 1 ÷ ${B} = 1/${B}`
      },
      {
        t: '麻烦来了：这两种格子能加吗？',
        h: `把两种切法叠在一起 —— 刀口<em>全错开了</em>。<br>甲的一格 = <b>${GA} 个小格</b>，乙的一格 = <b>${GB} 个小格</b>，大小不一样，<b>加不到一块去</b>。<br><br>1/${A} + 1/${B} 不能直接相加，就像 3 个苹果加 2 个橘子。`,
        eq: `1/${A} + 1/${B} = ？（加不了）`
      },
      {
        t: '切成一样大：' + L + ' 格',
        h: `${A} 和 ${B} 都能整除的数，最小是 <b>${L}</b>。整份切 ${L} 格，两种刀口就<b>全对上了</b>。<br>于是 甲每天 <b>${GA} 格</b>，乙每天 <b>${GB} 格</b>。<br><br>这一步就是<b>通分</b>：分母化成 ${L}，才能相加。`,
        eq: `1/${A} = ${GA}/${L}　　1/${B} = ${GB}/${L}`
      },
      {
        t: '合作效率：一天干 ' + DAY + ' 格',
        h: `两人一起干一天 = 甲 ${GA} 格 + 乙 ${GB} 格 = <b>${DAY} 格</b>。<br>这 ${DAY} 格就是<b>合作效率 = ${DAY}/${L} = 1/${DAYS}</b>，合起来每天干 ${DAYS} 分之一。<br><br>注意：这一步只做了<b>加法</b>，算出来的还是"每天干多少"，<em>不是天数</em>。`,
        eq: `合作效率 = ${GA}/${L} + ${GB}/${L} = ${DAY}/${L} = 1/${DAYS}`
      },
      {
        t: '再用整份去除：' + DAYS + ' 天',
        h: `一整份 1，每天干 1/${DAYS} → <b>1 ÷ 1/${DAYS} = ${DAYS} 天</b>。<br>或者直接数格子：${L} 格，每天 ${DAY} 格，<b>${L} ÷ ${DAY} = ${DAYS} 天</b>。两路同一个答案。<br><br>整道题是<b>三次转身</b>：时间 →(拿 1 除)→ 效率 →(相加)→ 合作效率 →(拿 1 除)→ 时间。<br>这跟相遇问题是同一个模子，只是"路程"换成了"一整份活"。`,
        eq: `1 ÷ (1/${A} + 1/${B}) = 1 ÷ 1/${DAYS} = ${DAYS} 天`
      }
    ];
  }

  let STEPS = steps();

  function render(){
    const st = S.step;
    paint();
    const cur = STEPS[st];
    $('steptag').textContent = `第 ${st + 1} 步 / 共 ${STEPS.length} 步`;
    $('t').textContent = cur.t;
    $('h').innerHTML = cur.h;
    $('eq').innerHTML = cur.eq;

    $('prev').disabled = st === 0;
    $('next').disabled = st === STEPS.length - 1;
    $('next').textContent = st === STEPS.length - 1 ? '已经讲完了' : '下一步 →';
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === st));
  }

  function go(n){
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    if(n === S.step) return;
    S.step = n;
    render();
  }

  $('prev').addEventListener('click', () => go(S.step - 1));
  $('next').addEventListener('click', () => go(S.step + 1));
  STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.title = `第 ${i + 1} 步`;
    d.addEventListener('click', () => go(i));
    $('dots').appendChild(d);
  });
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(S.step + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(S.step - 1); }
  });

  $('apply').addEventListener('click', () => {
    const a = parseInt($('inA').value, 10);
    const b = parseInt($('inB').value, 10);
    const warn = $('warn');
    if(!Number.isFinite(a) || !Number.isFinite(b) || a < 1 || b < 1 || a > 30 || b > 30){
      warn.textContent = '两个天数都要是 1~30 的整数'; return;
    }
    const g = gcd(a, b);
    const lc = a * b / g;
    if(lc > 60){
      warn.textContent = `最小公倍数是 ${lc}，格子太细了，换一对天数（≤60）`;
      return;
    }
    if(lc % (lc / a + lc / b) !== 0){
      warn.textContent = `这组算出来不是整天（${(a*b/(a+b)).toFixed(2)} 天），换一对`;
      return;
    }
    warn.textContent = '';
    A = a; B = b;
    S.step = 0;
    calc(); STEPS = steps(); build(); paint(); render();
  });

  calc();
  build();
  render();
})();
</script>
</body>
</html>
