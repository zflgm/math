<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>浓度 · 加盐加浓：不动的是水</title>
<style>
/* ===== 小学数学动画课 · 公共样式 ===== */
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;
  --d-dk:#b91c1c;
  --b:#f59e0b;
  --b-lt:#fde9c4;
  --s:#94a3b8;
  --ok:#0d9488;
  --ok-lt:#ccfbf1;
  --bg:#f6f7f9;
  --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:18px 26px 32px;
}
.wrap{max-width:1400px;margin:0 auto}

/* ---------- 顶部导航 ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

/* ---------- header ---------- */
header{margin-bottom:18px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;
  margin-bottom:11px;
}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
h1 .q-mark{color:var(--d)}
.q{margin-top:10px;font-size:20px;line-height:1.7;color:#334155;font-weight:500}
.q b{color:var(--a);font-weight:800}
.q em{font-style:normal;color:var(--d);font-weight:800}

/* ---------- layout ---------- */
.main{
  display:grid;
  grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);
  gap:20px;
  align-items:start;
}
@media (max-width:1040px){ .main{grid-template-columns:1fr} }

/* ---------- stage ---------- */
.stage-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px 8px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
}
svg{display:block;width:100%;height:auto;overflow:visible}

/* ---------- 通用 svg 文本 ---------- */
.tag{font-size:22px;font-weight:800;fill:#0f172a}
.tag.sm{font-size:17px;font-weight:700;fill:#64748b}
.val{font-size:27px;font-weight:800;fill:#fff}
.valSum{font-size:19px;font-weight:800;fill:#fff}
.valRed{font-size:24px;font-weight:800;fill:#fff}
.valDark{font-size:24px;font-weight:800;fill:#0f172a}
.diffTxt{font-size:20px;font-weight:800;fill:var(--d)}
.halfTxt{font-size:21px;font-weight:800;fill:#475569}
.hintTxt{font-size:17px;font-weight:700;fill:#94a3b8}
.partNum{font-size:17px;font-weight:800;fill:#fff}

/* ---------- 通用形状 ---------- */
.barA{fill:var(--a)}
.barD{fill:var(--d)}
.barB{fill:var(--b)}
.barS{fill:var(--s)}
.barOk{fill:var(--ok)}
.patch{fill:none;stroke:var(--b);stroke-width:3;stroke-dasharray:9 8}
.patch.on{fill:var(--b-lt);stroke:var(--b);stroke-dasharray:none}
.ghost{fill:none;stroke:#cbd5e1;stroke-width:2.5;stroke-dasharray:7 7}
.split{stroke:#0f172a;stroke-width:3;stroke-linecap:round}
.alignLine{stroke:#334155;stroke-width:2.5;stroke-dasharray:6 6;opacity:.32}
.bracket{stroke:var(--d);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.segLine{stroke:#ffffff;stroke-width:3;stroke-linecap:round}
.unitBox{fill:none;stroke:var(--a);stroke-width:2;stroke-dasharray:6 5}
.cell{fill:var(--a-lt);stroke:#ffffff;stroke-width:2.5}
.cell.new{fill:#eef3fd}

/* ---------- side panel ---------- */
.side{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
  min-height:340px;
  display:flex;flex-direction:column;
}
.steptag{
  font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.side h2{margin-top:10px;font-size:23px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.side p{margin-top:12px;font-size:17px;line-height:1.85;color:#3f4b5f}
.side p b{color:var(--a);font-weight:800}
.side p em{font-style:normal;color:var(--d);font-weight:800}
.side p i{font-style:normal;color:var(--ok);font-weight:800}
.eqbox{margin-top:auto;padding-top:18px}
.eq{
  background:#f8fafc;
  border:1px solid #eef1f6;
  border-left:4px solid var(--a);
  border-radius:10px;
  padding:14px 16px;
  font-size:20px;font-weight:800;
  line-height:1.85;
  font-variant-numeric:tabular-nums;
  color:#0f172a;
  white-space:pre-line;
}
.eq .hl{color:var(--d)}
.eq .ok{color:var(--ok)}

/* ---------- controls ---------- */
.controls{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:16px;font-weight:800;
  padding:11px 20px;border-radius:11px;cursor:pointer;
  transition:all .16s ease;font-family:inherit;
}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{
  background:var(--a);border-color:var(--a);color:#fff;
  box-shadow:0 6px 16px -8px rgba(37,99,235,.7);
}
.btn.primary:hover:not(:disabled){background:var(--a-dk);border-color:var(--a-dk)}
.dots{display:flex;gap:7px;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#d7dce5;cursor:pointer;transition:all .2s ease}
.dot:hover{background:#b6bfcd}
.dot.on{background:var(--a);width:24px;border-radius:5px}
.spacer{flex:1}
.kbd{font-size:13px;color:#94a3b8;font-weight:600}
.kbd b{
  display:inline-block;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;
  font-family:inherit;color:#64748b;margin:0 2px;
}

/* ---------- try panel ---------- */
.try{
  margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px 20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.try .lab{font-size:15px;font-weight:800;color:var(--muted)}
.try input{
  width:92px;font-family:inherit;font-size:17px;font-weight:800;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  color:var(--ink);background:#fbfcfe;font-variant-numeric:tabular-nums;
}
.try input:focus{outline:none;border-color:var(--a);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.try .unit{font-size:15px;font-weight:700;color:var(--muted)}
.try .warn{font-size:14px;font-weight:700;color:var(--d)}

/* ---------- 动画（全站统一） ---------- */
svg rect, svg text, svg g, svg circle{
  transition: width .72s cubic-bezier(.5,0,.2,1),
              height .72s cubic-bezier(.5,0,.2,1),
              x .72s cubic-bezier(.5,0,.2,1),
              y .72s cubic-bezier(.5,0,.2,1),
              opacity .42s ease,
              fill .3s ease,
              stroke .3s ease;
}
.no-anim *{transition:none !important}

/* ---------- 目录页 ---------- */
.cards{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:18px;margin-top:22px;
}
.card{
  display:block;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04);
  transition:.18s ease;
  position:relative;overflow:hidden;
}
.card:hover{border-color:#c7d3e6;transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(15,23,42,.28)}
.card .no{
  font-size:13px;font-weight:800;letter-spacing:.08em;color:#9aa6b8;
}
.card h3{margin-top:8px;font-size:22px;font-weight:800}
.card p{margin-top:9px;font-size:15px;line-height:1.7;color:#5b6779}
.card .go{
  margin-top:16px;font-size:14px;font-weight:800;color:var(--a);
}
.card.done::after{
  content:"已做";position:absolute;top:16px;right:16px;
  font-size:12px;font-weight:800;color:var(--ok);
  background:var(--ok-lt);padding:3px 9px;border-radius:999px;
}

.card.soon{opacity:.5;pointer-events:none;background:#fbfcfd}
.card.soon .go{color:#94a3b8}
.sect-title{
  margin:36px 0 4px;font-size:19px;font-weight:800;color:#0f172a;
  display:flex;align-items:center;gap:10px;
}
.sect-title span{
  font-size:12px;font-weight:800;color:#9aa6b8;letter-spacing:.06em;
  background:#eef1f6;padding:3px 9px;border-radius:999px;
}
/* ---- 本页补充 ---- */
@keyframes fi{from{opacity:0}to{opacity:1}}
.fi{animation:fi .38s ease both}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← 全部课程</a>
    <span class="pos">第 11 课 · 浓度 2/3 · 加浓</span>
    <span class="sp"></span>
    <a href="../10-shuixi/index.html">← 上一课</a>
    <a href="../12-hunhe/index.html">下一课：混合 →</a>
  </div>

  <header>
    <div class="kicker">小学数学 · 浓度 11</div>
    <h1>加盐加浓：<span class="q-mark">这次不动的是水</span></h1>
    <p class="q">有 <b>200 克</b>浓度 <b>25%</b> 的盐水，再加多少克盐，浓度能到 <em>40%</em>？</p>
  </header>

  <div class="main">

    <section class="stage-card">
      <svg id="stage" viewBox="0 0 920 400" preserveAspectRatio="xMidYMid meet">
        <defs>
          <clipPath id="clip"><rect id="clipRect" x="100" y="150" width="576" height="88" rx="9"/></clipPath>
        </defs>

        <rect x="100" y="106" width="16" height="16" rx="4" fill="#f59e0b"/>
        <text x="124" y="119" font-size="15" font-weight="800" fill="#64748b">盐</text>
        <rect x="172" y="106" width="16" height="16" rx="4" fill="#bfdbfe"/>
        <text x="196" y="119" font-size="15" font-weight="800" fill="#64748b">水</text>

        <text x="820" y="122" text-anchor="end" font-size="27" font-weight="800" id="conc" fill="#0f172a">浓度 25%</text>

        <!-- 目标虚线 -->
        <g id="target" opacity="0">
          <line x1="820" y1="146" x2="820" y2="252" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="7 6"/>
          <text x="812" y="146" text-anchor="end" font-size="15" font-weight="800" fill="#ef4444">250 克在这里</text>
        </g>

        <g clip-path="url(#clip)">
          <rect id="segSalt" x="100" y="150" width="144" height="88" fill="#f59e0b"/>
          <rect id="segWater" x="244" y="150" width="432" height="88" fill="#bfdbfe"/>
        </g>
        <rect id="frame" x="100" y="150" width="576" height="88" rx="9" fill="none" stroke="#cbd5e1" stroke-width="2"/>

        <text id="tSalt" x="172" y="203" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">50 克</text>
        <text id="tWater" x="460" y="203" text-anchor="middle" font-size="18" font-weight="800" fill="#1e40af">水 150 克</text>

        <text id="sum" x="100" y="292" font-size="21" font-weight="800" fill="#475569"></text>
        <text id="foot" x="100" y="345" font-size="21" font-weight="800" fill="#0d9488"></text>
      </svg>
    </section>

    <aside class="side">
      <div class="steptag" id="steptag">第 1 步 / 共 7 步</div>
      <h2 id="t"></h2>
      <p id="h"></p>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </aside>

  </div>

  <div class="controls">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn primary" id="next">下一步 →</button>
    <div class="dots" id="dots"></div>
    <div class="spacer"></div>
    <div class="kbd">键盘 <b>←</b> <b>→</b> 翻页</div>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);

  const X0 = 100, Y = 150, H = 88;
  const MAXG = 250;
  const K = 720 / MAXG;          // 2.88 px / 克
  const WATER = 150;

  /* 各步的盐量（克） */
  const SALT = [50, 50, 50, 50, 100, 100, 100];

  const S = { step: 0 };

  const STEPS = [
    {
      t: '先把这杯拆开',
      h: '200 克、浓度 25% 的盐水。<br>盐 = 200 × 25% = <b>50 克</b>，水 = 200 − 50 = <b>150 克</b>。<br><br>橙条 50，蓝条 150。<b>把蓝条这个长度记在心里</b>，下一步它就不动了。',
      eq: '盐 = 200 × 25% = 50 克\n水 = 200 − 50 = 150 克'
    },
    {
      t: '要加盐了 —— 这次哪个不动？',
      h: '往里加的<b>只有盐</b>，一滴水都没倒。<br>所以<b>水一动不动，还是 150 克</b>。<br><br>和上一课正好相反：<br>加水 → 盐不动；加盐 → <b>水</b>不动。',
      eq: '水 = 150 克（不变）'
    },
    {
      t: '反推：40% 时水占几成',
      h: '浓度 40%，就是盐占 4 成，那<b>水占 6 成</b>（100% − 40%）。<br>水是 150 克，占 6 成，整杯该有多重？<br><b>150 ÷ 60% = 250 克</b>。<br><br>看右边那条红色虚线：250 克在那么远的地方。',
      eq: '水占 1 − 40% = 60%\n150 ÷ 60% = 250 克'
    },
    {
      t: '所以差多少盐？',
      h: '现在整杯 200 克，要变成 250 克 ——<br>中间差的这 <b>50 克</b>，正是要加进去的盐。<br><b>250 − 200 = 50 克</b>。<br><br>这 50 克加到溶液上，同时也加到盐上，是同一个数。',
      eq: '加盐 = 250 − 200 = 50 克'
    },
    {
      t: '加进去，数一数',
      h: '盐从 50 变成 <b>100 克</b>，水还是 <b>150 克</b>，整杯 <b>250 克</b>。<br><b>100 ÷ 250 = 40%</b> ✓<br><br>看蓝条 —— 一动没动。这就是"水不变"这句话的证据。',
      eq: '盐 50 + 50 = 100 克\n水 150 克（没动）\n100 ÷ 250 = 40%'
    },
    {
      t: '用方程再对一遍',
      h: '设加 x 克盐。加完之后，盐是 50 + x，溶液是 200 + x：<br><br>(50 + x) ÷ (200 + x) = 40%<br>50 + x = 80 + 0.4x<br>0.6x = 30<br><b>x = 50</b><br><br>两条路同一个答案，可以互相当验算。',
      eq: '(50 + x) ÷ (200 + x) = 40%\n0.6x = 30　→　x = 50 克'
    },
    {
      t: '最容易绕晕的一句话',
      h: '加盐的时候，<b>变的是盐，不变的是水</b>。<br>溶液确实变重了（200 → 250）—— 要是记成"溶液没变"，这题就彻底乱了。<br><br>一句话：<em>加什么，什么变；没加的那样不动</em>。',
      eq: '加水 → 盐不动\n加盐 → 水不动\n倒掉一些 → 浓度不动'
    }
  ];

  function paint(){
    const st = S.step;
    const salt = SALT[st];
    const whole = salt + WATER;

    const wSalt = salt * K;
    const wWater = WATER * K;
    const wAll = whole * K;

    $('segSalt').setAttribute('width', wSalt);
    $('segWater').setAttribute('x', X0 + wSalt);
    $('segWater').setAttribute('width', wWater);
    $('clipRect').setAttribute('width', wAll);
    $('frame').setAttribute('width', wAll);

    $('tSalt').setAttribute('x', X0 + wSalt / 2);
    $('tSalt').textContent = `${salt} 克`;
    $('tWater').setAttribute('x', X0 + wSalt + wWater / 2);

    const conc = salt / whole;
    $('conc').textContent = `浓度 ${Math.round(conc * 1000) / 10}%`;

    $('target').setAttribute('opacity', (st === 2 || st === 3) ? 1 : 0);

    const cw = $('segWater');
    cw.setAttribute('class', (st === 1 || st === 4) ? 'pulse' : '');

    $('sum').textContent = `整杯 ${whole} 克　其中盐 ${salt} 克、水 ${WATER} 克`;
    $('foot').textContent = FOOT[st];
  }

  const FOOT = [
    '200 克 = 盐 50 + 水 150',
    '水 150 克，从头到尾不会变',
    '水占 6 成 → 整杯 150 ÷ 60% = 250 克',
    '250 − 200 = 50 克，就是它',
    '盐 100 克 ÷ 溶液 250 克 = 40%',
    '方程和算术，两条路同一个答案',
    '加什么，什么变；没加的那样不动'
  ];

  function render(){
    const st = S.step;
    paint();
    const cur = STEPS[st];
    $('steptag').textContent = `第 ${st + 1} 步 / 共 ${STEPS.length} 步`;
    $('t').textContent = cur.t;
    $('h').innerHTML = cur.h;
    $('eq').innerHTML = cur.eq;

    $('prev').disabled = st === 0;
    $('next').disabled = st === STEPS.length - 1;
    $('next').textContent = st === STEPS.length - 1 ? '已经讲完了' : '下一步 →';
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === st));
  }

  function go(n){
    n = Math.max(0, Math.min(STEPS.length - 1, n));
    if(n === S.step) return;
    S.step = n;
    render();
  }

  $('prev').addEventListener('click', () => go(S.step - 1));
  $('next').addEventListener('click', () => go(S.step + 1));
  STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot'; d.title = `第 ${i + 1} 步`;
    d.addEventListener('click', () => go(i));
    $('dots').appendChild(d);
  });
  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(S.step + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(S.step - 1); }
  });

  render();
})();
</script>
</body>
</html>
