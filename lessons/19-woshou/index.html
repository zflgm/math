<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>握手 · 为什么最后要除以 2</title>
<style>
/* ===== 小学数学动画课 · 公共样式 ===== */
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;
  --d-dk:#b91c1c;
  --b:#f59e0b;
  --b-lt:#fde9c4;
  --s:#94a3b8;
  --ok:#0d9488;
  --ok-lt:#ccfbf1;
  --bg:#f6f7f9;
  --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:18px 26px 32px;
}
.wrap{max-width:1400px;margin:0 auto}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

header{margin-bottom:18px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;
  margin-bottom:11px;
}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
h1 .q-mark{color:var(--d)}
.q{margin-top:10px;font-size:20px;line-height:1.7;color:#334155;font-weight:500}
.q b{color:var(--a);font-weight:800}
.q em{font-style:normal;color:var(--d);font-weight:800}

.main{
  display:grid;
  grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);
  gap:20px;
  align-items:start;
}
@media (max-width:1040px){ .main{grid-template-columns:1fr} }

.stage-card{
  background:linear-gradient(180deg,#fffdf8 0%,#ffffff 60%);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px 8px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
}
svg{display:block;width:100%;height:auto;overflow:visible}

.side{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
  min-height:340px;
  display:flex;flex-direction:column;
}
.steptag{
  font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.side h2{margin-top:10px;font-size:23px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.side p{margin-top:12px;font-size:17px;line-height:1.85;color:#3f4b5f}
.side p b{color:var(--a);font-weight:800}
.side p em{font-style:normal;color:var(--d);font-weight:800}
.side p i{font-style:normal;color:var(--ok);font-weight:800}
.eqbox{margin-top:auto;padding-top:18px}
.eq{
  background:#f8fafc;
  border:1px solid #eef1f6;
  border-left:4px solid var(--a);
  border-radius:10px;
  padding:14px 16px;
  font-size:20px;font-weight:800;
  line-height:1.85;
  font-variant-numeric:tabular-nums;
  color:#0f172a;
  white-space:pre-line;
}
.eq .hl{color:var(--d)}
.eq .ok{color:var(--ok)}

.controls{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:16px;font-weight:800;
  padding:11px 20px;border-radius:11px;cursor:pointer;
  transition:all .16s ease;font-family:inherit;
}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{
  background:var(--a);border-color:var(--a);color:#fff;
  box-shadow:0 6px 16px -8px rgba(37,99,235,.7);
}
.btn.primary:hover:not(:disabled){background:var(--a-dk);border-color:var(--a-dk)}
.dots{display:flex;gap:7px;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#d7dce5;cursor:pointer;transition:all .2s ease}
.dot:hover{background:#b6bfcd}
.dot.on{background:var(--a);width:24px;border-radius:5px}
.spacer{flex:1}
.kbd{font-size:13px;color:#94a3b8;font-weight:600}
.kbd b{
  display:inline-block;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;
  font-family:inherit;color:#64748b;margin:0 2px;
}

/* ---------- 本页 ---------- */
#gPeople,#gMatrix{transition:opacity .42s ease}
.ln{transition:stroke-dashoffset .46s ease,stroke .3s ease,opacity .3s ease}
.pl{transition:opacity .3s ease}
.hd,.bd{transition:fill .3s ease,opacity .3s ease}
.nm{font-size:16px;font-weight:800;fill:#0f172a;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.halo{transition:opacity .3s ease,stroke .3s ease}
.cell{transition:fill .28s ease,opacity .28s ease}
.ct{transition:opacity .28s ease,fill .28s ease}
.mlab{font-size:15px;font-weight:800;fill:#94a3b8;letter-spacing:.06em}
.mnum{font-size:52px;font-weight:800;fill:#0f172a;font-variant-numeric:tabular-nums;transition:fill .3s ease}
.hint{font-size:14px;font-weight:700;fill:#b6bfcd}
#sumT{font-size:27px;font-weight:800;fill:#0f172a;font-variant-numeric:tabular-nums}
#roundT{font-size:16px;font-weight:800;fill:#94a3b8}
#bigEq{font-size:34px;font-weight:800;fill:#0d9488;font-variant-numeric:tabular-nums;transition:opacity .3s ease}

body.nt .ln,body.nt .cell,body.nt .ct,body.nt .hd,body.nt .bd,body.nt .halo{transition:none!important}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← 全部课程</a>
    <span class="pos">第 19 课 · 握手与比赛</span>
    <span class="sp"></span>
    <a href="../18-qicha/index.html">← 上一课</a>
    <a href="../../index.html">回到目录 →</a>
  </div>

  <header>
    <div class="kicker">小学数学 · 数学广角 19</div>
    <h1>握手：<span class="q-mark">为什么最后要除以 2</span></h1>
    <p class="q">5 个人，每两人之间握一次手，一共握 <b>几次</b>？每人握 4 次，5 个人就是 20 次 —— 可答案是 <b>10</b>。少掉的那一半去哪了？</p>
  </header>

  <div class="main">

    <section class="stage-card">
      <svg id="stage" viewBox="0 0 960 470" preserveAspectRatio="xMidYMid meet">

        <g id="gPeople">
          <circle cx="480" cy="200" r="144" fill="none" stroke="#f1f5f9" stroke-width="3" stroke-dasharray="8 10"/>
          <g id="gLines"></g>
          <g id="gFolk"></g>
          <text id="roundT" x="40" y="46" text-anchor="start"></text>
          <text id="sumT" x="480" y="440" text-anchor="middle" opacity="0"></text>
        </g>

        <g id="gMatrix" opacity="0">
          <g id="gCells"></g>
          <g id="gMLab"></g>

          <text class="mlab" x="700" y="132" text-anchor="middle" opacity="0" id="lab1">格　子</text>
          <text class="mnum" x="700" y="196" text-anchor="middle" opacity="0" id="num1">25</text>

          <text class="mlab" x="700" y="268" text-anchor="middle" opacity="0" id="lab2">事　情</text>
          <text class="mnum" x="700" y="332" text-anchor="middle" opacity="0" id="num2">?</text>

          <text id="bigEq" x="700" y="388" text-anchor="middle" opacity="0"></text>
        </g>

      </svg>
    </section>

    <aside class="side">
      <div class="steptag" id="steptag">第 1 步 / 共 9 步</div>
      <h2 id="h"></h2>
      <p id="t"></p>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </aside>

  </div>

  <div class="controls">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn primary" id="next">下一步 →</button>
    <div class="dots" id="dots"></div>
    <div class="spacer"></div>
    <div class="kbd">按 <b>←</b> <b>→</b> 或 <b>空格</b> 翻页</div>
  </div>

</div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);
  const mk = (t, a) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', t);
    for(const k in a) e.setAttribute(k, a[k]);
    return e;
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* ---------- 五个人，围一圈 ---------- */
  const HUE = ['#2563eb', '#0d9488', '#d97706', '#7c3aed', '#db2777'];
  const PPL = [
    {n:'甲', x:480, y:56},
    {n:'乙', x:617, y:156},
    {n:'丙', x:565, y:316},
    {n:'丁', x:395, y:316},
    {n:'戊', x:343, y:156}
  ];

  const S = { step:0 };
  let token = 0;

  const folk = [];
  const lines = {};

  function edge(i, j){
    const a = PPL[i], b = PPL[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    const ux = dx / d, uy = dy / d, R = 38;
    return {
      x1: a.x + ux * R, y1: a.y + uy * R,
      x2: b.x - ux * R, y2: b.y - uy * R,
      len: d - R * 2
    };
  }

  function buildFolk(){
    const host = $('gFolk');
    PPL.forEach((p, i) => {
      const g = mk('g', {class:'pl'});
      const halo = mk('circle', {class:'halo', cx:p.x, cy:p.y, r:52, fill:'none',
        stroke:HUE[i], 'stroke-width':3.5, opacity:0});
      const body = mk('path', {class:'bd', d:'M' + (p.x - 24) + ' ' + (p.y + 34) +
        ' Q' + (p.x - 24) + ' ' + (p.y + 2) + ' ' + p.x + ' ' + (p.y + 2) +
        ' Q' + (p.x + 24) + ' ' + (p.y + 2) + ' ' + (p.x + 24) + ' ' + (p.y + 34) + ' Z',
        fill:HUE[i], opacity:.4, stroke:HUE[i], 'stroke-width':1.5, 'stroke-opacity':.55});
      const head = mk('circle', {class:'hd', cx:p.x, cy:p.y - 16, r:18, fill:HUE[i], opacity:1});
      const nm = mk('text', {class:'nm', x:p.x, y:p.y + 58, 'text-anchor':'middle'});
      nm.textContent = p.n;
      host.appendChild(halo);
      host.appendChild(body);
      host.appendChild(head);
      host.appendChild(nm);
      folk[i] = {halo, body, head};
    });
  }

  function buildLines(){
    const host = $('gLines');
    for(let i = 0; i < 5; i++){
      for(let j = i + 1; j < 5; j++){
        const e = edge(i, j);
        const el = mk('line', {
          class:'ln', x1:e.x1, y1:e.y1, x2:e.x2, y2:e.y2,
          stroke:'#cbd5e1', 'stroke-width':3.5, 'stroke-linecap':'round',
          'stroke-dasharray':e.len, 'stroke-dashoffset':e.len, opacity:0
        });
        host.appendChild(el);
        lines[i + '-' + j] = {el, len:e.len};
      }
    }
  }

  function resetLines(){
    for(const key in lines){
      const L = lines[key];
      L.el.setAttribute('opacity', 0);
      L.el.setAttribute('stroke', '#cbd5e1');
      L.el.style.strokeDashoffset = L.len + 'px';
    }
    folk.forEach(f => f.halo.setAttribute('opacity', 0));
    $('sumT').setAttribute('opacity', 0);
    $('sumT').textContent = '';
    $('sumT').style.fill = '#0f172a';
    $('roundT').textContent = '';
  }

  function drawLine(i, j){
    const L = lines[i + '-' + j] || lines[j + '-' + i];
    if(!L) return;
    L.el.setAttribute('opacity', 1);
    L.el.setAttribute('stroke', '#93c5fd');
    L.el.style.strokeDashoffset = '0px';
  }

  /* ---------- 5 × 5 表格 ---------- */
  const GX = 240, GY = 96, C = 62, W = 58;
  const cells = [];
  const diag = [];
  const mlabs = [];

  function buildCells(){
    const host = $('gCells');
    for(let i = 0; i < 5; i++){
      for(let j = 0; j < 5; j++){
        const x = GX + j * C, y = GY + i * C;
        const r = mk('rect', {class:'cell', x:x, y:y, width:W, height:W, rx:9,
          fill:'#ffffff', stroke:'#e2e8f0', 'stroke-width':1.6, opacity:0});
        const t = mk('text', {class:'ct', x:x + W / 2, y:y + W / 2 + 1, 'text-anchor':'middle',
          'dominant-baseline':'central', 'font-size':18, 'font-weight':800, fill:'#1d4ed8', opacity:0});
        host.appendChild(r);
        host.appendChild(t);
        cells[i + '-' + j] = {r, t};
      }
    }
    for(let i = 0; i < 5; i++){
      const x = GX + i * C, y = GY + i * C;
      const s = mk('line', {class:'cell', x1:x + 11, y1:y + 11, x2:x + W - 11, y2:y + W - 11,
        stroke:'#cbd5e1', 'stroke-width':2, 'stroke-linecap':'round', opacity:0});
      host.appendChild(s);
      diag[i] = s;
    }
  }

  function buildMLab(){
    const host = $('gMLab');
    for(let j = 0; j < 5; j++){
      const t = mk('text', {class:'ct', x:GX + j * C + W / 2, y:GY - 14, 'text-anchor':'middle',
        'font-size':16, 'font-weight':800, fill:'#94a3b8', opacity:0});
      t.textContent = PPL[j].n;
      host.appendChild(t);
      mlabs.push(t);
    }
    for(let i = 0; i < 5; i++){
      const t = mk('text', {class:'ct', x:GX - 16, y:GY + i * C + W / 2 + 1, 'text-anchor':'end',
        'dominant-baseline':'central', 'font-size':16, 'font-weight':800, fill:'#94a3b8', opacity:0});
      t.textContent = PPL[i].n;
      host.appendChild(t);
      mlabs.push(t);
    }
  }

  function resetMatrix(){
    for(let i = 0; i < 5; i++){
      for(let j = 0; j < 5; j++){
        const c = cells[i + '-' + j];
        c.r.setAttribute('opacity', 0);
        c.r.setAttribute('fill', '#ffffff');
        c.r.setAttribute('stroke', '#e2e8f0');
        c.t.setAttribute('opacity', 0);
        c.t.setAttribute('fill', '#1d4ed8');
        c.t.textContent = '';
      }
      diag[i].setAttribute('opacity', 0);
    }
    mlabs.forEach(t => t.setAttribute('opacity', 0));
    ['lab1', 'lab2', 'num1', 'num2', 'bigEq'].forEach(id => $(id).setAttribute('opacity', 0));
    $('num1').textContent = '25';
    $('num1').style.fill = '#0f172a';
    $('num2').textContent = '?';
    $('num2').style.fill = '#94a3b8';
    $('bigEq').textContent = '';
    $('bigEq').style.fontSize = '';
  }

  function showMatrixOn(v){
    $('gMatrix').style.opacity = v ? 1 : 0;
    $('gPeople').style.opacity = v ? 0 : 1;
  }

  function cellOn(i, j){
    const c = cells[i + '-' + j];
    c.r.setAttribute('opacity', 1);
    c.t.setAttribute('opacity', 1);
  }

  /* ---------- 硬设状态（跳步时用） ---------- */
  function hard(fn){
    document.body.classList.add('nt');
    fn();
    void $('stage').getBoundingClientRect();
    document.body.classList.remove('nt');
  }

  function setSum(txt, show){
    const el = $('sumT');
    el.textContent = txt;
    el.setAttribute('opacity', show ? 1 : 0);
  }

  /* ---------- 动画 ---------- */
  async function anim(k, tk){
    const alive = () => tk === token;

    if(k === 0){
      showMatrixOn(false);
      hard(resetLines);
      $('roundT').textContent = '五个人，每两人之间握一次';
      return;
    }

    if(k === 1){
      showMatrixOn(false);
      hard(resetLines);
      $('roundT').textContent = '';
      await sleep(120); if(!alive()) return;

      const rounds = [[0, [1, 2, 3, 4], '4'], [1, [2, 3, 4], '3'], [2, [3, 4], '2'], [3, [4], '1'], [4, [], '0']];
      const done = [];

      for(const [who, list, num] of rounds){
        folk.forEach((f, idx) => f.halo.setAttribute('opacity', idx === who ? 1 : 0));
        $('roundT').textContent = PPL[who].n + '：还能跟 ' + num + ' 个人握';
        $('roundT').style.fill = HUE[who];
        await sleep(360); if(!alive()) return;

        for(const b of list){
          const i = Math.min(who, b), j = Math.max(who, b);
          drawLine(i, j);
          await sleep(300); if(!alive()) return;
        }

        done.push(num);
        setSum(done.join(' + '), true);
        await sleep(320); if(!alive()) return;
      }

      folk.forEach(f => f.halo.setAttribute('opacity', 0));
      $('roundT').textContent = '';
      setSum('4 + 3 + 2 + 1 = 10', true);
      return;
    }

    if(k === 2){
      showMatrixOn(false);
      hard(() => {
        resetLines();
        for(let i = 0; i < 5; i++){
          for(let j = i + 1; j < 5; j++) drawLine(i, j);
        }
        setSum('4 + 3 + 2 + 1 = 10', true);
      });
      for(const key in lines) lines[key].el.setAttribute('opacity', 0.2);
      await sleep(320); if(!alive()) return;

      for(let i = 0; i < 5; i++){
        folk.forEach(f => f.halo.setAttribute('opacity', 0));
        folk[i].halo.setAttribute('opacity', 1);
        $('roundT').style.fill = HUE[i];
        $('roundT').textContent = PPL[i].n + '：跟其余 4 个人，各握一次';
        await sleep(420); if(!alive()) return;
      }

      folk.forEach(f => f.halo.setAttribute('opacity', 1));
      $('roundT').style.fill = '#dc2626';
      $('roundT').textContent = '每人 4 次 × 5 个人 = 20 次';
      $('roundT').style.fill = '#dc2626';
      setSum('5 × 4 = 20', true);
      $('sumT').style.fill = '#dc2626';
      return;
    }

    if(k === 3){
      showMatrixOn(true);
      hard(() => {
        resetMatrix();
        for(let i = 0; i < 5; i++){
          for(let j = 0; j < 5; j++) cellOn(i, j);
        }
        mlabs.forEach(t => t.setAttribute('opacity', 1));
        ['lab1', 'lab2', 'num1', 'num2'].forEach(id => $(id).setAttribute('opacity', 1));
      });
      await sleep(420); if(!alive()) return;

      for(let i = 0; i < 5; i++){
        diag[i].setAttribute('opacity', 1);
        const c = cells[i + '-' + i];
        c.r.setAttribute('fill', '#e8eef6');
        c.r.setAttribute('stroke', '#e2e8f0');
        await sleep(180); if(!alive()) return;
      }

      $('num1').textContent = '20';
      $('num1').style.fill = '#dc2626';
      return;
    }

    if(k === 4){
      showMatrixOn(true);
      hard(() => {
        resetMatrix();
        for(let i = 0; i < 5; i++){
          for(let j = 0; j < 5; j++) cellOn(i, j);
        }
        mlabs.forEach(t => t.setAttribute('opacity', 1));
        ['lab1', 'lab2', 'num1', 'num2'].forEach(id => $(id).setAttribute('opacity', 1));
        for(let i = 0; i < 5; i++){
          diag[i].setAttribute('opacity', 1);
          cells[i + '-' + i].r.setAttribute('fill', '#e8eef6');
        }
        $('num1').textContent = '20';
        $('num1').style.fill = '#dc2626';
      });
      await sleep(320); if(!alive()) return;

      let n = 0;
      for(let i = 0; i < 4; i++){
        for(let j = i + 1; j < 5; j++){
          n++;
          const c = cells[i + '-' + j];
          c.r.setAttribute('fill', '#dbeafe');
          c.r.setAttribute('stroke', '#93c5fd');
          c.t.textContent = n;
          await sleep(155); if(!alive()) return;
        }
      }
      await sleep(200); if(!alive()) return;
      $('num2').textContent = '10';
      $('num2').style.fill = '#2563eb';
      return;
    }

    if(k === 5){
      showMatrixOn(true);
      hard(() => {
        resetMatrix();
        for(let i = 0; i < 5; i++){
          for(let j = 0; j < 5; j++) cellOn(i, j);
        }
        mlabs.forEach(t => t.setAttribute('opacity', 1));
        ['lab1', 'lab2', 'num1', 'num2'].forEach(id => $(id).setAttribute('opacity', 1));
        for(let i = 0; i < 5; i++){
          diag[i].setAttribute('opacity', 1);
          cells[i + '-' + i].r.setAttribute('fill', '#e8eef6');
        }
        let n = 0;
        for(let i = 0; i < 4; i++){
          for(let j = i + 1; j < 5; j++){
            n++;
            const c = cells[i + '-' + j];
            c.r.setAttribute('fill', '#dbeafe');
            c.r.setAttribute('stroke', '#93c5fd');
            c.t.textContent = n;
          }
        }
        $('num1').textContent = '20';
        $('num1').style.fill = '#dc2626';
        $('num2').textContent = '10';
        $('num2').style.fill = '#2563eb';
      });
      await sleep(320); if(!alive()) return;

      for(let i = 1; i < 5; i++){
        for(let j = 0; j < i; j++){
          const c = cells[i + '-' + j];
          c.r.setAttribute('fill', '#e8eef6');
          c.r.setAttribute('stroke', '#cbd5e1');
          c.t.setAttribute('fill', '#94a3b8');
          c.t.textContent = cells[j + '-' + i].t.textContent;
          await sleep(120); if(!alive()) return;
        }
      }

      $('num1').style.fill = '#0f172a';
      $('bigEq').textContent = '20 ÷ 2 = 10';
      $('bigEq').setAttribute('opacity', 1);
      return;
    }

    if(k === 6){
      showMatrixOn(true);
      hard(() => {
        resetMatrix();
        for(let i = 0; i < 5; i++){
          for(let j = 0; j < 5; j++) cellOn(i, j);
        }
        mlabs.forEach(t => t.setAttribute('opacity', 1));
        ['lab1', 'lab2', 'num1', 'num2', 'bigEq'].forEach(id => $(id).setAttribute('opacity', 1));
        for(let i = 0; i < 5; i++){
          diag[i].setAttribute('opacity', 1);
          cells[i + '-' + i].r.setAttribute('fill', '#e8eef6');
        }
        let n = 0;
        for(let i = 0; i < 4; i++){
          for(let j = i + 1; j < 5; j++){
            n++;
            const c = cells[i + '-' + j];
            c.r.setAttribute('fill', '#dbeafe');
            c.r.setAttribute('stroke', '#93c5fd');
            c.t.textContent = n;
          }
        }
        for(let i = 1; i < 5; i++){
          for(let j = 0; j < i; j++){
            const c = cells[i + '-' + j];
            c.r.setAttribute('fill', '#e8eef6');
            c.r.setAttribute('stroke', '#cbd5e1');
            c.t.setAttribute('fill', '#94a3b8');
            c.t.textContent = cells[j + '-' + i].t.textContent;
          }
        }
        $('num1').textContent = '20';
        $('num1').style.fill = '#0f172a';
        $('num2').textContent = '10';
        $('num2').style.fill = '#0d9488';
        $('bigEq').textContent = '20 ÷ 2 = 10';
      });
      return;
    }

    if(k === 7){
      showMatrixOn(true);
      hard(() => {
        resetMatrix();
        for(let i = 0; i < 5; i++){
          for(let j = 0; j < 5; j++) cellOn(i, j);
        }
        mlabs.forEach(t => t.setAttribute('opacity', 1));
        ['lab1', 'lab2', 'num1', 'num2', 'bigEq'].forEach(id => $(id).setAttribute('opacity', 1));
        for(let i = 0; i < 5; i++){
          diag[i].setAttribute('opacity', 1);
          cells[i + '-' + i].r.setAttribute('fill', '#e8eef6');
        }
        let n = 0;
        for(let i = 0; i < 4; i++){
          for(let j = i + 1; j < 5; j++){
            n++;
            const c = cells[i + '-' + j];
            c.r.setAttribute('fill', '#dbeafe');
            c.r.setAttribute('stroke', '#93c5fd');
            c.t.textContent = n;
          }
        }
        $('num1').textContent = '20';
        $('num1').style.fill = '#0f172a';
        $('num2').textContent = '20';
        $('num2').style.fill = '#d97706';
        $('bigEq').textContent = '20 件，一件不少';
        $('bigEq').style.fill = '#b45309';
      });
      await sleep(380); if(!alive()) return;

      let n = 10;
      for(let i = 1; i < 5; i++){
        for(let j = 0; j < i; j++){
          n++;
          const c = cells[i + '-' + j];
          c.r.setAttribute('fill', '#fef3c7');
          c.r.setAttribute('stroke', '#f5c56b');
          c.t.setAttribute('fill', '#b45309');
          c.t.textContent = n;
          await sleep(120); if(!alive()) return;
        }
      }
      $('bigEq').textContent = '20 件，一件不少';
      $('bigEq').style.fill = '#b45309';
      return;
    }

    if(k === 8){
      showMatrixOn(true);
      hard(() => {
        resetMatrix();
        for(let i = 0; i < 5; i++){
          for(let j = 0; j < 5; j++) cellOn(i, j);
        }
        mlabs.forEach(t => t.setAttribute('opacity', 1));
        ['lab1', 'lab2', 'num1', 'num2', 'bigEq'].forEach(id => $(id).setAttribute('opacity', 1));
        for(let i = 0; i < 5; i++){
          diag[i].setAttribute('opacity', 1);
          cells[i + '-' + i].r.setAttribute('fill', '#e8eef6');
        }
        let n = 0;
        for(let i = 0; i < 4; i++){
          for(let j = i + 1; j < 5; j++){
            n++;
            const c = cells[i + '-' + j];
            c.r.setAttribute('fill', '#dbeafe');
            c.r.setAttribute('stroke', '#93c5fd');
            c.t.textContent = n;
          }
        }
        let m = 10;
        for(let i = 1; i < 5; i++){
          for(let j = 0; j < i; j++){
            m++;
            const c = cells[i + '-' + j];
            c.r.setAttribute('fill', '#fef3c7');
            c.r.setAttribute('stroke', '#f5c56b');
            c.t.setAttribute('fill', '#b45309');
            c.t.textContent = m;
          }
        }
        $('num1').textContent = '20';
        $('num1').style.fill = '#0f172a';
        $('num2').textContent = '20';
        $('num2').style.fill = '#d97706';
        $('bigEq').style.fontSize = '25px';
        $('bigEq').innerHTML = '<tspan x="700" dy="0">算同一件事 → 10</tspan><tspan x="700" dy="30">算两件事 → 20</tspan>';
        $('bigEq').style.fill = '#0f172a';
      });
      return;
    }
  }

  /* ---------- 文案 ---------- */
  const STEPS = [
    {
      h:'五个人，每两人握一次',
      t:'甲、乙、丙、丁、戊五个人站成一圈，<b>每两人之间握一次手</b>。一共握几次？先别想公式，一个一个来。',
      eq:'5 个人\n每两人握一次\n一共几次？'
    },
    {
      h:'一个人一个人地数：10 次',
      t:'甲跟其余 4 人各握一次；轮到乙，甲已经握过，只剩 <b>3 个人</b>；丙剩 2 人，丁剩 1 人，戊没人可握。',
      eq:'4 + 3 + 2 + 1\n= <span class="ok">10 次</span>'
    },
    {
      h:'换个数法：每人握 4 次',
      t:'不按"谁跟谁"数，改成按人算：每个人都要跟其余 <b>4 个人</b>握（自己不能跟自己握），所以每人 4 次。5 个人就是 5 × 4 = <em>20 次</em>。',
      eq:'每人 4 次\n5 × 4 = <span class="hl">20 次</span>'
    },
    {
      h:'可答案是 10，不是 20',
      t:'两种数法差了一整倍。多出来的 10 次是什么？把每两人的组合摊成一张 <b>5 × 5 的表</b>，先划掉对角线 —— 那是自己跟自己，握不了。',
      eq:'25 个格子\n− 5 个对角线\n= 20 个格子'
    },
    {
      h:'上半张表：编号 1 到 10',
      t:'每一格代表两个人握一次。从上三角开始编号，一格一格数下去，最后停在 <b>10</b>。',
      eq:'上三角 10 格\n编号 1 ~ 10'
    },
    {
      h:'下半张表，全是重复的',
      t:'甲—乙在甲的账上记了一笔（上三角），在乙的账上又记了一笔（下三角）。<em>每个编号都出现了两次</em>。',
      eq:'20 个格子\n只有 10 个编号\n每个编号出现 2 次'
    },
    {
      h:'所以最后要除以 2',
      t:'整张表 n × n 个格子，减去对角线 n 个，剩下的格子关于对角线两两配对，砍掉一半。',
      eq:'n × n − n = n(n−1)\n再 ÷ 2\n= n(n−1) / 2'
    },
    {
      h:'换个场景，就不能除以 2',
      t:'甲送乙一张贺卡，和乙送甲一张贺卡，是<em>两件事</em>。这时 20 个格子就是 20 件，一个都不能砍。',
      eq:'送贺卡：20 件\n（不除 2）\n握手：20 ÷ 2 = 10 次'
    },
    {
      h:'一句话判断',
      t:'A 对 B 和 B 对 A，算不算同一件事？<b>算，就除以 2</b>；<em>不算，就不除</em>。',
      eq:'A 对 B 与 B 对 A\n同一件事 → ÷ 2\n两件事 → 不除'
    }
  ];

  /* ---------- 渲染 ---------- */
  function render(){
    const k = S.step;
    const cur = STEPS[k];
    $('steptag').textContent = '第 ' + (k + 1) + ' 步 / 共 ' + STEPS.length + ' 步';
    $('h').textContent = cur.h;
    $('t').innerHTML = cur.t;
    $('eq').innerHTML = cur.eq;

    $('prev').disabled = k === 0;
    $('next').disabled = k === STEPS.length - 1;
    $('next').textContent = k === STEPS.length - 1 ? '已经讲完了' : '下一步 →';
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === k));
  }

  function go(k){
    k = Math.max(0, Math.min(STEPS.length - 1, k));
    if(k === S.step) return;
    S.step = k;
    token++;
    render();
    anim(k, token);
  }

  $('prev').addEventListener('click', () => go(S.step - 1));
  $('next').addEventListener('click', () => go(S.step + 1));
  STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = '第 ' + (i + 1) + ' 步';
    d.addEventListener('click', () => go(i));
    $('dots').appendChild(d);
  });

  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(S.step + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(S.step - 1); }
  });

  buildFolk();
  buildLines();
  buildCells();
  buildMLab();
  S.step = 0;
  render();
  anim(0, ++token);
})();
</script>
</body>
</html>
