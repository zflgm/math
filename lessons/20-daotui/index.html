<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第 20 课 · 还原问题（倒推）</title>
<style>
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;
  --d-dk:#b91c1c;
  --b:#f59e0b;
  --b-lt:#fde9c4;
  --s:#94a3b8;
  --ok:#0d9488;
  --ok-lt:#ccfbf1;
  --bg:#f6f7f9;
  --card:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  padding:18px 26px 32px;
}
.wrap{max-width:1400px;margin:0 auto}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

header{margin-bottom:14px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;
  margin-bottom:11px;
}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
h1 .q-mark{color:var(--d)}
.q{margin-top:10px;font-size:20px;line-height:1.7;color:#334155;font-weight:500}
.q b{color:var(--a);font-weight:800}
.q em{font-style:normal;color:var(--d);font-weight:800}

/* ---------- 版本切换 ---------- */
.tabs{display:flex;gap:10px;margin:18px 0 16px;flex-wrap:wrap}
.tabs button{
  appearance:none;font-family:inherit;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--muted);
  font-size:16px;font-weight:800;padding:12px 22px;border-radius:12px;
  transition:.16s;display:flex;flex-direction:column;gap:3px;align-items:flex-start;
}
.tabs button small{font-size:12px;font-weight:700;color:#a3aebf;letter-spacing:.02em}
.tabs button:hover{border-color:#cbd5e1;background:#fbfcfe}
.tabs button.on{
  background:var(--a);border-color:var(--a);color:#fff;
  box-shadow:0 8px 20px -10px rgba(37,99,235,.75);
}
.tabs button.on small{color:#c7d9fb}

.main{
  display:grid;
  grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);
  gap:20px;
  align-items:stretch;
}
@media (max-width:1040px){ .main{grid-template-columns:1fr} }

.stage-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
  display:grid;
  grid-template-columns:minmax(0,1fr);
  align-items:center;
}
/* min-width:0 必须写 —— 否则 svg 的固有宽度(viewBox 920) 会撑破容器 */
svg{display:block;width:100%;min-width:0;height:auto;overflow:visible}

.side{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
  min-height:380px;
  display:flex;flex-direction:column;
}
.steptag{
  font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.side h2{margin-top:10px;font-size:23px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.side p{margin-top:12px;font-size:17px;line-height:1.85;color:#3f4b5f}
.side p b{color:var(--a);font-weight:800}
.side p em{font-style:normal;color:var(--d);font-weight:800}
.side p i{font-style:normal;color:var(--ok);font-weight:800}
.eqbox{margin-top:auto;padding-top:18px}
.eq{
  background:#f8fafc;
  border:1px solid #eef1f6;
  border-left:4px solid var(--a);
  border-radius:10px;
  padding:14px 16px;
  font-size:20px;font-weight:800;
  line-height:1.85;
  font-variant-numeric:tabular-nums;
  color:#0f172a;
  white-space:pre-line;
}
.eq .hl{color:var(--d)}
.eq .ok{color:var(--ok)}

.controls{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:16px;font-weight:800;
  padding:11px 20px;border-radius:11px;cursor:pointer;
  transition:all .16s ease;font-family:inherit;
}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{
  background:var(--a);border-color:var(--a);color:#fff;
  box-shadow:0 6px 16px -8px rgba(37,99,235,.7);
}
.btn.primary:hover:not(:disabled){background:var(--a-dk);border-color:var(--a-dk)}
.dots{display:flex;gap:7px;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%;background:#d7dce5;cursor:pointer;transition:all .2s ease}
.dot:hover{background:#b6bfcd}
.dot.on{background:var(--a);width:24px;border-radius:5px}
.spacer{flex:1}
.kbd{font-size:13px;color:#94a3b8;font-weight:600}
.kbd b{
  display:inline-block;background:#fff;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 6px;
  font-family:inherit;color:#64748b;margin:0 2px;
}

.try{
  margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px 20px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.try .lab{font-size:15px;font-weight:800;color:var(--muted)}
.try .unit{font-size:15px;font-weight:700;color:#5b6779;line-height:1.6}
.try .unit b{color:var(--a)}

/* ---------- 动画 ---------- */
svg rect, svg text, svg g, svg path, svg line{
  transition: width .6s cubic-bezier(.5,0,.2,1),
              height .6s cubic-bezier(.5,0,.2,1),
              x .6s cubic-bezier(.5,0,.2,1),
              y .6s cubic-bezier(.5,0,.2,1),
              opacity .4s ease,
              fill .32s ease,
              stroke .32s ease,
              stroke-width .32s ease;
}
.hide{opacity:0}

/* 四年级米袋 */
.bag-lbl{font-size:16px;font-weight:800;fill:#64748b;letter-spacing:.02em}
.bag-val{font-size:24px;font-weight:800;fill:#a8b2c2;font-variant-numeric:tabular-nums}
.bag-val.on{fill:#1d4ed8}
.bag-val.done{fill:#0d9488}
.halfmark{stroke:#ef4444;stroke-width:2;stroke-dasharray:7 5;stroke-linecap:round}
.halfmark-txt{font-size:16px;font-weight:800;fill:#ef4444}

/* 箭头 */
.arw{stroke:#94a3b8;stroke-width:2.5;fill:none;stroke-linecap:round}
.arw.on{stroke:#2563eb}
.arw.back{stroke:#e5a3a3}
.arw.back.on{stroke:#ef4444}
.arw-lbl{font-size:15px;font-weight:800;fill:#64748b}
.arw-lbl.on{fill:#2563eb}
.arw-lbl.back{fill:#c99494}
.arw-lbl.back.on{fill:#ef4444}

/* 六年级条块 */
.seg{transition:fill .4s ease, opacity .4s ease;stroke:#fff;stroke-width:3}
.seg-txt{font-size:25px;font-weight:800;fill:#fff;font-variant-numeric:tabular-nums}
.seg-sub{font-size:15px;font-weight:800;fill:#ffffff;opacity:.9}
.brace{fill:none;stroke:#cbd5e1;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.brace.on{stroke:#0d9488}
.brace-txt{font-size:17px;font-weight:800;fill:#a3aebf}
.brace-txt.on{fill:#0d9488}
.divline{stroke:#fff;stroke-width:3;stroke-linecap:round}
.foot-txt{font-size:20px;font-weight:800;fill:#475569}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="../../index.html">← 全部课程</a>
    <span class="pos">第 20 课 · 还原问题</span>
    <span class="sp"></span>
    <a href="../19-woshou/index.html">← 上一课</a>
    <a href="../../index.html">回到目录 →</a>
  </div>

  <header>
    <div class="kicker">小学数学 · 经典模型 20</div>
    <h1>还原问题：<span class="q-mark">从结果倒着走回去</span></h1>
    <p class="q">一袋大米，第一次拿走<em>一半</em>，第二次拿走<em>剩下的一半多 10 千克</em>，最后还剩 <em>20 千克</em>。原来有多少千克？</p>
  </header>

  <div class="tabs">
    <button class="tab on" data-v="p4">
      四年级 · 倒推法
      <small>正着走不动，就倒着走</small>
    </button>
    <button class="tab" data-v="p6">
      六年级 · 份数法
      <small>先看整袋能切成几份</small>
    </button>
  </div>

  <div class="main">

    <section class="stage-card">
      <!-- ============ 四年级：倒推 ============ -->
      <svg id="s4" viewBox="0 0 920 380" preserveAspectRatio="xMidYMid meet"></svg>
      <!-- ============ 六年级：份数 ============ -->
      <svg id="s6" viewBox="0 0 920 380" preserveAspectRatio="xMidYMid meet" class="hide"></svg>
    </section>

    <aside class="side">
      <div class="steptag" id="steptag"></div>
      <h2 id="t"></h2>
      <p id="h"></p>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </aside>

  </div>

  <div class="controls">
    <button class="btn" id="prev">← 上一步</button>
    <button class="btn primary" id="next">下一步 →</button>
    <div class="dots" id="dots"></div>
    <div class="spacer"></div>
    <div class="kbd">键盘 <b>←</b> <b>→</b> 翻页</div>
  </div>

  <div class="try">
    <span class="lab">看出来了吗</span>
    <span class="unit">两种办法算出来都是 <b>120 千克</b> —— 四年级不讲分数，只倒着算；六年级不急着算，先数整袋被切成了几份。同一道题，两条路。</span>
  </div>

</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (t, a) => {
    const e = document.createElementNS(NS, t);
    if(a) for(const k in a) e.setAttribute(k, a[k]);
    return e;
  };

  /* =========================================================
     四年级：三个米袋 + 反向箭头
     ========================================================= */
  const CX = [155, 460, 765];          /* 三个袋子的中心 x */
  const TOPY = 56, BOTY = 246;         /* 袋口、袋底 */
  const HMAX = 190;                    /* = 桶内高，所以 120 千克正好装满、60 千克正好一半 */
  const K2H = kg => kg / 120 * HMAX;

  const s4 = $('s4');

  /* 米色渐变 */
  const defs4 = mk('defs');
  const lgR = mk('linearGradient', {id:'riceg', x1:0, y1:0, x2:0, y2:1});
  lgR.appendChild(mk('stop', {offset:'0', 'stop-color':'#fadf9b'}));
  lgR.appendChild(mk('stop', {offset:'1', 'stop-color':'#e4af3f'}));
  defs4.appendChild(lgR);
  s4.appendChild(defs4);

  /* 直筒：上下等宽。梯形会让「高度一半」不等于「体积一半」，讲分数时误导 */
  const BAGW = 85;
  const bagPath = cx =>
    'M ' + (cx-BAGW) + ' ' + TOPY +
    ' L ' + (cx-BAGW) + ' ' + (BOTY-7) +
    ' Q ' + (cx-BAGW) + ' ' + BOTY + ' ' + (cx-BAGW+7) + ' ' + BOTY +
    ' L ' + (cx+BAGW-7) + ' ' + BOTY +
    ' Q ' + (cx+BAGW) + ' ' + BOTY + ' ' + (cx+BAGW) + ' ' + (BOTY-7) +
    ' L ' + (cx+BAGW) + ' ' + TOPY + ' Z';

  const g4 = { body:[], rice:[], ghost:[], mouth:[], lbl:[], val:[], fw:[], bw:[], half:[], foot:null };

  CX.forEach((cx, i) => {
    const cp = mk('clipPath', {id:'bagc' + i});
    cp.appendChild(mk('path', {d:bagPath(cx)}));
    defs4.appendChild(cp);

    const body = mk('path', {
      d:bagPath(cx), fill:'#fbfcfe', stroke:'#cbd5e1', 'stroke-width':2.5, 'stroke-linejoin':'round'
    });
    s4.appendChild(body);
    g4.body.push(body);

    /* 虚影米：题目说的那个量，浅灰，表示「有这么多但不知道数字」*/
    const gh = mk('rect', {
      x:cx-87, y:BOTY, width:174, height:0, fill:'#e4eaf3', 'clip-path':'url(#bagc' + i + ')'
    });
    s4.appendChild(gh);
    g4.ghost.push(gh);

    /* 实心米 */
    const rc = mk('rect', {
      x:cx-87, y:BOTY, width:174, height:0, fill:'url(#riceg)', 'clip-path':'url(#bagc' + i + ')'
    });
    s4.appendChild(rc);
    g4.rice.push(rc);

    /* 袋口 */
    const mo = mk('ellipse', {cx:cx, cy:TOPY, rx:85, ry:9, fill:'#eef2f8', stroke:'#cbd5e1', 'stroke-width':2.5});
    s4.appendChild(mo);
    g4.mouth.push(mo);

    const lb = mk('text', {x:cx, y:40, 'text-anchor':'middle', class:'bag-lbl'});
    s4.appendChild(lb);
    g4.lbl.push(lb);

    const vl = mk('text', {x:cx, y:276, 'text-anchor':'middle', class:'bag-val'});
    s4.appendChild(vl);
    g4.val.push(vl);
  });

  /* 袋 2 内部那条「这一半 = 30」的虚线 */
  const HM_Y = BOTY - K2H(30);
  CX.forEach((cx, i) => {
    const g = mk('g', {opacity:0});
    g.appendChild(mk('line', {x1:cx-86, y1:HM_Y, x2:cx+86, y2:HM_Y, class:'halfmark'}));
    const t = mk('text', {x:cx+52, y:HM_Y-9, 'text-anchor':'middle', class:'halfmark-txt'});
    g.appendChild(t);
    s4.appendChild(g);
    g4.half.push(g);
  });

  /* 正向箭头（上排，向右）*/
  ['拿走一半', '再拿走一半多 10'].forEach((lab, i) => {
    const g = mk('g');
    const y = 110;
    const x1 = [250, 555][i], x2 = [365, 670][i];
    g.appendChild(mk('line', {x1:x1, y1:y, x2:x2, y2:y, class:'arw'}));
    g.appendChild(mk('path', {d:'M ' + (x2+8) + ' ' + y + ' L ' + (x2-2) + ' ' + (y-7) + ' M ' + (x2+8) + ' ' + y + ' L ' + (x2-2) + ' ' + (y+7), class:'arw'}));
    const t = mk('text', {x:(x1+x2)/2, y:y-14, 'text-anchor':'middle', class:'arw-lbl'});
    t.textContent = lab;
    g.appendChild(t);
    s4.appendChild(g);
    g4.fw.push(g);
  });

  /* 反向箭头（下排，向左）—— 倒推，所以方向反的 */
  ['×2', '+10'].forEach((lab, i) => {
    const g = mk('g');
    const y = 196;
    const x1 = [365, 670][i], x2 = [250, 555][i];
    g.appendChild(mk('line', {x1:x1, y1:y, x2:x2, y2:y, class:'arw back'}));
    g.appendChild(mk('path', {d:'M ' + (x2-8) + ' ' + y + ' L ' + (x2+2) + ' ' + (y-7) + ' M ' + (x2-8) + ' ' + y + ' L ' + (x2+2) + ' ' + (y+7), class:'arw back'}));
    const t = mk('text', {x:(x1+x2)/2, y:y+30, 'text-anchor':'middle', class:'arw-lbl back'});
    t.textContent = lab;
    g.appendChild(t);
    s4.appendChild(g);
    g4.bw.push(g);
  });

  /* 袋 2 内部：从「一半」涨到「整袋」的竖向箭头 */
  const v2 = mk('g', {opacity:0});
  v2.appendChild(mk('line', {x1:460, y1:200, x2:460, y2:158, stroke:'#ef4444', 'stroke-width':3, 'stroke-linecap':'round'}));
  v2.appendChild(mk('path', {d:'M 460 150 L 453 163 M 460 150 L 467 163', stroke:'#ef4444', 'stroke-width':3, fill:'none', 'stroke-linecap':'round'}));
  const v2t = mk('text', {x:472, y:186, class:'arw-lbl back on'});
  v2t.textContent = '×2';
  v2.appendChild(v2t);
  s4.appendChild(v2);
  g4.v2 = v2;

  const f4 = mk('text', {x:460, y:340, 'text-anchor':'middle', class:'foot-txt'});
  s4.appendChild(f4);
  g4.foot = f4;

  /* 虚影米固定高度：120 / 60 / 20 千克 */
  const GHOST = [120, 60, 20];

  const S4 = [
    {
      t:'正着算，卡住了',
      h:'题目给的是一路拿走的过程：先拿一半，再拿一半多 10，最后剩 20。<br><br>' +
        '三个袋子摆在这儿。要算左边那两个装了多少，得先知道中间剩了多少 —— 可中间那两步剩多少，<b>题目一个字都没说</b>。<br><br>' +
        '正着走，每一步都缺一个数。那就不正着走了。',
      eq:'原来 ?\n第一次后 ?\n最后 20',
      solid:[0,0,0], txt:['?','?','?'], st:['ghost','ghost','ghost'],
      bw:[], v2:false, half:[false,false,false],
      foot:'正向：每一步都需要一个题目没给的数'
    },
    {
      t:'倒着走：右边这个袋子是已知的',
      h:'唯一能确定的，是<b>最后剩下 20 千克</b>。这个数是真的，从这儿出发。<br><br>' +
        '倒着走有个规矩：<em>正着是什么动作，倒着就做相反的动作</em>。<br>' +
        '正着「减」，倒着「加」；正着「乘」，倒着「除」。',
      eq:'只有 20 是知道的\n从这里往回推',
      solid:[0,0,20], txt:['?','?','20'], st:['ghost','ghost','done'],
      bw:[], v2:false, half:[false,false,false],
      foot:'起点：最后剩 20 千克'
    },
    {
      t:'第一步：把多拿的 10 加回来',
      h:'第二次拿的是「剩下的一半，<b>再多 10 千克</b>」，所以最后才剩 20。<br><br>' +
        '倒回去，就要把这 10 千克<em>还回来</em>：<b>20 + 10 = 30</b>。<br><br>' +
        '这 30 是什么？看中间那个袋子 —— 它是那半袋里的<b>一半</b>。',
      eq:'20 + 10 = 30\n30 是「剩下一半」的一半',
      solid:[0,0,20], txt:['?','30','20'], st:['ghost','ghost','done'],
      bw:[1], v2:false, half:[false,true,false],
      foot:'20 加回 10 → 30'
    },
    {
      t:'第二步：这一半乘 2，就是一整袋',
      h:'中间那个袋子只剩一半（就是 30），倒回去<b>乘 2 倍</b>：<b>30 × 2 = 60</b>。<br><br>' +
        '看那个袋子怎么长高的 —— 从一半涨到齐口，那才是第二次动手之前的全部。',
      eq:'30 × 2 = 60\n第一次拿完，剩 60',
      solid:[0,60,20], txt:['?','60','20'], st:['ghost','done','done'],
      bw:[1], v2:true, half:[false,false,false],
      foot:'30 × 2 → 60'
    },
    {
      t:'第三步：再乘一次 2',
      h:'第一次拿走的是<b>整袋的一半</b>，剩的那 60 也是整袋的一半。<br><br>' +
        '所以整袋是：<b>60 × 2 = 120</b>。<br><br>' +
        '<em>看最左边那个袋子 —— 米涨到袋口，正好装满一整袋。</em>',
      eq:'60 × 2 = 120\n原来有 120 千克',
      solid:[120,60,20], txt:['120','60','20'], st:['done','done','done'],
      bw:[0,1], v2:false, half:[false,false,false],
      foot:'60 × 2 → 120　袋子满了，就是这个数'
    },
    {
      t:'回头验一遍',
      h:'倒推算出来的数，<em>必须正着走一遍</em>才能作数。<br><br>' +
        '120 拿一半 → 60；60 拿一半是 30，再多拿 10 → 40；60 − 40 = <b>20</b>。<br><br>' +
        '三个袋子正好对回去。倒推的答案，一定验算。',
      eq:'120 →拿一半→ 60\n60 →拿 30+10→ 剩 20 ✓',
      solid:[120,60,20], txt:['120','60','20'], st:['done','done','done'],
      bw:[0,1], v2:false, half:[false,false,false],
      foot:'验算：120 → 60 → 20　对上了 ✓'
    }
  ];

  let t5 = null;

  function setBag(i, kg){
    const h = K2H(kg);
    g4.rice[i].setAttribute('height', h);
    g4.rice[i].setAttribute('y', BOTY - h);
  }
  function setGhost(i, kg){
    const h = K2H(kg);
    g4.ghost[i].setAttribute('height', h);
    g4.ghost[i].setAttribute('y', BOTY - h);
  }

  function render4(i){
    const s = S4[i];
    s4.setAttribute('class', '');
    $('s6').setAttribute('class', 'hide');

    clearTimeout(t5);

    const LBLS = ['原来', '第一次后', '最后'];
    s.st.forEach((st, k) => {
      const done = st === 'done', on = st === 'on' || done;
      g4.lbl[k].textContent = LBLS[k];

      if(st === 'ghost'){
        setGhost(k, GHOST[k]);
        setBag(k, 0);
      }else{
        setGhost(k, 0);
        /* 第 5 步的袋 1 先停在一半，等下再涨满 */
        setBag(k, (i === 4 && k === 0) ? 60 : s.solid[k]);
      }

      g4.body[k].style.fill = done ? '#f0fdfa' : '#fbfcfe';
      g4.body[k].style.stroke = done ? '#5eead4' : (st === 'ghost' ? '#cbd5e1' : '#93b4f5');

      g4.val[k].textContent = s.txt[k];
      g4.val[k].setAttribute('class', 'bag-val' + (done ? ' done' : (on ? ' on' : '')));
    });

    /* 第 5 步：最左边那个袋子从一半（60）涨满（120）*/
    if(i === 4){
      t5 = setTimeout(() => setBag(0, 120), 760);
    }

    /* 「这一半 = 30」虚线 */
    s.half.forEach((on, k) => {
      const g = g4.half[k];
      g.style.opacity = on ? 1 : 0;
      if(on) g.querySelector('text').textContent = '30';
    });

    /* 反向箭头 */
    g4.bw.forEach((g, k) => {
      const on = s.bw.includes(k);
      g.style.opacity = on ? 1 : .34;
      g.querySelectorAll('line,path,text').forEach(el => {
        const base = el.getAttribute('class').replace(/\s+on\b/g, '');
        el.setAttribute('class', on ? base + ' on' : base);
      });
    });

    g4.v2.style.opacity = s.v2 ? 1 : 0;

    /* 第 6 步：正向箭头亮蓝，表示「正着再走一遍」*/
    const allBack = s.bw.length === 2;
    g4.fw.forEach(g => {
      g.style.opacity = 1;
      g.querySelectorAll('line,path,text').forEach(el => {
        const base = el.getAttribute('class').replace(/\s+on\b/g, '');
        el.setAttribute('class', allBack ? base + ' on' : base);
      });
    });

    g4.foot.textContent = s.foot;
    g4.foot.style.fill = i >= 4 ? '#0d9488' : '#475569';
  }

  /* =========================================================
     六年级：整条 → 四份
     ========================================================= */
  const s6 = $('s6');
  const X0 = 60, X1 = 860, BARW = X1 - X0;   // 800
  const BY6 = 92, BH6 = 148;

  /* 四段的边界（比例来自 60 / 30 / 10 / 20）*/
  const EDGE = [0, 0.5, 0.75, 0.83333, 1].map(p => X0 + BARW * p);
  /* 四份的边界（跟色块边界不是一个东西：最后一份跨了 10 和 20 两块）*/
  const FPX = [0, 0.25, 0.5, 0.75, 1].map(p => X0 + BARW * p);
  const SEGC = ['#94a3b8', '#64748b', '#cbd5e1', '#0d9488'];

  const g6 = { segs:[], txts:[], subs:[], divs:[], braces:[], braceTxt:[], foot:null };

  /* 顶：整袋标签 */
  const top6 = mk('text', {x:460, y:50, 'text-anchor':'middle', style:'font-size:19px;font-weight:800;fill:#475569'});
  s6.appendChild(top6);
  g6.top = top6;

  /* 四个色块 */
  for(let i = 0; i < 4; i++){
    const r = mk('rect', {
      x:EDGE[i], y:BY6, width:EDGE[i+1]-EDGE[i], height:BH6,
      fill:SEGC[i], 'class':'seg'
    });
    s6.appendChild(r);
    g6.segs.push(r);

    const t = mk('text', {
      x:(EDGE[i]+EDGE[i+1])/2, y:BY6+BH6/2 + 9, 'text-anchor':'middle', class:'seg-txt'
    });
    s6.appendChild(t);
    g6.txts.push(t);

    const st = mk('text', {
      x:(EDGE[i]+EDGE[i+1])/2, y:BY6+BH6-20, 'text-anchor':'middle', class:'seg-sub'
    });
    s6.appendChild(st);
    g6.subs.push(st);
  }

  /* 三条分隔线：永久可见，四个块才不会糊成一条 */
  for(let i = 1; i < 4; i++){
    const l = mk('line', {x1:EDGE[i], y1:BY6, x2:EDGE[i], y2:BY6+BH6, class:'divline'});
    s6.appendChild(l);
    g6.divs.push(l);
  }

  /* 下方四个括号：每份 30 */
  const braceY = BY6 + BH6 + 26;
  for(let i = 0; i < 4; i++){
    const g = mk('g');
    const x1 = FPX[i] + 4, x2 = FPX[i+1] - 4, y = braceY;
    g.appendChild(mk('path', {
      d:`M ${x1} ${y} L ${x1} ${y+10} L ${x2} ${y+10} L ${x2} ${y}`,
      class:'brace'
    }));
    const t = mk('text', {x:(x1+x2)/2, y:y+34, 'text-anchor':'middle', class:'brace-txt'});
    g.appendChild(t);
    s6.appendChild(g);
    g6.braces.push(g);
    g6.braceTxt.push(t);
  }

  /* 第一块内部 25% 处的等分线：把 60 切成 2 份 */
  const half = mk('line', {
    x1:X0 + BARW * .25, y1:BY6, x2:X0 + BARW * .25, y2:BY6 + BH6,
    class:'divline', opacity:0
  });
  s6.appendChild(half);
  g6.fine = half;

  /* 底部提示 */
  const f6 = mk('text', {x:460, y:350, 'text-anchor':'middle', class:'foot-txt'});
  s6.appendChild(f6);
  g6.foot = f6;


  const S6 = [
    {
      t:'先把整袋当成「1」',
      h:'六年级不急着算，先看<b>结构</b>。<br><br>' +
        '整袋米不知道多少千克，但它是一个<b>完整的整体</b> —— 我们把它当成一条完整的条子。<br><br>' +
        '题目里所有的「一半」，都是拿某个东西当尺子量出来的。先看清楚<b>尺子是哪一条</b>。',
      top:'整 袋 = ? 千克　（先当成整体「1」）',
      states:['off','off','off','off'],
      tags:['','','',''], subs:['','','',''],
      braces:['','','',''],
      foot:'整袋是一条完整的条子，长度还不知道',
      eq:'整袋 = 1\n（不知道具体多重）'
    },
    {
      t:'第一次：砍掉一半',
      h:'「拿走一半」，就是把整条<b>从中间切开</b>，左边那半拿走了。<br><br>' +
        '右边剩下这半，就是<b>剩下的 ½</b>。<br><br>' +
        '注意：从此以后，题目里再出现的「一半」，<em>量的都是右边这半</em>，不是整条了。',
      top:'第一次拿走 ½　→　剩下 ½',
      states:['taken','off','off','off'],
      tags:['拿走 ½','','',''], subs:['','','',''],
      braces:['','','',''],
      foot:'左边拿走，右边这半成了新的整体',
      eq:'整袋 1\n拿走 ½ → 剩 ½'
    },
    {
      t:'关键一步：尺子换人了',
      h:'第二次又说「拿走剩下的<b>一半</b>」。<br><br>' +
        '这个「一半」量的不是整袋，是<em>右边剩下的那半</em>。<br><br>' +
        '所以把右边这半再切一刀 —— 整条就被切成了<b>四份</b>，每份一样大。<br>' +
        '看下面四个括号，那就是四份。',
      top:'剩下的 ½ 再切一半　→　整条分成 4 份',
      states:['taken','grab','off','off'],
      tags:['2 份','1 份','',''], subs:['','','',''],
      braces:['1 份','1 份','1 份','1 份'],
      foot:'尺子从「整袋」换成了「剩下的 ½」—— 整条变成 4 份',
      eq:'整袋 1\n第一次拿走 2 份，剩 2 份\n其中 1 份被第二次拿走'
    },
    {
      t:'第二次：1 份，再加 10',
      h:'第二次拿走的是「剩下的一半」= <b>1 份</b>，<b>再多 10 千克</b>。<br><br>' +
        '这 10 千克从哪来？只能从最后那一份里割。<br><br>' +
        '所以最后那份被切成两块：一块 10（也被拿走了），一块才是真正剩下的。',
      top:'第二次拿走 1 份 + 10 千克',
      states:['taken','grab','extra','left'],
      tags:['2 份','1 份','10','?'], subs:['第一次拿走','第二次拿走','多拿',''],
      braces:['1 份','1 份','1 份','1 份'],
      foot:'最后一份被切掉 10 千克，剩下的那块还不知道',
      eq:'第二次拿走 = 1 份 + 10\n最后剩 = 1 份 − 10'
    },
    {
      t:'倒过来看：那一份是 30',
      h:'现在看图的最右边 —— 那一份被切成了 <b>10</b> 和 <b>20</b>。<br><br>' +
        '所以<b>一整份 = 10 + 20 = 30 千克</b>。<br><br>' +
        '这一步是整道题的关键：<em>不列方程，直接从图上读出一份是多少</em>。<br>' +
        '题目给的最后那个 20，就是用来干这个的。',
      top:'一份 = 10 + 20 = 30 千克',
      states:['taken','grab','extra','left'],
      tags:['2 份','1 份','10','20'], subs:['第一次拿走','第二次拿走','多拿','剩下'],
      braces:['30','30','30','30'],
      foot:'一份就是 30 千克',
      eq:'1 份 = 10 + 20 = 30'
    },
    {
      t:'四份加起来',
      h:'整袋是 <b>4 份</b>，每份 30 千克：<br><br>' +
        '<b>30 × 4 = 120 千克</b><br><br>' +
        '跟四年级倒推算出来的<b>一模一样</b>。<br><br>' +
        '区别是：四年级一路倒着减、倒着乘；六年级先看清<b>整袋被切成几份</b>，一份一份算。',
      top:'整袋 = 4 份 × 30 = 120 千克',
      states:['taken','grab','extra','left'],
      tags:['60','30','10','20'], subs:['第一次拿走','第二次拿走','多拿','剩下'],
      braces:['30','30','30','30'],
      foot:'30 × 4 = 120　两种办法答案一致 ✓',
      eq:'30 × 4 = 120\n原来有 120 千克'
    }
  ];

  const FILL = { off:'#dbe3ee', taken:'#94a3b8', grab:'#64748b', extra:'#cbd5e1', left:'#0d9488' };

  function render6(i){
    const s = S6[i];
    $('s4').setAttribute('class', 'hide');
    s6.setAttribute('class', '');

    g6.top.textContent = s.top;

    g6.segs.forEach((r, k) => r.setAttribute('fill', FILL[s.states[k]]));

    g6.txts.forEach((t, k) => {
      t.textContent = s.tags[k] || '';
      t.style.fill = s.tags[k] ? '#fff' : 'transparent';
    });

    g6.subs.forEach((t, k) => t.textContent = s.subs[k] || '');

    /* 第 3 步起「四份」出现，把第一块里的 60 也切成两份 */
    g6.fine.style.opacity = i >= 2 ? 1 : 0;

    g6.braceTxt.forEach((t, k) => t.textContent = s.braces[k] || '');
    g6.braces.forEach((g, k) => {
      g.style.opacity = s.braces[k] ? 1 : 0;
      g.querySelector('path').setAttribute('class', 'brace' + (s.braces[k] ? ' on' : ''));
      g.querySelector('text').setAttribute('class', 'brace-txt' + (s.braces[k] ? ' on' : ''));
    });

    g6.foot.textContent = s.foot;
    g6.foot.style.fill = i === 5 ? '#0d9488' : '#475569';
  }


  /* =========================================================
     控制
     ========================================================= */
  const VER = {
    p4:{ steps:S4, render:render4, idx:0 },
    p6:{ steps:S6, render:render6, idx:0 }
  };
  let cur = 'p4';

  function draw(){
    const v = VER[cur];
    const steps = v.steps;
    const i = Math.min(v.idx, steps.length - 1);
    const s = steps[i];

    v.render(i);

    $('steptag').textContent = `第 ${i+1} 步 / 共 ${steps.length} 步　·　${
      cur === 'p4' ? '四年级 · 倒推法' : '六年级 · 份数法'}`;
    $('t').textContent = s.t;
    $('h').innerHTML = s.h;
    $('eq').innerHTML = s.eq.replace(/✓/g, '<span class="ok">✓</span>');

    $('prev').disabled = i === 0;
    $('next').disabled = i === steps.length - 1;

    const box = $('dots');
    if(box.children.length !== steps.length){
      box.innerHTML = '';
      steps.forEach((_, k) => {
        const d = document.createElement('span');
        d.className = 'dot';
        d.addEventListener('click', () => { VER[cur].idx = k; draw(); });
        box.appendChild(d);
      });
    }
    [...box.children].forEach((d, k) => d.classList.toggle('on', k === i));
  }

  $('prev').addEventListener('click', () => { VER[cur].idx = Math.max(0, VER[cur].idx - 1); draw(); });
  $('next').addEventListener('click', () => {
    VER[cur].idx = Math.min(VER[cur].steps.length - 1, VER[cur].idx + 1); draw();
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'ArrowRight') $('next').click();
    if(e.key === 'ArrowLeft')  $('prev').click();
  });

  document.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      cur = b.dataset.v;
      draw();
    });
  });

  draw();
})();
</script>
</body>
</html>
