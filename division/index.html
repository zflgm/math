<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>除法竖式 · 一步一步写</title>
<style>
:root{
  --ink:#0f172a;--muted:#64748b;--line:#e7eaf0;
  --a:#2563eb;--a-dk:#1d4ed8;--a-lt:#dbeafe;
  --d:#ef4444;--b:#f59e0b;--b-lt:#fde9c4;
  --ok:#0d9488;--ok-lt:#ccfbf1;--bg:#f6f7f9;--card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  padding:18px 26px 32px;
}
.wrap{max-width:1400px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar a{
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;transition:.16s;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}

header{margin-bottom:14px}
.kicker{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--a);background:#e8efff;padding:5px 12px;border-radius:999px;margin-bottom:11px}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.24}
.sub{margin-top:9px;font-size:17px;line-height:1.8;color:#5b6779;max-width:820px}
.sub b{color:var(--a);font-weight:800}

/* ---------- 输入区 ---------- */
.try{
  margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.try .lab{font-size:14px;font-weight:800;color:var(--muted)}
.try input{
  width:118px;font-family:inherit;font-size:19px;font-weight:800;
  padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  color:var(--ink);background:#fbfcfe;font-variant-numeric:tabular-nums;
}
.try input:focus{outline:none;border-color:var(--a);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.try .divsign{font-size:22px;font-weight:800;color:#94a3b8}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
  font-size:15px;font-weight:800;padding:10px 18px;border-radius:11px;
  cursor:pointer;transition:all .16s ease;font-family:inherit;
}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--a);border-color:var(--a);color:#fff;box-shadow:0 6px 16px -8px rgba(37,99,235,.7)}
.btn.primary:hover:not(:disabled){background:var(--a-dk);border-color:var(--a-dk)}
.modebtn{border:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px;font-weight:800;padding:8px 13px;border-radius:9px;cursor:pointer;font-family:inherit;transition:.16s}
.modebtn.on{background:#e8efff;border-color:#b9cdfb;color:var(--a-dk)}
.warn{font-size:14px;font-weight:700;color:var(--d)}

/* ---------- 题型 ---------- */
.types{margin-top:12px;display:flex;flex-direction:column;gap:9px}
.trow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.trow .gl{font-size:12px;font-weight:800;color:#9aa6b8;width:64px;flex:none;letter-spacing:.04em}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:10px;
  padding:8px 13px;font-size:14px;font-weight:800;color:#475569;
  cursor:pointer;font-family:inherit;transition:.16s;font-variant-numeric:tabular-nums;
}
.chip:hover{border-color:#c7d3e6;color:var(--a);background:#fbfcfe}
.chip .g{font-size:12px;font-weight:700;color:#a7b2c3;margin-left:6px}

/* ---------- 主区 ---------- */
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(360px,.9fr);gap:20px;margin-top:16px;align-items:start}
@media (max-width:1040px){.main{grid-template-columns:1fr}}
.stage-card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:10px 14px 8px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
  overflow-x:auto;
}
.stage{position:relative;min-width:100%;min-height:360px}
/* 竖式里的数字 */
.d{
  position:absolute;text-align:center;font-size:34px;font-weight:800;
  line-height:44px;height:44px;width:46px;font-variant-numeric:tabular-nums;
  color:var(--ink);opacity:0;transform:translateY(-6px);
  transition:opacity .3s ease,transform .3s ease,color .2s ease;
}
.d.on{opacity:1;transform:none}
.d.prod{color:var(--a)}
.d.diff{color:#b45309}
.d.bring{color:var(--ok)}
.d.q{color:var(--ink)}
.d.dg{color:var(--ink)}
.d.divisor{width:auto;text-align:right;color:var(--ink);opacity:1;transform:none;position:absolute}
.d.hl{background:#fef3c7;border-radius:9px;box-shadow:0 0 0 2px #fde68a inset}
.d.dotcell{width:18px}
/* 括号线 */
.bracket{position:absolute;background:#0f172a}
.bracket.v{width:3px;border-radius:2px}
.bracket.h{height:3px;border-radius:2px}
.uline{position:absolute;height:2.5px;background:#cbd5e1;border-radius:2px;opacity:0;transition:opacity .3s ease}
.uline.on{opacity:1}

/* ---------- 右侧讲解 ---------- */
.side{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:20px 22px 18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
  min-height:420px;display:flex;flex-direction:column;
}
.steptag{font-size:13px;font-weight:800;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums}
.side h2{margin-top:10px;font-size:23px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.side p{margin-top:11px;font-size:16.5px;line-height:1.85;color:#3f4b5f}
.side p b{color:var(--a);font-weight:800}
.side p em{font-style:normal;color:#b45309;font-weight:800}
.eqbox{margin-top:auto;padding-top:16px}
.eq{
  background:#f8fafc;border:1px solid #eef1f6;border-left:4px solid var(--a);
  border-radius:10px;padding:13px 15px;font-size:19px;font-weight:800;
  line-height:1.7;font-variant-numeric:tabular-nums;color:#0f172a;white-space:pre-line;
}
.eq.ok{border-left-color:var(--ok);background:#f6fdfb}
/* 试商小表 */
.ladder{margin-top:14px;border-top:1px dashed #e2e8f0;padding-top:12px}
.ladder .cap{font-size:13px;font-weight:800;color:#94a3b8;margin-bottom:8px;letter-spacing:.04em}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lcell{
  font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;
  border:1px solid #eef1f6;border-radius:8px;padding:7px 8px;color:#64748b;background:#fbfcfe;
  text-align:center;transition:.18s;
}
.lcell small{display:block;font-size:11px;font-weight:700;color:#a7b2c3;margin-top:2px}
.lcell.hit{border-color:var(--ok);background:var(--ok-lt);color:#0f766e}
.lcell.hit small{color:#0f766e}
.lcell.big{color:#cbd5e1}

/* ---------- 控制条 ---------- */
.controls{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.progress{flex:1;min-width:120px;height:6px;background:#eef1f6;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--a);border-radius:99px;transition:width .25s ease}
.kbd{font-size:12.5px;color:#94a3b8;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a href="../index.html">← 全部课程</a>
    <div class="pos" style="margin-left:auto">小学数学 · 除法竖式</div>
  </div>

  <header>
    <span class="kicker">1–6 年级 · 除法竖式</span>
    <h1>除法竖式，一步一步写</h1>
    <p class="sub">
      输入被除数和除数，竖式会自己长出来 —— <b>试商、乘、减、落</b>，
      每一步都停下来说清楚为什么。适合二年级的表内除法，也适合五年级的小数除法。
    </p>
  </header>

  <div class="try">
    <span class="lab">被除数</span>
    <input id="inA" type="text" inputmode="decimal" value="156" autocomplete="off">
    <span class="divsign">÷</span>
    <span class="lab">除数</span>
    <input id="inB" type="text" inputmode="decimal" value="12" autocomplete="off">
    <button class="btn primary" id="goBtn">列竖式</button>
    <button class="modebtn on" id="mRem">有余数</button>
    <button class="modebtn" id="mDec">除到小数</button>
    <span class="warn" id="warn"></span>
  </div>

  <div class="types">
    <div class="trow">
      <span class="gl">二年级</span>
      <button class="chip" data-a="36" data-b="4" data-m="rem">36 ÷ 4<span class="g">表内除法</span></button>
      <button class="chip" data-a="37" data-b="4" data-m="rem">37 ÷ 4<span class="g">有余数</span></button>
    </div>
    <div class="trow">
      <span class="gl">三年级</span>
      <button class="chip" data-a="432" data-b="3" data-m="rem">432 ÷ 3<span class="g">三位数÷一位数</span></button>
      <button class="chip" data-a="612" data-b="6" data-m="rem">612 ÷ 6<span class="g">商中间有 0</span></button>
      <button class="chip" data-a="420" data-b="3" data-m="rem">420 ÷ 3<span class="g">商末尾有 0</span></button>
    </div>
    <div class="trow">
      <span class="gl">四年级</span>
      <button class="chip" data-a="156" data-b="12" data-m="rem">156 ÷ 12<span class="g">两位数除法</span></button>
      <button class="chip" data-a="196" data-b="39" data-m="rem">196 ÷ 39<span class="g">试商要调</span></button>
    </div>
    <div class="trow">
      <span class="gl">五年级</span>
      <button class="chip" data-a="12.6" data-b="3" data-m="dec">12.6 ÷ 3<span class="g">小数÷整数</span></button>
      <button class="chip" data-a="5" data-b="4" data-m="dec">5 ÷ 4<span class="g">添 0 继续除</span></button>
      <button class="chip" data-a="7.2" data-b="0.9" data-m="dec">7.2 ÷ 0.9<span class="g">小数÷小数</span></button>
    </div>
  </div>

  <div class="main">
    <div class="stage-card">
      <div class="stage" id="stage"></div>

      <div class="controls">
        <button class="btn" id="prevBtn">上一步</button>
        <button class="btn primary" id="nextBtn">下一步</button>
        <button class="btn" id="playBtn">播放</button>
        <button class="btn" id="resetBtn">重来</button>
        <div class="progress"><i id="bar"></i></div>
        <span class="kbd">← → 翻页</span>
      </div>
    </div>

    <div class="side">
      <div class="steptag" id="tag">第 1 步</div>
      <h2 id="title">准备开始</h2>
      <p id="body">在左边输入两个数，点「列竖式」。</p>
      <div class="ladder" id="ladderBox" style="display:none">
        <div class="cap" id="ladderCap">试商：把除数看作整十数</div>
        <div class="lgrid" id="ladder"></div>
      </div>
      <div class="eqbox"><div class="eq" id="eq"></div></div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var W = 46, DOTW = 18, H = 56, TOP = 8;

  /* ============ 数字解析 ============ */
  function parseNum(str){
    str = String(str).trim();
    if(!/^\d+(\.\d+)?$/.test(str)) return null;
    var parts = str.split('.'), ip = parts[0], fp = parts.length > 1 ? parts[1] : '';
    ip = ip.replace(/^0+(?=\d)/, '');
    var digits = ip + fp, pointPos = ip.length;
    if(/^0+$/.test(digits)) return {digits:'0', pointPos:1};
    while(pointPos > 0 && digits.charAt(0) === '0'){ digits = digits.slice(1); pointPos--; }
    return {digits:digits, pointPos:pointPos};
  }
  function shiftRight(num, k){
    var digits = num.digits, pointPos = num.pointPos + k;
    while(digits.length < pointPos) digits += '0';
    return {digits:digits, pointPos:pointPos};
  }
  function roundDivisor(d){
    if(d < 10) return d;
    var p = Math.pow(10, String(d).length - 1);
    return Math.round(d / p) * p;
  }

  /* ============ 生成竖式步骤 ============ */
  function buildPlan(aStr, bStr, mode){
    var A = parseNum(aStr), B = parseNum(bStr);
    if(!A || !B) return {error:'只能输入正整数或有限小数'};
    if(B.digits === '0') return {error:'除数不能是 0'};

    var k = B.digits.length - B.pointPos;          // 除数的小数位数
    var divNum = k > 0 ? shiftRight(B, k) : B;     // 除数 → 整数
    var div = Number(divNum.digits);
    var num = k > 0 ? shiftRight(A, k) : A;        // 被除数同步移动
    var D = num.digits.split('');
    var pointPos = num.pointPos;
    var origLen = D.length;
    var maxDecimals = mode === 'decimal' ? 3 : 0;

    var steps = [];
    var qs = [];
    var i = 0, cur = 0, started = false, guard = 0;

    while(guard++ < 2000){
      if(i >= D.length){
        if(cur === 0) break;
        if(mode === 'decimal' && (D.length - pointPos) < maxDecimals){ D.push('0'); }
        else break;
      }
      cur = cur * 10 + Number(D[i]);
      var q = Math.floor(cur / div);
      if(!started && q === 0){ i++; continue; }
      started = true;
      var prod = q * div, diff = cur - prod;

      if(q === 0){
        steps.push({kind:'zero', slot:i, cur:cur, q:0, d:div, prod:0, diff:cur,
                    next: (i + 1 < D.length) ? Number(D[i+1]) : null});
      }else{
        steps.push({kind:'trial', slot:i, cur:cur, q:q, d:div, prod:prod, diff:diff,
                    next: (i + 1 < D.length) ? Number(D[i+1]) : null});
        steps.push({kind:'mul', slot:i, cur:cur, q:q, d:div, prod:prod, diff:diff});
        steps.push({kind:'sub', slot:i, cur:cur, q:q, d:div, prod:prod, diff:diff});
      }
      steps.push({kind:'bring', slot:i, cur:cur, q:q, d:div, prod:prod, diff:diff,
                  next: (i + 1 < D.length) ? Number(D[i+1]) : null});

      qs.push({slot:i, q:q});
      cur = diff;
      i++;
      if(i >= D.length && cur === 0) break;
      if(i >= D.length && mode !== 'decimal') break;
    }

    var remainder = cur;

    /* 补全：后面添的 0 也算「下一位」 */
    for(var bi = 0; bi < steps.length; bi++){
      var bs = steps[bi];
      if(bs.kind === 'bring' && (bs.next === null || bs.next === undefined) && bs.slot + 1 < D.length){
        bs.next = Number(D[bs.slot + 1]);
      }
    }

    /* 结果：按「位」拼，整数位 / 小数位分开 */
    var intPart = '', fracPart = '';
    qs.forEach(function(o){ if(o.slot < pointPos) intPart += String(o.q); else fracPart += String(o.q); });
    var qStr = (intPart === '' ? '0' : intPart) + (fracPart ? '.' + fracPart : '');
    if(!qs.length) qStr = '0';

    var doneText, doneEq;
    var aShow = String(aStr).trim(), bShow = String(bStr).trim();
    if(mode === 'remainder'){
      doneText = remainder === 0
        ? '除尽了，没有余数。'
        : '剩下的 ' + remainder + ' 比除数 ' + div + ' 小，不能再除了，它就是余数。';
      doneEq = aShow + ' ÷ ' + bShow + ' = ' + qStr + (remainder ? ' 余 ' + remainder : '');
    }else{
      doneText = remainder === 0
        ? '除尽了，商就是 ' + qStr + '。'
        : '还有余数 ' + remainder + '，除不尽，只保留 3 位小数。';
      doneEq = aShow + ' ÷ ' + bShow + ' = ' + (remainder ? '≈ ' : '') + qStr;
    }

    var plan = {
      A: A, B: B, k: k, D: D, pointPos: pointPos, div: div, origLen: origLen,
      dividend: num.digits, steps: steps, qs: qs, qStr: qStr,
      remainder: remainder, mode: mode, doneText: doneText, doneEq: doneEq
    };

    /* 开头两步：小数点搬家 / 从哪一位开始 */
    var head = [];
    if(k > 0){
      var aRaw = String(aStr).trim(), bRaw = String(bStr).trim();
      head.push({
        kind:'normalize',
        title:'先把除数的小数点移走',
        body:'除数是小数不能直接除。把除数和被除数的小数点<b>同时向右移动 ' + k + ' 位</b>，商不变：' +
             aRaw + ' ÷ ' + bRaw + ' → ' + num.digits + ' ÷ ' + div + '。',
        eq: aRaw + ' ÷ ' + bRaw + ' = ' + num.digits + ' ÷ ' + div
      });
    }
    if(steps.length){
      var first = steps[0];
      var m = first.slot + 1;
      head.push({
        kind:'start',
        m: m,
        title:'从最高位开始',
        body: m === 1
          ? '看被除数的第一位 <b>' + D[0] + '</b>，它够 ' + div + ' 除，就从这一位开始。'
          : '最高位 ' + D[0] + ' 不够 ' + div + ' 除，要和后面几位合起来看 —— 先取前 ' + m + ' 位：<b>' +
            D.slice(0, m).join('') + '</b>。',
        eq: '先看 ' + D.slice(0, m).join('') + ' 里有几个 ' + div
      });
    }else{
      head.push({
        kind:'start',
        m: D.length,
        title:'一位也不够除',
        body:'被除数 <b>' + D.join('') + '</b> 比除数 <b>' + div + '</b> 小，一位也不够除，所以<b>商是 0</b>，被除数整个就是余数。',
        eq: D.join('') + ' < ' + div + '  →  商 0'
      });
    }

    plan.steps = head.concat(steps);
    plan.headCount = head.length;

    /* 结论步 */
    plan.steps.push({
      kind:'done',
      title:'写答案',
      body: plan.doneText,
      eq: plan.doneEq
    });
    return plan;
  }

  /* ============ 渲染竖式 ============ */
  function render(plan){
    var stage = document.getElementById('stage');
    stage.innerHTML = '';

    var D = plan.D, n = D.length, pointPos = plan.pointPos;
    var digitX = [], x = 0;
    for(var k = 0; k < n; k++){
      if(k === pointPos) x += DOTW;
      digitX[k] = x; x += W;
    }
    var contentW = x;

    var divTxt = String(plan.div);
    var divW = divTxt.length * 28 + 10;
    var padL = divW + 30;
    var startX = padL + 18;

    var rowY = function(r){ return TOP + H + r * H; };
    var row = 0;              // 0 = 被除数行
    var curRow = 0;           // 当前工作数所在的行
    var rowCells = {};        // 行号 → {slot: element}
    var maxStep = plan.steps.length - 1;

    function cell(txt, slot, y, cls, stepIdx){
      var el = document.createElement('span');
      el.className = 'd ' + cls;
      el.textContent = txt;
      el.style.left = (startX + digitX[slot]) + 'px';
      el.style.top = y + 'px';
      if(stepIdx !== undefined) el.setAttribute('data-step', stepIdx);
      stage.appendChild(el);
      return el;
    }
    function putCell(r, slot, txt, cls, stepIdx){
      var el = cell(txt, slot, rowY(r), cls, stepIdx);
      if(!rowCells[r]) rowCells[r] = {};
      rowCells[r][slot] = el;
      return el;
    }
    function underline(r, fromSlot, toSlot, stepIdx){
      var u = document.createElement('div');
      u.className = 'uline';
      u.setAttribute('data-step', stepIdx);
      u.style.left = (startX + digitX[fromSlot] - 3) + 'px';
      u.style.top = (rowY(r) + 44) + 'px';
      u.style.width = ((toSlot - fromSlot + 1) * W + 6) + 'px';
      stage.appendChild(u);
    }

    /* 除数 */
    var dsp = document.createElement('span');
    dsp.className = 'd divisor';
    dsp.textContent = divTxt;
    dsp.style.left = (padL - 16 - divW) + 'px';
    dsp.style.top = rowY(0) + 'px';
    dsp.style.width = divW + 'px';
    stage.appendChild(dsp);

    /* 括号 */
    var v = document.createElement('div');
    v.className = 'bracket v';
    v.style.left = padL + 'px';
    v.style.top = rowY(0) + 'px';
    stage.appendChild(v);
    var hl = document.createElement('div');
    hl.className = 'bracket h';
    hl.style.left = padL + 'px';
    hl.style.top = (rowY(0) - 2) + 'px';
    hl.style.width = (startX + contentW - padL + 10) + 'px';
    stage.appendChild(hl);

    /* 被除数每一位 */
    for(var k2 = 0; k2 < n; k2++){
      var dgEl = putCell(0, k2, D[k2], 'dg', -1);
      if(k2 >= plan.origLen){
        /* 后面添的 0：轮到它了才出现 */
        dgEl.setAttribute('data-step', stepOfSlot(plan, k2));
      }
    }
    if(pointPos < n){
      var dotEl = document.createElement('span');
      dotEl.className = 'd dotcell';
      dotEl.textContent = '.';
      dotEl.style.left = (startX + digitX[pointPos] - DOTW) + 'px';
      dotEl.style.top = rowY(0) + 'px';
      dotEl.setAttribute('data-step', -1);
      stage.appendChild(dotEl);
      plan.dotX = startX + digitX[pointPos] - DOTW;
    }

    /* 按步骤画 */
    var stepIndexOffset = 0;
    for(var s = 0; s < plan.steps.length; s++){
      var st = plan.steps[s];
      if(st.kind === 'normalize'){ continue; }
      if(st.kind === 'start'){
        st.hl = [];
        var mm = st.m || 1;
        for(var hh = 0; hh < mm; hh++){
          if(rowCells[0] && rowCells[0][hh]) st.hl.push(rowCells[0][hh]);
        }
        continue;
      }

      if(st.kind === 'trial'){
        st.hl = [];
        var mlen = String(st.cur).length;
        if(curRow >= 0 && rowCells[curRow]){
          for(var q2 = st.slot - mlen + 1; q2 <= st.slot; q2++){
            if(rowCells[curRow][q2]) st.hl.push(rowCells[curRow][q2]);
          }
        }
      }
      else if(st.kind === 'mul'){
        if(st.q > 0){
          row++;
          var ps = String(st.prod), pl = ps.length;
          for(var z = 0; z < pl; z++){
            putCell(row, st.slot - pl + 1 + z, ps.charAt(z), 'prod', s);
          }
          underline(row, st.slot - pl + 1, st.slot, s);
        }
      }
      else if(st.kind === 'sub'){
        if(st.diff > 0){
          row++;
          var ds = String(st.diff), dl = ds.length;
          for(var z2 = 0; z2 < dl; z2++){
            putCell(row, st.slot - dl + 1 + z2, ds.charAt(z2), 'diff', s);
          }
          curRow = row;
        }else if(st.diff === 0){
          var isFinal = true;
          for(var t2 = s + 1; t2 < plan.steps.length; t2++){
            if(plan.steps[t2].kind === 'bring' && plan.steps[t2].next !== null && plan.steps[t2].next !== undefined){ isFinal = false; break; }
          }
          if(isFinal){
            row++;
            putCell(row, st.slot, '0', 'diff', s);
            curRow = row;
          }else{
            curRow = -1;
          }
        }
      }
      else if(st.kind === 'zero'){
        st.hl = [];
        var ml = String(st.cur).length;
        if(curRow >= 0 && rowCells[curRow]){
          for(var q3 = st.slot - ml + 1; q3 <= st.slot; q3++){
            if(rowCells[curRow][q3]) st.hl.push(rowCells[curRow][q3]);
          }
        }
      }
      else if(st.kind === 'bring'){
        if(st.next !== null && st.next !== undefined){
          if(curRow >= 0){
            putCell(curRow, st.slot + 1, String(st.next), 'bring', s);
          }else{
            row++;
            putCell(row, st.slot + 1, String(st.next), 'bring', s);
            curRow = row;
          }
        }
      }
    }

    /* 商 */
    var qs = plan.qs;
    if(!qs.length){
      /* 一位都不够除：商 0 */
      cell('0', Math.max(0, pointPos - 1), TOP, 'q', 0);
    }
    if(qs.length){
      var minSlot = qs[0].slot, maxSlot = qs[qs.length - 1].slot;
      qs.forEach(function(o){
        cell(String(o.q), o.slot, TOP, 'q', stepOfSlot(plan, o.slot));
      });
      /* 整数部分是空的，补一个 0 */
      if(minSlot >= pointPos && pointPos > 0){
        cell('0', pointPos - 1, TOP, 'q', stepOfSlot(plan, minSlot));
      }
      /* 小数点：跟着「点后面的第一位商」一起出现 */
      if(pointPos < n && maxSlot >= pointPos){
        var firstAfter = null;
        for(var qi = 0; qi < qs.length; qi++){ if(qs[qi].slot >= pointPos){ firstAfter = qs[qi].slot; break; } }
        var qd = document.createElement('span');
        qd.className = 'd dotcell';
        qd.textContent = '.';
        qd.style.left = (startX + digitX[pointPos] - DOTW) + 'px';
        qd.style.top = TOP + 'px';
        qd.setAttribute('data-step', stepOfSlot(plan, firstAfter === null ? pointPos : firstAfter));
        stage.appendChild(qd);
      }
    }

    /* 尺寸 */
    var stageH = rowY(row) + H + 16;
    stage.style.height = stageH + 'px';
    stage.style.width = (startX + contentW + 30) + 'px';
    v.style.height = (rowY(row) + 12 - rowY(0)) + 'px';
  }

  /* 找到某一位商出现的步数 */
  function stepOfSlot(plan, slot){
    for(var i = 0; i < plan.steps.length; i++){
      var st = plan.steps[i];
      if((st.kind === 'trial' || st.kind === 'zero') && st.slot === slot) return i;
    }
    return 0;
  }

  /* ============ 讲解文字 ============ */
  function describe(plan, s){
    var st = plan.steps[s];
    var out = {tag:'', title:'', body:'', eq:'', ladder:null, ok:false};

    out.tag = '第 ' + (s + 1) + ' / ' + plan.steps.length + ' 步';

    if(st.kind === 'normalize'){
      out.title = st.title; out.body = st.body; out.eq = st.eq;
    }
    else if(st.kind === 'start'){
      out.title = st.title; out.body = st.body; out.eq = st.eq;
    }
    else if(st.kind === 'trial'){
      var q = st.q, d = st.d, cur = st.cur, prod = st.prod;
      out.title = '试商：' + cur + ' 里面最多有几个 ' + d + '？';
      if(d < 10){
        out.body = '想 ' + d + ' 的乘法口诀：<b>' + q + ' × ' + d + ' = ' + prod + '</b> 不超过 ' + cur +
                   '；' + (q + 1) + ' × ' + d + ' = ' + ((q + 1) * d) + ' 就超过了。<br>所以这一位商 <b>' + q + '</b>。';
      }else{
        var dr = roundDivisor(d);
        var q0 = Math.floor(cur / dr); if(q0 < 1) q0 = 1; if(q0 > 9) q0 = 9;
        if(q0 === q){
          out.body = '把 ' + d + ' 看作 <b>' + dr + '</b>，' + cur + ' 里大约有 ' + q0 + ' 个 ' + dr + '，先试 ' + q0 +
                     '：<b>' + q0 + ' × ' + d + ' = ' + (q0 * d) + '</b>，不超过 ' + cur + '，正好。';
        }else if(q0 > q){
          out.body = '把 ' + d + ' 看作 <b>' + dr + '</b>，先试 ' + q0 + '：<b>' + q0 + ' × ' + d + ' = ' + (q0 * d) +
                     '</b> 比 ' + cur + ' 大 —— <em>商大了</em>，往小调，改成 <b>' + q + '</b>。';
        }else{
          out.body = '把 ' + d + ' 看作 <b>' + dr + '</b>，先试 ' + q0 + '：' + q0 + ' × ' + d + ' = ' + (q0 * d) +
                     '，减完还剩 ' + (cur - q0 * d) + '，还够一个 ' + d + ' —— <em>商小了</em>，往大调，改成 <b>' + q + '</b>。';
        }
        /* 试商表 */
        var cells = [];
        for(var qq = 1; qq <= 9; qq++){
          var p = qq * d;
          cells.push({q:qq, p:p, hit: qq === q, big: p > cur});
        }
        out.ladder = {cap:'试商表：' + d + ' 的倍数和 ' + cur + ' 比', cells:cells};
      }
      out.eq = q + ' × ' + d + ' = ' + prod + ' ≤ ' + cur;
    }
    else if(st.kind === 'mul'){
      out.title = '乘：' + st.q + ' × ' + st.d + ' = ' + st.prod;
      out.body = '把 <b>' + st.prod + '</b> 对齐写在 ' + st.cur + ' 的下面，<b>末位对齐</b>。';
      out.eq = st.q + ' × ' + st.d + ' = ' + st.prod;
    }
    else if(st.kind === 'sub'){
      out.title = '减：' + st.cur + ' − ' + st.prod + ' = ' + st.diff;
      if(st.diff > 0){
        out.body = '差是 <b>' + st.diff + '</b>，比除数 ' + st.d + ' 小 —— 说明商 ' + st.q + ' 没有再偏小。';
      }else{
        out.body = '正好减完，差是 <b>0</b>。';
      }
      out.eq = st.cur + ' − ' + st.prod + ' = ' + st.diff;
    }
    else if(st.kind === 'zero'){
      out.title = '商 0：' + st.cur + ' 不够 ' + st.d + ' 除';
      out.body = st.cur + ' 比除数 ' + st.d + ' 小，这一位<b>商写 0</b>。0 乘任何数都是 0，所以下面不用写。';
      out.eq = st.cur + ' < ' + st.d + '  →  商 0';
    }
    else if(st.kind === 'bring'){
      if(st.next === null || st.next === undefined){
        out.title = '没有下一位了';
        out.body = '被除数的数位已经用完，' + (st.diff > 0 ? '剩下的 <b>' + st.diff + '</b> 就是余数。' : '正好除完。');
        out.eq = '';
      }else if(st.diff > 0){
        out.title = '落：落下 ' + st.next;
        out.body = '把下一位 <b>' + st.next + '</b> 落下来，接在 ' + st.diff + ' 后面，组成 <b>' +
                   (st.diff * 10 + st.next) + '</b>，继续除。';
        out.eq = st.diff + ' 与 ' + st.next + ' 合成 ' + (st.diff * 10 + st.next);
      }else{
        out.title = '落：落下 ' + st.next;
        out.body = '差是 0，直接把下一位 <b>' + st.next + '</b> 落下来，作为新的被除数。';
        out.eq = '落下 ' + st.next;
      }
    }
    else if(st.kind === 'done'){
      out.title = '写答案';
      out.body = st.body;
      out.eq = st.eq;
      out.ok = true;
    }
    return out;
  }

  /* ============ 状态与交互 ============ */
  var plan = null, idx = 0, timer = null;

  function apply(){
    var stage = document.getElementById('stage');
    var all = stage.querySelectorAll('[data-step]');
    for(var i = 0; i < all.length; i++){
      var el = all[i];
      var s = Number(el.getAttribute('data-step'));
      var show = s <= idx;
      if(el.classList.contains('uline')){
        el.classList.toggle('on', show);
      }else{
        el.classList.toggle('on', show);
      }
      if(el.classList.contains('hl')) el.classList.remove('hl');
    }
    var st = plan.steps[idx];
    if(st && st.hl){
      st.hl.forEach(function(e){ e.classList.add('hl'); });
    }
    var d = describe(plan, idx);
    document.getElementById('tag').textContent = d.tag;
    document.getElementById('title').textContent = d.title;
    document.getElementById('body').innerHTML = d.body;
    document.getElementById('eq').textContent = d.eq;
    document.getElementById('eq').classList.toggle('ok', !!d.ok);

    var box = document.getElementById('ladderBox');
    var lad = document.getElementById('ladder');
    if(d.ladder){
      box.style.display = '';
      document.getElementById('ladderCap').textContent = d.ladder.cap;
      lad.innerHTML = '';
      d.ladder.cells.forEach(function(c){
        var el = document.createElement('div');
        el.className = 'lcell' + (c.hit ? ' hit' : '') + (c.big ? ' big' : '');
        el.innerHTML = c.q + ' × ' + plan.div + ' = ' + c.p + '<small>' + (c.hit ? '选这个' : (c.big ? '超过' : '偏小')) + '</small>';
        lad.appendChild(el);
      });
    }else{
      box.style.display = 'none';
    }

    document.getElementById('bar').style.width = ((idx + 1) / plan.steps.length * 100) + '%';
    document.getElementById('prevBtn').disabled = idx <= 0;
    document.getElementById('nextBtn').disabled = idx >= plan.steps.length - 1;
  }

  function step(n){
    if(!plan) return;
    idx = Math.max(0, Math.min(plan.steps.length - 1, n));
    apply();
  }

  function stopPlay(){
    if(timer){ clearInterval(timer); timer = null; }
    document.getElementById('playBtn').textContent = '播放';
  }

  function start(){
    var a = document.getElementById('inA').value;
    var b = document.getElementById('inB').value;
    var mode = document.getElementById('mDec').classList.contains('on') ? 'decimal' : 'remainder';
    var p = buildPlan(a, b, mode);
    var warn = document.getElementById('warn');
    if(p.error){ warn.textContent = p.error; return; }
    warn.textContent = '';
    plan = p;
    idx = 0;
    stopPlay();
    render(plan);
    apply();
  }

  /* ============ 事件 ============ */
  document.getElementById('goBtn').addEventListener('click', start);
  document.getElementById('nextBtn').addEventListener('click', function(){ stopPlay(); step(idx + 1); });
  document.getElementById('prevBtn').addEventListener('click', function(){ stopPlay(); step(idx - 1); });
  document.getElementById('resetBtn').addEventListener('click', function(){ stopPlay(); step(0); });
  document.getElementById('playBtn').addEventListener('click', function(){
    if(timer){ stopPlay(); return; }
    if(idx >= plan.steps.length - 1) step(0);
    document.getElementById('playBtn').textContent = '暂停';
    timer = setInterval(function(){
      if(idx >= plan.steps.length - 1){ stopPlay(); return; }
      step(idx + 1);
    }, 1300);
  });
  ['inA','inB'].forEach(function(id){
    document.getElementById(id).addEventListener('keydown', function(e){
      if(e.key === 'Enter') start();
    });
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'ArrowRight'){ stopPlay(); step(idx + 1); }
    if(e.key === 'ArrowLeft'){ stopPlay(); step(idx - 1); }
  });
  function setMode(m){
    document.getElementById('mRem').classList.toggle('on', m === 'rem');
    document.getElementById('mDec').classList.toggle('on', m === 'dec');
  }
  document.getElementById('mRem').addEventListener('click', function(){ setMode('rem'); start(); });
  document.getElementById('mDec').addEventListener('click', function(){ setMode('dec'); start(); });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(ch){
    ch.addEventListener('click', function(){
      document.getElementById('inA').value = ch.getAttribute('data-a');
      document.getElementById('inB').value = ch.getAttribute('data-b');
      setMode(ch.getAttribute('data-m'));
      start();
    });
  });

  /* 首次进入（支持 ?a=156&b=12&m=dec&step=8 直接定位） */
  (function(){
    var p = new URLSearchParams(location.search);
    if(p.get('a')) document.getElementById('inA').value = p.get('a');
    if(p.get('b')) document.getElementById('inB').value = p.get('b');
    if(p.get('m') === 'dec') setMode('dec');
    if(p.get('noanim')){
      var st = document.createElement('style');
      st.textContent = '*{transition:none!important}';
      document.head.appendChild(st);
    }
  })();
  start();
  (function(){
    var s = new URLSearchParams(location.search).get('step');
    if(s !== null && s !== '') step(Number(s));
  })();
})();
</script>
</body>
