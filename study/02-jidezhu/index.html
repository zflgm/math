<style>
/* ===== 小学数学动画课 · 公共样式 ===== */
:root{
  --ink:#0f172a;
  --muted:#64748b;
  --line:#e7eaf0;
  --a:#2563eb;
  --a-dk:#1d4ed8;
  --a-lt:#dbeafe;
  --d:#ef4444;

  --b:#f59e0b;

  --s:#94a3b8;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{

.wrap{max-width:1400px;margin:0 auto}

/* ---------- 顶部导航 ---------- */

  color:var(--muted);text-decoration:none;font-size:14px;font-weight:800;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:#fff;transition:.16s;white-space:nowrap;
}
.topbar a:hover{color:var(--ink);border-color:#cbd5e1;background:#fbfcfe}
.topbar .pos{font-size:13px;font-weight:800;color:#9aa6b8;letter-spacing:.05em}
.topbar .sp{flex:1}

/* ---------- header ---------- */
header{margin-bottom:18px}
.kicker{
  display:inline-block;
  font-size:13px;font-weight:700;letter-spacing:.08em;
  color:var(--a);background:#e8efff;
  padding:5px 12px;border-radius:999px;
  margin-bottom:11px;
}
h1{font-size:31px;font-weight:800;letter-spacing:-.01em;line-height:1.22}
h1 .q-mark{color:var(--d)}
.q{margin-top:10px;font-size:20px;line-height:1.7;color:#334155;font-weight:500}
.q b{color:var(--a);font-weight:800}
.q em{font-style:normal;color:var(--d);font-weight:800}

/* ---------- layout ---------- */
.main{
  display:grid;
  grid-template-columns:minmax(0,1.62fr) minmax(330px,.9fr);
  gap:20px;
  align-items:start;
}
@media (max-width:1040px){ .main{grid-template-columns:1fr} }

/* ---------- stage ---------- */
.stage-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:14px 16px 8px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);
}
svg{display:block;width:100%;height:auto;overflow:visible}

.tag.sm{font-size:17px;font-weight:700;fill:#64748b}
.val{font-size:27px;font-weight:800;fill:#fff}
.valDark{font-size:24px;font-weight:800;fill:#0f172a}
.hintTxt{font-size:17px;font-weight:700;fill:#94a3b8}

/* ---------- side panel ---------- */
.side{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px 22px 20px;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -18px rgba(15,23,42,.22);

  display:flex;flex-direction:column;
}
.steptag{

  font-variant-numeric:tabular-nums;
}
.side h2{margin-top:10px;font-size:23px;font-weight:800;line-height:1.4;letter-spacing:-.01em}
.side p{margin-top:12px;font-size:17px;line-height:1.85;color:#3f4b5f}
.side p b{color:var(--a);font-weight:800}
.side p em{font-style:normal;color:var(--d);font-weight:800}
.side p i{font-style:normal;color:var(--ok);font-weight:800}
.eqbox{margin-top:auto;padding-top:18px}
.eq{
  background:#f8fafc;
  border:1px solid #eef1f6;
  border-left:4px solid var(--a);
  border-radius:10px;
  padding:14px 16px;
  font-size:20px;font-weight:800;
  line-height:1.85;
  font-variant-numeric:tabular-nums;
  color:#0f172a;
  white-space:pre-line;
}
.eq .hl{color:var(--d)}
.eq .ok{color:var(--ok)}

/* ---------- controls ---------- */
.controls{margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{
  appearance:none;border:1px solid var(--line);background:#fff;
  color:var(--ink);font-size:16px;font-weight:800;
  padding:11px 20px;border-radius:11px;cursor:pointer;

}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f8fafc}

.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{

.btn.primary:hover:not(:disabled){background:var(--a-dk);border-color:var(--a-dk)}

.dot:hover{background:#b6bfcd}
.dot.on{background:var(--a);width:24px;border-radius:5px}
.spacer{flex:1}
.kbd{font-size:13px;color:#94a3b8;font-weight:600}

  border-bottom-width:2px;border-radius:5px;padding:1px 6px;

}

/* ---------- 底部提醒条 ---------- */
.foot{
  margin-top:16px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px 20px;

/* ---------- 动画（全站统一） ---------- */
svg rect, svg text, svg g, svg circle{

.note{font-size:17px;font-weight:700;fill:#94a3b8}
.axis{stroke:#cbd5e1;stroke-width:2}
svg line{transition:opacity .44s ease, stroke .34s ease, x1 .5s ease, x2 .5s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.fi{animation:fi .4s ease both}
@keyframes draw{to{stroke-dashoffset:0}}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.5s cubic-bezier(.4,0,.2,1) forwards}
.draw.d1{animation-delay:.15s}
.draw.d2{animation-delay:.45s}
.draw.d3{animation-delay:.75s}

.sw{cursor:pointer}
.sw rect.body{transition:fill .3s ease, stroke .3s ease}
</style>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';

  function mk(tag, a, p){
    const e = document.createElementNS(NS, tag);
    for(const k in a) e.setAttribute(k, a[k]);
    if(p) p.appendChild(e);
    return e;
  }
  function tx(p, x, y, s, o){
    o = o || {};
    const t = mk('text', {
      x, y,
      'text-anchor': o.anchor || 'middle',
      'font-size': o.size || 18,
      'font-weight': o.w || 700,
      fill: o.fill || '#64748b'
    }, p);
    t.textContent = s;
    return t;
  }
  // Catmull-Rom → 贝塞尔，把点列连成平滑曲线
  function smooth(pts){
    if(pts.length < 2) return '';
    let d = 'M' + pts[0][0].toFixed(1) + ',' + pts[0][1].toFixed(1);
    for(let i = 0; i < pts.length - 1; i++){
      const p0 = pts[i-1] || pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2] || p2;
      const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
      const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
      d += ' C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' +
                  c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' +
                  p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
    }
    return d;
  }

  /* =========================================================
     S1　遗忘曲线
     ========================================================= */
  (function(){
    const pts = [[0,100],[0.01,74],[0.03,59],[0.07,50],[0.15,44],[0.3,39],[0.6,36],[1,33],[2,28],[4,24],[6,21]];

      eq: '一本书、一份笔记、一张表\n用到四轮走完'
    },
    {

    },
    {

         '不睡，这一步就没做 —— 第二天那些东西还是一堆散件，用不上。<br><br>' +

         '同样 20 分钟，放在睡前比放在下午值钱。<br><br>' +
         '三个条件：只过<b>当天要背的那一点</b>；过完<b>立刻睡</b>，中间不碰手机；' +
         '<b>不用真的睡着</b> —— 关键不是入睡，是停止往脑子里输新东西。',
      eq: '把最难背的那张表\n挪到睡前 20 分钟'
    },
    {
      sc: 'sc9',
      t: '三个开关，打开就更肯记',

         '人在轻度饥饿、身体在动、环境偏冷的时候，警觉度高，脑子更适合记东西。' +
         '<br><br>点一下开关，看效率条怎么涨。',

    {
      sc: 'sc10',
      t: '别等有干劲了才开始',
      h: '干劲不是等来的，是<b>做出来的</b>。<br><br>' +
         '顺序是反的：<b>先坐下学 10 分钟，干劲才起来</b>。<br><br>' +
         '一直等「今天状态好」的人，永远等不到那一天。',
      eq: '先坐下\n10 分钟后再评价'
    },
    {
      sc: 'sc11',
      t: '参考书，一本就够',

         '一套教辅、一本错题本，用到期末。想加，只加<b>同一体系</b>的，别混着来。',

    },

         '<b>发挥长处</b>，实在学不会的那部分，可以不去管它。<br><br>' +
         '原因有两个：强科提分最快；一门课做到「很好」之后，<b>那套方法能搬到别的科目</b>。',
      eq: '补差可以\n但别把强科的时间挪走'
    },
    {
      sc: 'sc13',
      t: '一大段，拆开背',
      h: '脑子一次只能装<b>七八样</b>。一整段摆在那儿，光看着就累，还没开始就先泄气。<br><br>' +
         '拆成 3–5 小段，<b>每段背完立刻合书说一遍</b>，说完再下一段。<br>' +
         '别整段读完再回头。',
      eq: '小段 + 立刻回想\n比整段硬啃快得多'
    },
    {
      sc: 'sc14',
      t: '忘掉之后，剩下的才是学到的',
      h: '知识记忆会忘（公式、单词、年代），<b>方法记忆几乎不退化</b> —— ' +
         '怎么看问题、怎么下手、怎么拆。<br><br>' +
         '所以做题不是「检查」，它本身就是<b>巩固</b>：从脑子里取一次，痕迹就深一次。',
      eq: '光看不做\n是最亏的学法'
    },
    {
      sc: 'sc15',
      t: '这一课的表：贴书桌',
      h: '七行，全是动作，不讲道理。<br><br>' +
         '橙色那行（课前看错题）<b>不是书上的</b>，是我给你加的规矩 —— ' +
         '被问到出处，就说这是我带学生的做法。',
      eq: '每天打钩\n下次课带过来'
    }
  ];

  const SHOW_DATES = 3;   // 第 4 步点亮四个日期

  let cur = 0;

  function render(){
    STEPS.forEach((s, i) => {
      $(s.sc).classList.toggle('on', i === cur);
    });
    const s = STEPS[cur];
    $('steptag').textContent = '第 ' + (cur + 1) + ' 步 / 共 ' + STEPS.length + ' 步';
    $('t').textContent = s.t;
    $('h').innerHTML = s.h;
    $('eq').innerHTML = s.eq;

    $('prev').disabled = cur === 0;
    $('next').disabled = cur === STEPS.length - 1;
    $('next').textContent = cur === STEPS.length - 1 ? '讲完了' : '下一步 →';
    [...$('dots').children].forEach((d, i) => d.classList.toggle('on', i === cur));

    const on = cur >= SHOW_DATES;
    ['d1','d2','d3','d4'].forEach(id => $(id).classList.toggle('on', on));

    // 重播 CSS 动画
    const sc = $(s.sc);
    sc.querySelectorAll('.draw').forEach(el => {
      el.style.animation = 'none';
      el.getBoundingClientRect();
      el.style.animation = '';
    });
  }

  function go(k){
    k = Math.max(0, Math.min(STEPS.length - 1, k));
    if(k === cur) return;
    cur = k;
    render();
  }

  $('prev').addEventListener('click', () => go(cur - 1));
  $('next').addEventListener('click', () => go(cur + 1));
  STEPS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.title = '第 ' + (i + 1) + ' 步';
    d.addEventListener('click', () => go(i));
    $('dots').appendChild(d);
  });

  document.addEventListener('keydown', e => {
    if(e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(cur + 1); }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); go(cur - 1); }
  });

  render();
})();
</script>
